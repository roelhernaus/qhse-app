<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Beheer Personeel</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim: color-mix(in srgb, var(--accent) 10%, transparent); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs{ display:flex; gap:8px; }
  .tab{ padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  input, select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .card.klikbaar{ cursor:pointer; }
  .card.klikbaar:hover{ border-color:var(--accent); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .tag.rol-admin{ background:var(--red-dim); color:var(--red); }
  .tag.rol-kam, .tag.rol-hr{ background:var(--amber-dim); color:var(--amber); }
  .tag.uit-dienst{ background:var(--red-dim); color:var(--red); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  .callout{ background:var(--amber-dim); color:var(--amber); font-size:12.5px; padding:12px 14px; border-radius:8px; margin-bottom:18px; line-height:1.5; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit scherm is alleen voor Admin, HR of KAM. Jouw account heeft die rol niet.</p>
    <button class="ghost btn-uitloggen-lokaal" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Personeel</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>

  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  const APP_URL = "https://mijn.appvoorveiligheid.nl";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  // Binnen de schil geopend? Dan hoort uitloggen via de schil zelf te gaan,
  // niet via deze losse knop (die anders alleen dit venster resette, terwijl
  // de schil eromheen nergens van wist).
  if(window.self !== window.top){
    const verbergUitlogKnoppenLokaal = () => {
      document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none');
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', verbergUitlogKnoppenLokaal);
    } else {
      verbergUitlogKnoppenLokaal();
    }
  }

  let huidigProfiel = null;
  let scherm = 'lijst'; // 'lijst' | 'bewerken'
  let actiefProfielId = null;
  const ROLLEN = ['medewerker','leidinggevende','kam','hr','admin','keurmeester','beheerder_kantoor','extern'];
  const INTERNE_ROLLEN = ROLLEN.filter(r => r !== 'extern');

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }

  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    supabaseClient.from('organisaties').select('accentkleur').eq('id', profiel.organisatie_id).single()
      .then(({ data: kleurOrg }) => { if(kleurOrg && kleurOrg.accentkleur){ document.documentElement.style.setProperty('--accent', kleurOrg.accentkleur); } });
    document.getElementById('login-scherm').classList.add('verborgen');

    if(!['admin','hr','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    scherm = 'lijst';
    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'bewerken') inhoud.innerHTML = await renderBewerken();
    else if(scherm === 'nieuweAanwijzing') inhoud.innerHTML = await renderNieuweAanwijzing();
    else if(scherm === 'soorten') inhoud.innerHTML = await renderAanwijzingSoorten();
    else if(scherm === 'nieuweAanwijzingSoort') inhoud.innerHTML = renderNieuweAanwijzingSoort();
    else if(scherm === 'uitnodigingen') inhoud.innerHTML = await renderUitnodigingen();
    else if(scherm === 'bulkImport') inhoud.innerHTML = renderBulkImport();
  }

  let personeelSortering = 'achternaam';

  async function renderLijst(){
    const sorteerVeld = personeelSortering === 'nummer' ? 'personeelsnummer' : 'achternaam';
    const { data: profielen, error } = await supabaseClient
      .from('profielen').select('*').order(sorteerVeld, { nullsFirst: false });
    if(error) return '<div class="fout">Kon personeel niet laden: ' + error.message + '</div>';
    const rows = (profielen||[]).map(p => `
      <div class="card klikbaar" onclick="openBewerken('${p.id}')">
        <div class="row">
          <div>
            <b>${p.voornaam} ${p.achternaam}</b>
            <div class="meta" style="margin-top:3px">${p.personeelsnummer || 'geen personeelsnummer'}</div>
          </div>
          <div style="text-align:right">
            <span class="tag rol-${p.rol}">${p.rol}</span>
            ${!p.in_dienst ? '<div class="tag uit-dienst" style="margin-top:4px">Inactief</div>' : ''}
          </div>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen medewerkers.</div>';
    return `
      <div class="row" style="margin-bottom:12px">
        <span class="meta">${(profielen||[]).length} medewerkers</span>
        <button class="ghost" onclick="scherm='uitnodigingen'; render();">Uitnodigingen</button>
        <button class="ghost" onclick="scherm='bulkImport'; render();">📥 Bulk importeren</button>
        <a href="qhse-beheer-vestigingen.html" style="text-decoration:none;"><button class="ghost">Regio's &amp; Vestigingen</button></a>
      </div>
      <div class="tabs" style="margin-bottom:14px">
        <div class="tab ${personeelSortering==='achternaam'?'actief':''}" onclick="personeelSortering='achternaam'; render();">Sorteer op achternaam</div>
        <div class="tab ${personeelSortering==='nummer'?'actief':''}" onclick="personeelSortering='nummer'; render();">Sorteer op personeelsnummer</div>
      </div>
      ${rows}
    `;
  }

  async function openBewerken(id){
    actiefProfielId = id;
    scherm = 'bewerken';
    await render();
  }

  async function renderBewerken(){
    const { data: p, error } = await supabaseClient.from('profielen').select('*').eq('id', actiefProfielId).single();
    if(error) return '<div class="fout">Kon profiel niet laden: ' + error.message + '</div>';

    const { data: vestigingenLijst } = await supabaseClient.from('vestigingen').select('id, naam').order('naam');
    if(p.leidinggevende_id){
      const { data: leiding } = await supabaseClient.from('profielen').select('voornaam, achternaam').eq('id', p.leidinggevende_id).maybeSingle();
      p.leidinggevende = leiding;
    }

    const { data: aanwijzingen } = await supabaseClient
      .from('aanwijzingen').select('*, aanwijzing_soorten(naam), keuringscategorieen(naam)').eq('profiel_id', actiefProfielId).order('aangemaakt_op', { ascending:false });
    const vandaag = new Date().toISOString().slice(0,10);
    const aanwijzingenHtml = (aanwijzingen||[]).map(a => {
      const verlopen = a.geldig_tot && a.geldig_tot < vandaag;
      return `
        <div class="card">
          <div class="row">
            <span><b>${a.aanwijzing_soorten ? a.aanwijzing_soorten.naam : '—'}</b>${a.keuringscategorieen ? ' · ' + a.keuringscategorieen.naam : ''}</span>
            ${a.geldig_tot ? `<span class="tag" style="${verlopen ? 'background:var(--red-dim); color:var(--red);' : 'background:var(--green-dim); color:var(--green);'}">${verlopen ? 'Verlopen sinds' : 'Geldig tot'} ${new Date(a.geldig_tot).toLocaleDateString('nl-NL')}</span>` : `<span class="tag" style="background:var(--green-dim); color:var(--green);">Verloopt niet</span>`}
          </div>
          <div class="row" style="margin-top:8px">
            <button class="ghost" onclick="bekijkAanwijzing('${a.pdf_pad}')">📄 Certificaat bekijken</button>
            <button class="ghost" onclick="verwijderAanwijzing('${a.id}')">Verwijderen</button>
          </div>
        </div>`;
    }).join('') || '<div class="meta">Nog geen aanwijzingen vastgelegd.</div>';

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Voornaam</label>
        <input type="text" id="bewVoornaam" value="${p.voornaam || ''}">
        <label>Achternaam</label>
        <input type="text" id="bewAchternaam" value="${p.achternaam || ''}">
        <label>Personeelsnummer</label>
        <input type="text" id="bewPersoneelsnr" value="${p.personeelsnummer || ''}">
        <label>Functie/titel</label>
        <input type="text" id="bewFunctie" value="${p.functie || ''}" placeholder="Bijv. 'Uitvoerder' of 'Steigerbouwer'">
        <label>Vestiging</label>
        <select id="bewVestiging">
          <option value="">— geen vestiging —</option>
          ${(vestigingenLijst||[]).map(v => `<option value="${v.id}" ${p.vestiging_id===v.id?'selected':''}>${v.naam}</option>`).join('')}
        </select>
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px">
          <input type="checkbox" id="bewIsLeidinggevende" style="width:auto" ${p.is_leidinggevende?'checked':''}> Is leidinggevende
        </label>
        <label>Leidinggevende van deze persoon</label>
        <input type="text" id="bewLeidinggevendeZoek" placeholder="Typ een naam om te zoeken…" value="${p.leidinggevende ? p.leidinggevende.voornaam + ' ' + p.leidinggevende.achternaam : ''}" oninput="zoekLeidinggevende(this.value)" autocomplete="off">
        <input type="hidden" id="bewLeidinggevendeId" value="${p.leidinggevende_id || ''}">
        <div id="leidinggevendeResultaten" style="position:relative;"></div>
        ${p.leidinggevende_id ? `<button class="ghost" style="margin-top:6px" onclick="document.getElementById('bewLeidinggevendeZoek').value=''; document.getElementById('bewLeidinggevendeId').value='';">Koppeling verwijderen</button>` : ''}
        <label>Rol</label>
        <select id="bewRol">
          ${ROLLEN.map(r => `<option value="${r}" ${p.rol===r?'selected':''}>${r}</option>`).join('')}
        </select>
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px">
          <input type="checkbox" id="bewInDienst" style="width:auto" ${p.in_dienst?'checked':''}> Account actief
        </label>
        <div class="meta" style="margin-top:2px">Staat dit uit, dan kan deze persoon niet meer inloggen en telt diegene niet meer mee in het medewerkersaantal — alle historie blijft gewoon bewaard.</div>
        <label>Datum in dienst</label>
        <input type="date" id="bewDatumInDienst" value="${p.datum_in_dienst || ''}">
        <label>Datum uit dienst (indien van toepassing)</label>
        <input type="date" id="bewDatumUitDienst" value="${p.datum_uit_dienst || ''}">
        <div class="meta" style="margin-top:4px">Deze datums bepalen mee hoeveel WPI/MBB deze persoon "year to date" redelijkerwijs kan hebben gedaan in het Compliance-dashboard.</div>

        <label style="margin-top:20px">Wachtwoord</label>
        <div class="meta" style="margin-bottom:8px">Laatst gewijzigd: ${p.wachtwoord_laatst_gewijzigd ? new Date(p.wachtwoord_laatst_gewijzigd).toLocaleDateString('nl-NL') : 'onbekend'}${p.moet_wachtwoord_wijzigen ? ' · <b style="color:var(--red)">moet bij volgende keer inloggen wijzigen</b>' : ''}</div>
        <button class="ghost" onclick="dwingWachtwoordAf('${p.id}')" ${p.moet_wachtwoord_wijzigen ? 'disabled' : ''}>${p.moet_wachtwoord_wijzigen ? 'Al afgedwongen' : 'Wachtwoordwijziging afdwingen'}</button>
        <div class="meta" style="margin-top:4px">Deze persoon moet dan bij de eerstvolgende keer inloggen eerst een nieuw wachtwoord instellen, voordat de app verder toegankelijk is.</div>
        <label>WPI-streefaantal (leeg = organisatiestandaard)</label>
        <input type="number" id="bewWpiStreef" min="0" value="${p.wpi_streefaantal_override ?? ''}" placeholder="Standaard gebruiken">
        <label>MBB-streefaantal (leeg = organisatiestandaard)</label>
        <input type="number" id="bewMbbStreef" min="0" value="${p.mbb_streefaantal_override ?? ''}" placeholder="Standaard gebruiken">
        <div class="row" style="margin-top:18px">
          <span></span>
          <button class="primary" onclick="opslaan('${p.id}')">Opslaan</button>
        </div>
        <div class="fout verborgen" id="bewFout"></div>
        <div class="melding verborgen" id="bewMelding"></div>
      </div>

      <div class="row" style="margin-top:22px">
        <div class="eyebrow" style="margin-top:0">Aanwijzingen &amp; certificaten</div>
        <button class="ghost" onclick="scherm='soorten'; render();">Soorten beheren</button>
      </div>
      <button class="primary" style="margin-bottom:10px" onclick="nieuweAanwijzing()">+ Aanwijzing toevoegen</button>
      ${aanwijzingenHtml}
    `;
  }

  async function dwingWachtwoordAf(id){
    if(!confirm('Deze persoon moet dan bij de eerstvolgende keer inloggen eerst een nieuw wachtwoord instellen. Doorgaan?')) return;
    const { error } = await supabaseClient.from('profielen').update({ moet_wachtwoord_wijzigen: true }).eq('id', id);
    if(error){ alert('Mislukt: ' + error.message); return; }
    await render();
  }

  let leidinggevendeZoekTimer = null;
  function zoekLeidinggevende(tekst){
    clearTimeout(leidinggevendeZoekTimer);
    const resultatenEl = document.getElementById('leidinggevendeResultaten');
    if(!tekst || tekst.trim().length < 2){ resultatenEl.innerHTML = ''; return; }
    leidinggevendeZoekTimer = setTimeout(async () => {
      const { data: gevonden } = await supabaseClient
        .from('profielen').select('id, voornaam, achternaam, functie')
        .neq('id', actiefProfielId)
        .or(`voornaam.ilike.%${tekst}%,achternaam.ilike.%${tekst}%`)
        .order('achternaam').limit(8);
      resultatenEl.innerHTML = `
        <div style="position:absolute; top:2px; left:0; right:0; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,0.08); z-index:10; max-height:220px; overflow-y:auto;">
          ${(gevonden||[]).map(g => `
            <div class="klikbaar" style="padding:9px 12px; font-size:13px;" onclick="kiesLeidinggevende('${g.id}', '${(g.voornaam+' '+g.achternaam).replace(/'/g,"\\'")}')">
              <b>${g.voornaam} ${g.achternaam}</b>${g.functie ? ` <span class="meta">· ${g.functie}</span>` : ''}
            </div>
          `).join('') || '<div class="meta" style="padding:9px 12px;">Niemand gevonden.</div>'}
        </div>
      `;
    }, 250);
  }
  function kiesLeidinggevende(id, naam){
    document.getElementById('bewLeidinggevendeId').value = id;
    document.getElementById('bewLeidinggevendeZoek').value = naam;
    document.getElementById('leidinggevendeResultaten').innerHTML = '';
  }

  async function opslaan(id){
    const voornaam = document.getElementById('bewVoornaam').value.trim();
    const achternaam = document.getElementById('bewAchternaam').value.trim();
    const personeelsnummer = document.getElementById('bewPersoneelsnr').value.trim() || null;
    const functie = document.getElementById('bewFunctie').value.trim() || null;
    const vestiging_id = document.getElementById('bewVestiging').value || null;
    const is_leidinggevende = document.getElementById('bewIsLeidinggevende').checked;
    const leidinggevende_id = document.getElementById('bewLeidinggevendeId').value || null;
    const rol = document.getElementById('bewRol').value;
    const in_dienst = document.getElementById('bewInDienst').checked;
    const datum_in_dienst = document.getElementById('bewDatumInDienst').value || null;
    const datum_uit_dienst = document.getElementById('bewDatumUitDienst').value || null;
    const wpiStreefRaw = document.getElementById('bewWpiStreef').value;
    const mbbStreefRaw = document.getElementById('bewMbbStreef').value;
    const wpi_streefaantal_override = wpiStreefRaw === '' ? null : parseInt(wpiStreefRaw);
    const mbb_streefaantal_override = mbbStreefRaw === '' ? null : parseInt(mbbStreefRaw);
    const foutEl = document.getElementById('bewFout');
    const meldingEl = document.getElementById('bewMelding');
    foutEl.classList.add('verborgen');
    meldingEl.classList.add('verborgen');
    if(!voornaam || !achternaam){
      foutEl.textContent = 'Voor- en achternaam mogen niet leeg zijn.';
      foutEl.classList.remove('verborgen');
      return;
    }
    if(leidinggevende_id === id){
      foutEl.textContent = 'Iemand kan niet zijn eigen leidinggevende zijn.';
      foutEl.classList.remove('verborgen');
      return;
    }

    const { error } = await supabaseClient.from('profielen')

  async function opslaanNieuweAanwijzing(){
    const soort_id = document.getElementById('naSoort').value;
    const categorieVeld = document.getElementById('naCategorie');
    const keuringscategorie_id = (categorieVeld && !document.getElementById('naCategorieBlok').classList.contains('verborgen')) ? (categorieVeld.value || null) : null;

      foutEl.textContent = 'Kies een keuringscategorie voor deze soort.'; foutEl.classList.remove('verborgen'); return;

  function genereerCode(){

  const PAKKETGRENZEN = [10, 50, 100, 250];

  async function nieuweUitnodiging(){
    if(uitnodigingType === 'intern'){
      const { count } = await supabaseClient.from('profielen').select('*', { count:'exact', head:true })
        .eq('organisatie_id', huidigProfiel.organisatie_id).eq('in_dienst', true).neq('rol', 'extern');
      if(PAKKETGRENZEN.includes(count)){
        const doorgaan = confirm(
          `Dit wordt account nummer ${count + 1} — daarmee kom je in een hoger pakket terecht, wat extra kosten met zich meebrengt.\n\n` +
          `Check voordat je doorgaat:\n` +
          `• Zijn al je huidige accounts nog echt in gebruik? (medewerkers die uit dienst zijn kun je op inactief zetten, die tellen dan niet meer mee)\n` +
          `• Is er mogelijk een nieuwe inkooporder (PO) nodig binnen jullie eigen organisatie?\n\n` +
          `Toch doorgaan met het aanmaken van dit account?`
        );
        if(!doorgaan) return;
      }
    }
    const omschrijving = document.getElementById('uiOmschrijving').value.trim() || null;
    const code = genereerCode();
    const payload = { organisatie_id: huidigProfiel.organisatie_id, code, omschrijving, aangemaakt_door: huidigProfiel.id };
    if(uitnodigingType === 'intern'){
      payload.rol = document.getElementById('uiRol').value;

    if(error){ alert('Aanmaken mislukt: ' + error.message); return; }
    await render();
  }

  async function verwerkBulkImport(){
    const input = document.getElementById('bulkBestand');
    const statusEl = document.getElementById('bulkStatus');
    const foutEl = document.getElementById('bulkFout');
    foutEl.classList.add('verborgen');
    if(!input.files[0]){ foutEl.textContent = 'Kies eerst een bestand.'; foutEl.classList.remove('verborgen'); return; }

    statusEl.textContent = 'Bestand lezen…';
    const data = await input.files[0].arrayBuffer();
    const wb = XLSX.read(data);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rijen = XLSX.utils.sheet_to_json(ws);

    const { data: vestigingen } = await supabaseClient.from('vestigingen').select('id, naam').eq('organisatie_id', huidigProfiel.organisatie_id);
    const vestigingMap = {};
    (vestigingen||[]).forEach(v => { vestigingMap[v.naam.trim().toLowerCase()] = v.id; });
    const geldigeRollen = ['medewerker','leidinggevende','kam','hr','admin','keurmeester','beheerder_kantoor'];

    // ---- Bestaand personeel en al openstaande, nog niet gebruikte uitnodigingen ophalen, voor de dubbelingscontrole ----
    statusEl.textContent = 'Controleren op dubbelingen…';
    const { data: bestaandPersoneel } = await supabaseClient.from('profielen')
      .select('voornaam, achternaam, personeelsnummer').eq('organisatie_id', huidigProfiel.organisatie_id);
    const { data: openstaandeUitnodigingen } = await supabaseClient.from('interne_uitnodigingen')
      .select('voorgevuld_voornaam, voorgevuld_achternaam, voorgevuld_personeelsnummer').eq('organisatie_id', huidigProfiel.organisatie_id).eq('gebruikt', false);

    const bestaandePersoneelsnummers = new Set((bestaandPersoneel||[]).map(p => (p.personeelsnummer||'').trim().toLowerCase()).filter(Boolean));
    const bestaandeNamen = new Set((bestaandPersoneel||[]).map(p => (p.voornaam+' '+p.achternaam).trim().toLowerCase()));
    const openstaandePersoneelsnummers = new Set((openstaandeUitnodigingen||[]).map(u => (u.voorgevuld_personeelsnummer||'').trim().toLowerCase()).filter(Boolean));
    const openstaandeNamen = new Set((openstaandeUitnodigingen||[]).map(u => (u.voorgevuld_voornaam+' '+u.voorgevuld_achternaam).trim().toLowerCase()));

    const aangemaakt = [];
    const mislukt = [];
    const waarschuwingen = [];
    const personeelsnummersInDezeUpload = new Set();

    for(let i=0; i<rijen.length; i++){
      const r = rijen[i];
      const voornaam = (r['Voornaam']||'').toString().trim();
      const achternaam = (r['Achternaam']||'').toString().trim();
      if(!voornaam || !achternaam){ mislukt.push({ rij: i+2, reden: 'Voornaam of achternaam ontbreekt' }); continue; }

      statusEl.textContent = `Verwerken… (${i+1}/${rijen.length})`;
      const email = (r['E-mailadres (optioneel)']||'').toString().trim();
      const personeelsnummer = (r['Personeelsnummer (optioneel)']||'').toString().trim() || null;
      const personeelsnummerKey = (personeelsnummer||'').toLowerCase();
      const naamKey = (voornaam+' '+achternaam).toLowerCase();
      const functie = (r['Functie (optioneel)']||'').toString().trim() || null;
      let rol = (r['Rol (optioneel, standaard: medewerker)']||'').toString().trim().toLowerCase();
      if(!geldigeRollen.includes(rol)) rol = 'medewerker';
      const vestigingNaam = (r['Vestiging (optioneel, exacte naam)']||'').toString().trim().toLowerCase();
      const vestiging_id = vestigingMap[vestigingNaam] || null;

      // ---- Harde blokkade: dubbel personeelsnummer ----
      if(personeelsnummer){
        if(personeelsnummersInDezeUpload.has(personeelsnummerKey)){
          mislukt.push({ rij: i+2, reden: `Personeelsnummer "${personeelsnummer}" komt dubbel voor in deze upload` }); continue;
        }
        if(bestaandePersoneelsnummers.has(personeelsnummerKey)){
          mislukt.push({ rij: i+2, reden: `Personeelsnummer "${personeelsnummer}" bestaat al bij een actief personeelslid` }); continue;
        }
        if(openstaandePersoneelsnummers.has(personeelsnummerKey)){
          mislukt.push({ rij: i+2, reden: `Personeelsnummer "${personeelsnummer}" heeft al een openstaande, nog niet gebruikte uitnodiging` }); continue;
        }
        personeelsnummersInDezeUpload.add(personeelsnummerKey);
      }

      // ---- Zachte waarschuwing: gelijke naam (kan legitiem zijn, dus geen blokkade) ----
      if(bestaandeNamen.has(naamKey)){
        waarschuwingen.push({ rij: i+2, tekst: `"${voornaam} ${achternaam}" komt al voor bij bestaand personeel — controleer of dit niet dezelfde persoon is` });
      } else if(openstaandeNamen.has(naamKey)){
        waarschuwingen.push({ rij: i+2, tekst: `"${voornaam} ${achternaam}" heeft al een openstaande uitnodiging staan` });
      }

      const code = genereerUitnodigingsCode();
      const { error } = await supabaseClient.from('interne_uitnodigingen').insert({
        organisatie_id: huidigProfiel.organisatie_id, code, rol, aangemaakt_door: huidigProfiel.id,
        omschrijving: `Bulk-import: ${voornaam} ${achternaam}`,
        voorgevuld_voornaam: voornaam, voorgevuld_achternaam: achternaam, voorgevuld_email: email || null,
        voorgevuld_personeelsnummer: personeelsnummer, voorgevuld_functie: functie, voorgevuld_vestiging_id: vestiging_id
      });
      if(error){ mislukt.push({ rij: i+2, reden: error.message }); continue; }

      aangemaakt.push({ voornaam, achternaam, email, code, link: `${APP_URL}/qhse-registreren.html?code=${code}` });
    }

    bulkImportResultaten = { rijen: aangemaakt, mislukt, waarschuwingen };
    statusEl.textContent = '';
    await render();
  }

  function downloadBulkResultaten(){
    const ws = XLSX.utils.json_to_sheet(bulkImportResultaten.rijen.map(r => ({
      Voornaam: r.voornaam, Achternaam: r.achternaam, 'E-mailadres': r.email, Code: r.code, Registratielink: r.link
    })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Uitnodigingen');
    XLSX.writeFile(wb, 'personeel-import-resultaten.xlsx');
  }
</script>
</body>
