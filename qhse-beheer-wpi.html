<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — WPI &amp; MBB</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --red:#c0392b; --red-dim:#fbeae8;
    --green:#1c9468; --green-dim:#d3f1e3; --amber:#b57a10; --amber-dim:#f6e3bd;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.ghost{ background:transparent; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .klikbaar{ cursor:pointer; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input, select, textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit scherm is alleen voor Admin of KAM.</p>
    <button class="ghost btn-uitloggen-lokaal" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>WPI &amp; MBB</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  // Binnen de schil geopend? Dan hoort uitloggen via de schil zelf te gaan,
  // niet via deze losse knop (die anders alleen dit venster resette, terwijl
  // de schil eromheen nergens van wist).
  if(window.self !== window.top){
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none');
    });
  }

  let huidigProfiel = null;
  let scherm = 'lijst'; // 'lijst' | 'formulier' | 'nieuw'
  let soortActief = 'wpi'; // 'wpi' | 'mbb'
  let actiefFormulierId = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }

  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    await render();
  }

  let hoofdScherm = 'formulieren'; // 'formulieren' | 'bezoeken'

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(hoofdScherm === 'bezoeken'){
      if(scherm === 'bezoekDetail') inhoud.innerHTML = await renderBezoekDetail();
      else if(scherm === 'pdfExport') inhoud.innerHTML = await renderPdfExport();
      else inhoud.innerHTML = await renderBezoekenLijst();
      return;
    }
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'nieuw') inhoud.innerHTML = renderNieuw();
    else if(scherm === 'formulier') inhoud.innerHTML = await renderFormulier();
  }

  function kiesHoofdScherm(keuze){
    hoofdScherm = keuze;
    scherm = 'lijst';
    render();
  }

  function kiesSoort(soort){
    soortActief = soort;
    scherm = 'lijst';
    render();
  }

  async function renderLijst(){
    const { data: formulieren, error } = await supabaseClient.from('wpi_formulieren').select('*').eq('soort', soortActief).order('naam');
    if(error) return '<div class="fout">Kon formulieren niet laden: ' + error.message + '</div>';
    const rows = (formulieren||[]).map(f => `
      <div class="card klikbaar" onclick="openFormulier('${f.id}')">
        <div class="row">
          <b>${f.naam}</b>
          <span class="tag" style="${f.actief ? 'background:var(--green-dim); color:var(--green);' : ''}">${f.actief ? 'Actief' : 'Inactief'}</span>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen formulieren.</div>';

    return `
      ${renderHoofdTabs()}
      <div class="tabs">
        <div class="tab ${soortActief==='wpi'?'actief':''}" onclick="kiesSoort('wpi')">WPI</div>
        <div class="tab ${soortActief==='mbb'?'actief':''}" onclick="kiesSoort('mbb')">MBB</div>
      </div>
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(formulieren||[]).length} formulieren</span>
        <button class="primary" onclick="scherm='nieuw'; render();">+ Nieuw formulier</button>
      </div>
      ${rows}
    `;
  }

  function renderHoofdTabs(){
    return `
      <div class="row" style="margin-bottom:14px">
        <div class="tabs">
          <div class="tab ${hoofdScherm==='formulieren'?'actief':''}" onclick="kiesHoofdScherm('formulieren')">Formulieren</div>
          <div class="tab ${hoofdScherm==='bezoeken'?'actief':''}" onclick="kiesHoofdScherm('bezoeken')">Bezoeken</div>
        </div>
      </div>
    `;
  }

  function renderNieuw(){
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Naam van het formulier</label>
        <input type="text" id="nfNaam" placeholder="Bijv. 'Algemene werkplekinspectie'">
        <div class="row" style="margin-top:16px">
          <span></span>
          <button class="primary" onclick="opslaanNieuwFormulier()">Aanmaken</button>
        </div>
        <div class="fout verborgen" id="nfFout"></div>
      </div>
    `;
  }

  async function opslaanNieuwFormulier(){
    const naam = document.getElementById('nfNaam').value.trim();
    const foutEl = document.getElementById('nfFout');
    foutEl.classList.add('verborgen');
    if(!naam){ foutEl.textContent = 'Naam is verplicht.'; foutEl.classList.remove('verborgen'); return; }
    const { data, error } = await supabaseClient.from('wpi_formulieren')
      .insert({ organisatie_id: huidigProfiel.organisatie_id, naam, soort: soortActief }).select().single();
    if(error){ foutEl.textContent = 'Aanmaken mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    actiefFormulierId = data.id;
    scherm = 'formulier';
    await render();
  }

  async function openFormulier(id){
    actiefFormulierId = id;
    scherm = 'formulier';
    await render();
  }

  async function renderFormulier(){
    const { data: f, error } = await supabaseClient.from('wpi_formulieren').select('*').eq('id', actiefFormulierId).single();
    if(error) return '<div class="fout">Kon formulier niet laden: ' + error.message + '</div>';
    const { data: vragen } = await supabaseClient.from('wpi_vragen').select('*').eq('formulier_id', actiefFormulierId).order('volgorde');
    const { data: groepen } = await supabaseClient.from('groepen').select('*').order('naam');

    const vraagRows = (vragen||[]).map((v,i) => `
      <div class="card row">
        <span>${i+1}. ${v.tekst} ${v.kritiek ? '<span class="tag" style="margin-left:6px; background:var(--red-dim); color:var(--red);">⚠️ Kritiek</span>' : ''} ${v.type==='slecht/matig/goed' ? '<span class="tag" style="margin-left:6px">Slecht/Matig/Goed</span>' : ''} ${v.type==='open' ? '<span class="tag" style="margin-left:6px">Open vraag</span>' : ''} ${v.foto_optie ? '<span class="tag" style="margin-left:6px">📷 Foto optioneel</span>' : ''}</span>
        <div style="display:flex; gap:4px; flex-shrink:0">
          <button class="ghost" style="padding:6px 10px" onclick="verplaatsVraag('${v.id}', -1)" ${i===0?'disabled':''}>↑</button>
          <button class="ghost" style="padding:6px 10px" onclick="verplaatsVraag('${v.id}', 1)" ${i===(vragen||[]).length-1?'disabled':''}>↓</button>
          <button class="ghost" onclick="verwijderVraag('${v.id}')">Verwijderen</button>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen vragen.</div>';

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Naam</label>
        <input type="text" id="bfNaam" value="${f.naam}">
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px">
          <input type="checkbox" id="bfActief" style="width:auto" ${f.actief?'checked':''}> Actief (zichtbaar om in te vullen)
        </label>
        <label>Toegewezen aan</label>
        <select id="bfKoppelType" onchange="toggleKoppelGroep()">
          <option value="iedereen" ${f.koppeling_type==='iedereen'?'selected':''}>Iedereen (met ${soortActief==='mbb'?'management-toegang':'algemene WPI-toegang'})</option>
          <option value="groep" ${f.koppeling_type==='groep'?'selected':''}>Specifieke groep</option>
        </select>
        <select id="bfKoppelGroep" style="margin-top:8px; ${f.koppeling_type!=='groep'?'display:none':''}">
          <option value="">— kies een groep —</option>
          ${(groepen||[]).map(g => `<option value="${g.id}" ${f.koppeling_groep_id===g.id?'selected':''}>${g.naam}</option>`).join('')}
        </select>
        <div class="meta" style="margin-top:4px">Kies je een groep, dan zien alleen leden van die groep dit formulier — handig om bijv. KAM andere vragen te geven dan een werkvoorbereider.</div>
        <div class="row" style="margin-top:16px">
          <button class="ghost" onclick="verwijderFormulier()">Verwijderen</button>
          <button class="primary" onclick="opslaanFormulier()">Opslaan</button>
        </div>
        <div class="fout verborgen" id="bfFout"></div>
        <div class="melding verborgen" id="bfMelding"></div>
      </div>

      <div class="eyebrow" style="margin-top:20px">Vragen</div>
      ${vraagRows}

      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Nieuwe vraag (één tegelijk)</label>
        <input type="text" id="nvTekst" placeholder="Bijv. 'Is de werkplek vrij van obstakels?'">
        <label>Type</label>
        <select id="nvType">
          <option value="ja/nee">Ja / Nee</option>
          <option value="slecht/matig/goed">Slecht / Matig / Goed</option>
          <option value="open">Open vraag (los antwoord)</option>
        </select>
        <label style="display:flex; align-items:center; gap:8px; margin-top:10px">
          <input type="checkbox" id="nvKritiek" style="width:auto"> Kritieke vraag (bij "Nee" wordt direct een melding aangemaakt)
        </label>
        <label style="display:flex; align-items:center; gap:8px; margin-top:10px">
          <input type="checkbox" id="nvFoto" style="width:auto"> Optioneel foto-bewijs toestaan (nooit verplicht)
        </label>
        <button class="ghost" style="margin-top:10px" onclick="voegVraagToe()">+ Toevoegen</button>
      </div>

      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Meerdere tegelijk plakken (één vraag per regel)</label>
        <textarea id="bulkVragen" rows="6" placeholder="Is de werkplek vrij van obstakels?
Zijn vluchtwegen vrij?
KRITIEK: Is de nooduitgang bereikbaar?
SMG: Algehele orde en netheid
OPEN: Wat is de weersomstandigheid?
FOTO: Is er zichtbare schade aan het hekwerk?
..."></textarea>
        <div class="meta" style="margin-top:4px">Zet <b>KRITIEK:</b> voor een kritieke ja/nee-vraag, <b>SMG:</b> voor Slecht/Matig/Goed, <b>OPEN:</b> voor een open vraag. Zet <b>FOTO:</b> (eventueel gecombineerd, bijv. <b>FOTO KRITIEK:</b>) om optioneel foto-bewijs toe te staan bij die vraag. Niets ervoor = gewone Ja/Nee-vraag.</div>
        <button class="primary" style="margin-top:10px" onclick="voegBulkVragenToe()">+ Alle regels toevoegen</button>
        <div class="fout verborgen" id="bulkFout"></div>
      </div>
    `;
  }

  function toggleKoppelGroep(){
    const type = document.getElementById('bfKoppelType').value;
    document.getElementById('bfKoppelGroep').style.display = type === 'groep' ? 'block' : 'none';
  }

  async function opslaanFormulier(){
    const naam = document.getElementById('bfNaam').value.trim();
    const actief = document.getElementById('bfActief').checked;
    const koppeling_type = document.getElementById('bfKoppelType').value;
    const koppeling_groep_id = koppeling_type === 'groep' ? (document.getElementById('bfKoppelGroep').value || null) : null;
    const foutEl = document.getElementById('bfFout');
    const meldingEl = document.getElementById('bfMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    if(!naam){ foutEl.textContent = 'Naam mag niet leeg zijn.'; foutEl.classList.remove('verborgen'); return; }
    const { error } = await supabaseClient.from('wpi_formulieren').update({ naam, actief, koppeling_type, koppeling_groep_id }).eq('id', actiefFormulierId);
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    meldingEl.textContent = '✓ Opgeslagen.'; meldingEl.classList.remove('verborgen');
  }

  async function verwijderFormulier(){
    if(!confirm('Dit formulier, inclusief alle vragen, definitief verwijderen? Eerder ingevulde bezoeken op basis van dit formulier blijven wel bewaard.')) return;
    const { error } = await supabaseClient.from('wpi_formulieren').delete().eq('id', actiefFormulierId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    scherm = 'lijst';
    await render();
  }

  async function voegVraagToe(){
    const tekst = document.getElementById('nvTekst').value.trim();
    const type = document.getElementById('nvType').value;
    const kritiek = document.getElementById('nvKritiek').checked;
    const foto_optie = document.getElementById('nvFoto').checked;
    if(!tekst) return;
    const { data: bestaande } = await supabaseClient.from('wpi_vragen').select('volgorde').eq('formulier_id', actiefFormulierId).order('volgorde', { ascending:false }).limit(1);
    const volgorde = bestaande && bestaande.length ? bestaande[0].volgorde + 1 : 1;
    const { error } = await supabaseClient.from('wpi_vragen').insert({ formulier_id: actiefFormulierId, tekst, type, kritiek, foto_optie, volgorde });
    if(error){ alert('Toevoegen mislukt: ' + error.message); return; }
    await render();
  }

  async function voegBulkVragenToe(){
    const foutEl = document.getElementById('bulkFout');
    foutEl.classList.add('verborgen');
    const regels = document.getElementById('bulkVragen').value.split('\n').map(r => r.trim()).filter(r => r.length > 0);
    if(!regels.length){ foutEl.textContent = 'Plak eerst één of meer regels.'; foutEl.classList.remove('verborgen'); return; }

    const { data: bestaande } = await supabaseClient.from('wpi_vragen').select('volgorde').eq('formulier_id', actiefFormulierId).order('volgorde', { ascending:false }).limit(1);
    let volgorde = bestaande && bestaande.length ? bestaande[0].volgorde : 0;

    const rijen = regels.map(regel => {
      volgorde++;
      let type = 'ja/nee', kritiek = false, foto_optie = false, tekst = regel;
      if(/^foto:?\s*/i.test(tekst)){ foto_optie = true; tekst = tekst.replace(/^foto:?\s*/i, ''); }
      if(/^kritiek:\s*/i.test(tekst)){ kritiek = true; tekst = tekst.replace(/^kritiek:\s*/i, ''); }
      else if(/^smg:\s*/i.test(tekst)){ type = 'slecht/matig/goed'; tekst = tekst.replace(/^smg:\s*/i, ''); }
      else if(/^open:\s*/i.test(tekst)){ type = 'open'; tekst = tekst.replace(/^open:\s*/i, ''); }
      return { formulier_id: actiefFormulierId, tekst, type, kritiek, foto_optie, volgorde };
    });

    const { error } = await supabaseClient.from('wpi_vragen').insert(rijen);
    if(error){ foutEl.textContent = 'Toevoegen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    document.getElementById('bulkVragen').value = '';
    await render();
  }

  async function verwijderVraag(id){
    if(!confirm('Deze vraag verwijderen?')) return;
    const { error } = await supabaseClient.from('wpi_vragen').delete().eq('id', id);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  async function verplaatsVraag(id, richting){
    const { data: vragen } = await supabaseClient.from('wpi_vragen').select('*').eq('formulier_id', actiefFormulierId).order('volgorde');
    if(!vragen) return;
    const index = vragen.findIndex(v => v.id === id);
    const nieuweIndex = index + richting;
    if(index === -1 || nieuweIndex < 0 || nieuweIndex >= vragen.length) return;
    const huidige = vragen[index];
    const buur = vragen[nieuweIndex];
    await supabaseClient.from('wpi_vragen').update({ volgorde: buur.volgorde }).eq('id', huidige.id);
    await supabaseClient.from('wpi_vragen').update({ volgorde: huidige.volgorde }).eq('id', buur.id);
    await render();
  }

  let actiefBezoekId = null;

  async function renderBezoekenLijst(){
    const { data: bezoeken, error } = await supabaseClient
      .from('wpi_bezoeken').select('*, wpi_formulieren(naam, soort)').eq('afgerond', true).order('aangemaakt_op', { ascending:false }).limit(50);
    if(error) return renderHoofdTabs() + '<div class="fout">Kon bezoeken niet laden: ' + error.message + '</div>';

    const uitvoerderIds = [...new Set((bezoeken||[]).map(b=>b.uitvoerder_id))];
    let uitvoerdersMap = {};
    if(uitvoerderIds.length){
      const { data: uitvoerders } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').in('id', uitvoerderIds);
      (uitvoerders||[]).forEach(u => { uitvoerdersMap[u.id] = u; });
    }

    const rows = (bezoeken||[]).map(b => {
      const u = uitvoerdersMap[b.uitvoerder_id];
      return `
      <div class="card klikbaar" onclick="openBezoek('${b.id}')">
        <div class="row">
          <b>${b.wpi_formulieren ? b.wpi_formulieren.naam : '—'}</b>
          <span class="tag">${b.wpi_formulieren ? b.wpi_formulieren.soort.toUpperCase() : ''}</span>
        </div>
        <div class="meta" style="margin-top:6px">${u ? u.voornaam + ' ' + u.achternaam : '—'} · ${new Date(b.aangemaakt_op).toLocaleString('nl-NL')}</div>
      </div>`;
    }).join('') || '<div class="meta">Nog geen afgeronde bezoeken.</div>';

    return `
      ${renderHoofdTabs()}
      <div class="meta" style="margin-bottom:16px">Laatste 50 afgeronde WPI/MBB-bezoeken. Open een bezoek om alle antwoorden te bekijken en er eventueel een actie aan te koppelen.</div>
      ${rows}
    `;
  }

  async function openBezoek(id){
    actiefBezoekId = id;
    scherm = 'bezoekDetail';
    await render();
  }

  async function renderBezoekDetail(){
    const { data: b, error } = await supabaseClient.from('wpi_bezoeken').select('*, wpi_formulieren(naam, soort)').eq('id', actiefBezoekId).single();
    if(error) return '<div class="fout">Kon bezoek niet laden: ' + error.message + '</div>';
    const { data: uitvoerder } = await supabaseClient.from('profielen').select('voornaam, achternaam').eq('id', b.uitvoerder_id).single();
    const { data: antwoorden } = await supabaseClient.from('wpi_antwoorden').select('*, wpi_vragen(tekst, type, kritiek, volgorde)').eq('bezoek_id', actiefBezoekId);
    const gesorteerd = (antwoorden||[]).sort((a,b) => (a.wpi_vragen?.volgorde||0) - (b.wpi_vragen?.volgorde||0));

    const antwoordIds = gesorteerd.map(a=>a.id);
    let actiesMap = {};
    if(antwoordIds.length){
      const { data: acties } = await supabaseClient.from('wpi_antwoord_acties').select('*').in('antwoord_id', antwoordIds).order('aangemaakt_op');
      (acties||[]).forEach(a => {
        if(!actiesMap[a.antwoord_id]) actiesMap[a.antwoord_id] = [];
        actiesMap[a.antwoord_id].push(a);
      });
    }
    const toegewezenIds = [...new Set(Object.values(actiesMap).flat().map(a=>a.toegewezen_aan).filter(Boolean))];
    let toegewezenMap = {};
    if(toegewezenIds.length){
      const { data: personen } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').in('id', toegewezenIds);
      (personen||[]).forEach(p => { toegewezenMap[p.id] = p; });
    }
    const { data: alleProfielen } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').eq('in_dienst', true).order('voornaam');

    const rows = gesorteerd.map(a => {
      const v = a.wpi_vragen || {};
      const acties = actiesMap[a.id] || [];
      const actieRows = acties.map(ac => {
        const p = ac.toegewezen_aan ? toegewezenMap[ac.toegewezen_aan] : null;
        return `
          <div class="meta" style="margin-top:6px; padding:8px; background:var(--bg); border-radius:6px;">
            <b>${ac.afgerond ? '✓ ' : '⏳ '}${ac.omschrijving}</b><br>
            ${p ? p.voornaam + ' ' + p.achternaam : 'niemand'} ${ac.deadline ? '· deadline ' + new Date(ac.deadline).toLocaleDateString('nl-NL') : ''}
          </div>`;
      }).join('');
      return `
        <div class="card">
          <div class="row">
            <span style="max-width:75%">${v.tekst || '—'}</span>
            ${v.kritiek ? '<span class="tag" style="background:var(--red-dim); color:var(--red);">kritiek</span>' : ''}
          </div>
          <div class="meta" style="margin-top:6px">Antwoord: <b>${a.antwoord}</b> ${a.foto_pad ? '· 📷 foto bijgevoegd' : ''}</div>
          ${actieRows}
          <button class="ghost" style="margin-top:8px" onclick="toonActieFormulier('${a.id}')">+ Actie koppelen</button>
          <div id="actieFormulier-${a.id}"></div>
        </div>
      `;
    }).join('');

    window._alleProfielenCache = alleProfielen || [];

    return `
      ${renderHoofdTabs()}
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar bezoeken</button>
      <div class="card">
        <b>${b.wpi_formulieren ? b.wpi_formulieren.naam : '—'}</b> <span class="tag">${b.wpi_formulieren ? b.wpi_formulieren.soort.toUpperCase() : ''}</span>
        <div class="meta" style="margin-top:6px">${uitvoerder ? uitvoerder.voornaam + ' ' + uitvoerder.achternaam : '—'} · ${new Date(b.aangemaakt_op).toLocaleString('nl-NL')}</div>
        <button class="ghost" style="margin-top:10px" onclick="scherm='pdfExport'; render();">📄 PDF exporteren</button>
      </div>
      <div class="eyebrow" style="margin-top:16px">Antwoorden</div>
      ${rows}
    `;
  }

  async function renderPdfExport(){
    const { data: b } = await supabaseClient.from('wpi_bezoeken').select('*, wpi_formulieren(naam, soort)').eq('id', actiefBezoekId).single();
    const { data: uitvoerder } = await supabaseClient.from('profielen').select('voornaam, achternaam').eq('id', b.uitvoerder_id).single();
    const { data: antwoorden } = await supabaseClient.from('wpi_antwoorden').select('*, wpi_vragen(tekst, type, kritiek, volgorde)').eq('bezoek_id', actiefBezoekId);
    const gesorteerd = (antwoorden||[]).sort((a,b) => (a.wpi_vragen?.volgorde||0) - (b.wpi_vragen?.volgorde||0));

    window._pdfExportData = { bezoek: b, uitvoerder, antwoorden: gesorteerd };

    const rows = gesorteerd.map((a,i) => `
      <div class="card">
        <div class="row">
          <span style="max-width:75%">${a.wpi_vragen ? a.wpi_vragen.tekst : '—'}</span>
          <label style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; margin:0">
            <input type="checkbox" id="censuur-${i}" style="width:auto"> Censureren
          </label>
        </div>
        <div class="meta" style="margin-top:6px">Antwoord: ${a.antwoord}${a.foto_pad ? ' · 📷 foto bijgevoegd' : ''}</div>
      </div>
    `).join('');

    return `
      ${renderHoofdTabs()}
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='bezoekDetail'; render();">← Terug naar bezoek</button>
      <div class="callout">
        Stel hieronder in wat er in het PDF-rapport komt te staan. De naam van de uitvoerder wordt standaard <b>niet</b> meegenomen.
      </div>
      <div class="card">
        <label style="display:flex; align-items:center; gap:8px; margin:0">
          <input type="checkbox" id="pdfToonUitvoerder" style="width:auto"> Naam van de uitvoerder tonen in het rapport
        </label>
      </div>
      <div class="eyebrow" style="margin-top:16px">Per antwoord censureren</div>
      ${rows}
      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Opmerking van KAM (optioneel, verschijnt onderaan het rapport)</label>
        <textarea id="pdfKamOpmerking" rows="4" placeholder="Bijv. toelichting, context, vervolgstappen…"></textarea>
      </div>
      <button class="primary" style="width:100%; margin-top:12px" onclick="genereerPdfRapport()">Rapport genereren (PDF)</button>
    `;
  }

  async function genereerPdfRapport(){
    const { bezoek, uitvoerder, antwoorden } = window._pdfExportData;
    const toonUitvoerder = document.getElementById('pdfToonUitvoerder').checked;
    const kamOpmerking = document.getElementById('pdfKamOpmerking').value.trim();

    const rijenMetFoto = await Promise.all(antwoorden.map(async (a, i) => {
      const gecensureerd = document.getElementById('censuur-' + i).checked;
      let fotoImg = '';
      if(a.foto_pad && !gecensureerd){
        const { data } = await supabaseClient.storage.from('wpi-fotos').createSignedUrl(a.foto_pad, 600);
        if(data) fotoImg = `<img src="${data.signedUrl}" style="max-width:260px; margin-top:8px; border-radius:6px; display:block;">`;
      }
      return `
        <tr>
          <td style="padding:10px; border-bottom:1px solid #ddd; vertical-align:top;">
            <b>${a.wpi_vragen ? a.wpi_vragen.tekst : '—'}</b><br>
            <span style="color:#555">${gecensureerd ? '[gecensureerd]' : a.antwoord}</span>
            ${gecensureerd ? '' : fotoImg}
          </td>
        </tr>
      `;
    }));

    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>${bezoek.wpi_formulieren ? bezoek.wpi_formulieren.naam : 'Rapport'}</title>
      <style>
        body{ font-family: Arial, sans-serif; padding: 30px; color:#1c1d1b; max-width:800px; margin:0 auto; }
        h1{ font-size:22px; margin-bottom:2px; }
        .meta{ color:#666; font-size:13px; margin-bottom:24px; }
        table{ width:100%; border-collapse:collapse; }
        .opmerking{ margin-top:30px; padding:14px; background:#f4f5f3; border-radius:8px; font-size:13px; }
      </style></head><body>
        <h1>${bezoek.wpi_formulieren ? bezoek.wpi_formulieren.naam : 'Rapport'}</h1>
        <div class="meta">
          ${bezoek.wpi_formulieren ? bezoek.wpi_formulieren.soort.toUpperCase() : ''} · ${new Date(bezoek.aangemaakt_op).toLocaleDateString('nl-NL')}
          ${toonUitvoerder && uitvoerder ? ' · Uitgevoerd door ' + uitvoerder.voornaam + ' ' + uitvoerder.achternaam : ''}
        </div>
        <table>${rijenMetFoto.join('')}</table>
        ${kamOpmerking ? `<div class="opmerking"><b>Opmerking:</b><br>${kamOpmerking.replace(/\n/g,'<br>')}</div>` : ''}
        <script>window.print();<\/script>
      </body></html>
    `);
    venster.document.close();
  }

  function toonActieFormulier(antwoordId){
    const el = document.getElementById('actieFormulier-' + antwoordId);
    const profielen = window._alleProfielenCache || [];
    el.innerHTML = `
      <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
        <label style="margin-top:0">Omschrijving van de actie</label>
        <input type="text" id="aoOmschrijving-${antwoordId}" placeholder="Bijv. 'Hekwerk herstellen'">
        <label>Toewijzen aan</label>
        <select id="aoToegewezen-${antwoordId}">
          <option value="">— kies een persoon —</option>
          ${profielen.map(p => `<option value="${p.id}">${p.voornaam} ${p.achternaam}</option>`).join('')}
        </select>
        <label>Deadline</label>
        <input type="date" id="aoDeadline-${antwoordId}">
        <button class="primary" style="margin-top:10px" onclick="opslaanActie('${antwoordId}')">Actie aanmaken</button>
        <div class="fout verborgen" id="aoFout-${antwoordId}"></div>
      </div>
    `;
  }

  async function opslaanActie(antwoordId){
    const omschrijving = document.getElementById('aoOmschrijving-' + antwoordId).value.trim();
    const toegewezen_aan = document.getElementById('aoToegewezen-' + antwoordId).value || null;
    const deadline = document.getElementById('aoDeadline-' + antwoordId).value || null;
    const foutEl = document.getElementById('aoFout-' + antwoordId);
    foutEl.classList.add('verborgen');
    if(!omschrijving){ foutEl.textContent = 'Omschrijving is verplicht.'; foutEl.classList.remove('verborgen'); return; }
    const { error } = await supabaseClient.from('wpi_antwoord_acties').insert({
      organisatie_id: huidigProfiel.organisatie_id, antwoord_id: antwoordId, omschrijving, toegewezen_aan, deadline, aangemaakt_door: huidigProfiel.id
    });
    if(error){ foutEl.textContent = 'Aanmaken mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
