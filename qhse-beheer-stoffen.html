<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QHSE — Beheer Gevaarlijke Stoffen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  input, select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .card.klikbaar{ cursor:pointer; }
  .card.klikbaar:hover{ border-color:var(--accent); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .tag.cmr{ background:var(--red-dim); color:var(--red); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit beheerscherm is alleen voor Admin of KAM.</p>
    <button class="ghost" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Gevaarlijke Stoffen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  const CMR_ZINNEN = ['H340','H341','H350','H351','H360','H361'];
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  let huidigProfiel = null;
  let tabActief = 'register'; // 'register' | 'aanvragen'
  let scherm = 'lijst'; // 'lijst' | 'bewerken' | 'wik'
  let wikStofId = null;
  let wikData = { disclaimer_akkoord:false, clp_pictogrammen:[], pbm:'', ehbo:'', calamiteiten:'', opslag_afval:'', extra_tekst:'' };
  let wikGeselecteerdeHZinnen = [];
  let wikGeselecteerdePZinnen = [];
  let actiefId = null;

  function isCMR(stof){ return (stof.h_zinnen||[]).some(z => CMR_ZINNEN.includes(z)); }

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    await render();
  }

  function setTab(t){ tabActief = t; scherm = 'lijst'; render(); }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    let tabsHtml = `
      <div class="tabs">
        <div class="tab ${tabActief==='register'?'actief':''}" onclick="setTab('register')">Register</div>
        <div class="tab ${tabActief==='aanvragen'?'actief':''}" onclick="setTab('aanvragen')">Aanvragen</div>
      </div>`;
    let inhoudHtml = '';
    if(scherm === 'bewerken' && tabActief === 'register') inhoudHtml = await renderBewerkenStof();
    else if(scherm === 'wik') inhoudHtml = await renderWik();
    else if(tabActief === 'register') inhoudHtml = await renderRegister();
    else inhoudHtml = await renderAanvragen();
    inhoud.innerHTML = tabsHtml + inhoudHtml;
  }

  async function renderRegister(){
    const { data: stoffen, error } = await supabaseClient.from('stoffen').select('*').order('naam');
    if(error) return '<div class="fout">Kon register niet laden: ' + error.message + '</div>';
    const rows = (stoffen||[]).map(s => `
      <div class="card klikbaar" onclick="openStof('${s.id}')">
        <div class="row">
          <div><b>${s.naam}</b> ${isCMR(s) ? '<span class="tag cmr" style="margin-left:6px">CMR</span>' : ''}</div>
          <span class="meta">${s.cas_nummer || ''}</span>
        </div>
        <div class="meta" style="margin-top:6px">${s.fabrikant || ''} ${s.sds_pad ? '· 📄 SDS aanwezig' : '· geen SDS'}</div>
      </div>`).join('') || '<div class="meta">Nog geen stoffen geregistreerd.</div>';
    return `
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(stoffen||[]).length} stoffen</span>
        <button class="primary" onclick="nieuweStof()">+ Nieuwe stof</button>
      </div>
      ${rows}
    `;
  }

  async function nieuweStof(){
    const naam = prompt('Naam van de stof:');
    if(!naam) return;
    const { data, error } = await supabaseClient
      .from('stoffen').insert({ organisatie_id: huidigProfiel.organisatie_id, naam }).select().single();
    if(error){ alert('Aanmaken mislukt: ' + error.message); return; }
    actiefId = data.id;
    scherm = 'bewerken';
    await render();
  }

  async function openStof(id){
    actiefId = id;
    scherm = 'bewerken';
    await render();
  }

  async function renderBewerkenStof(){
    const { data: s, error } = await supabaseClient.from('stoffen').select('*').eq('id', actiefId).single();
    if(error) return '<div class="fout">Kon stof niet laden: ' + error.message + '</div>';
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar register</button>
      <div class="card">
        <label style="margin-top:0">Naam</label>
        <input type="text" id="bewNaam" value="${s.naam}">
        <label>CAS-nummer</label>
        <input type="text" id="bewCas" value="${s.cas_nummer || ''}">
        <label>Fabrikant</label>
        <input type="text" id="bewFabrikant" value="${s.fabrikant || ''}">
        <label>H-zinnen (komma-gescheiden, bijv. H225, H319, H350)</label>
        <input type="text" id="bewHZinnen" value="${(s.h_zinnen||[]).join(', ')}">
        <div class="meta" style="margin-top:4px">CMR-relevant: H340, H341, H350, H351, H360, H361 — het CMR-label wordt hier automatisch op gebaseerd.</div>

        <label>Veiligheidsinformatieblad (SDS, PDF)</label>
        <div class="row">
          <span class="meta">${s.sds_pad ? '📄 SDS gekoppeld' : 'Nog geen SDS'}</span>
          <label class="ghost" style="display:inline-block; padding:8px 13px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; margin:0;">
            ${s.sds_pad ? 'Vervangen' : 'SDS toevoegen'}
            <input type="file" accept="application/pdf" style="display:none" onchange="uploadSDS(this)">
          </label>
        </div>
        <div class="meta" id="sdsStatus" style="margin-top:6px"></div>

        <div class="row" style="margin-top:18px">
          <button class="ghost" onclick="verwijderStof()">Verwijderen</button>
          <button class="primary" onclick="opslaanStof()">Opslaan</button>
        </div>
        <div class="fout verborgen" id="bewFout"></div>
        <div class="melding verborgen" id="bewMelding"></div>
      </div>

      <button class="primary" style="width:100%; margin-top:4px" onclick="openWik('${s.id}')">📋 WIK opstellen/bewerken</button>
    `;
  }

  async function opslaanStof(){
    const naam = document.getElementById('bewNaam').value.trim();
    const cas_nummer = document.getElementById('bewCas').value.trim() || null;
    const fabrikant = document.getElementById('bewFabrikant').value.trim() || null;
    const h_zinnen = document.getElementById('bewHZinnen').value.split(',').map(z=>z.trim().toUpperCase()).filter(Boolean);
    const foutEl = document.getElementById('bewFout');
    const meldingEl = document.getElementById('bewMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    const { error } = await supabaseClient.from('stoffen').update({ naam, cas_nummer, fabrikant, h_zinnen }).eq('id', actiefId);
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    meldingEl.textContent = '✓ Opgeslagen.'; meldingEl.classList.remove('verborgen');
  }

  async function verwijderStof(){
    if(!confirm('Deze stof definitief verwijderen uit het register?')) return;
    const { error } = await supabaseClient.from('stoffen').delete().eq('id', actiefId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    actiefId = null; scherm = 'lijst'; await render();
  }

  const PICTOGRAM_CODES = [
    { code:'GHS01', label:'Ontplofbaar' }, { code:'GHS02', label:'Ontvlambaar' },
    { code:'GHS03', label:'Oxiderend' }, { code:'GHS04', label:'Gas onder druk' },
    { code:'GHS05', label:'Corrosief' }, { code:'GHS06', label:'Toxisch' },
    { code:'GHS07', label:'Schadelijk/Irriterend' }, { code:'GHS08', label:'Gezondheidsgevaar' },
    { code:'GHS09', label:'Milieugevaarlijk' }
  ];

  async function openWik(stofId){
    wikStofId = stofId;
    const { data: bestaand } = await supabaseClient.from('wik').select('*').eq('stof_id', stofId).maybeSingle();
    if(bestaand){
      wikData = bestaand;
      const { data: hzGekoppeld } = await supabaseClient.from('wik_hzinnen_gekoppeld').select('wik_hzinnen(*)').eq('wik_id', bestaand.id);
      wikGeselecteerdeHZinnen = (hzGekoppeld||[]).map(r=>r.wik_hzinnen).filter(Boolean);
      const { data: pzGekoppeld } = await supabaseClient.from('wik_pzinnen_gekoppeld').select('wik_pzinnen(*)').eq('wik_id', bestaand.id);
      wikGeselecteerdePZinnen = (pzGekoppeld||[]).map(r=>r.wik_pzinnen).filter(Boolean);
    } else {
      wikData = { disclaimer_akkoord:false, clp_pictogrammen:[], pbm:'', ehbo:'', calamiteiten:'', opslag_afval:'', extra_tekst:'' };
      wikGeselecteerdeHZinnen = [];
      wikGeselecteerdePZinnen = [];
    }
    scherm = 'wik';
    await render();
  }

  async function renderWik(){
    const { data: stof } = await supabaseClient.from('stoffen').select('*').eq('id', wikStofId).single();

    const pictoHtml = await Promise.all(PICTOGRAM_CODES.map(async (p) => {
      const pad = `${huidigProfiel.organisatie_id}/${p.code}.png`;
      const { data } = await supabaseClient.storage.from('clp-pictogrammen').createSignedUrl(pad, 300);
      const aan = wikData.clp_pictogrammen.includes(p.code);
      return `
        <div onclick="togglePictogram('${p.code}')" style="cursor:pointer; text-align:center; border:2px solid ${aan?'var(--accent)':'var(--border)'}; border-radius:10px; padding:8px; ${aan?'background:var(--accent-dim);':''}">
          ${data ? `<img src="${data.signedUrl}" style="width:100%; aspect-ratio:1; object-fit:contain;">` : `<div style="width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-soft);">geen afb.</div>`}
          <div style="font-size:10.5px; font-weight:600; margin-top:4px">${p.code}</div>
        </div>
      `;
    }));

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='bewerken'; render();">← Terug naar ${stof.naam}</button>
      <div class="card">
        <b>WIK — ${stof.naam}</b>
        <label style="display:flex; align-items:flex-start; gap:8px; margin-top:14px">
          <input type="checkbox" id="wikDisclaimer" style="width:auto; margin-top:2px" ${wikData.disclaimer_akkoord?'checked':''} onchange="wikData.disclaimer_akkoord=this.checked">
          <span style="font-size:12.5px">Ik bevestig dat deze WIK is opgesteld of gecontroleerd door een deskundige persoon (bijv. een arbeidshygiënist of toxicoloog). <b>(verplicht om op te slaan)</b></span>
        </label>
      </div>

      <div class="eyebrow">Gevarenpictogrammen</div>
      <div class="card">
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr)); gap:10px;">${pictoHtml.join('')}</div>
      </div>

      <div class="eyebrow">H-/EUH-zinnen</div>
      <div class="card">
        <div id="wikHGeselecteerd">${renderGeselecteerdeZinnen(wikGeselecteerdeHZinnen, 'H')}</div>
        <input type="text" id="wikZoekH" placeholder="Zoek op code of tekst…" oninput="filterZinnen('H')" style="margin-top:8px">
        <div id="wikHResultaten" style="max-height:180px; overflow-y:auto; margin-top:6px"></div>
        <div class="row" style="margin-top:10px; gap:6px">
          <input type="text" id="wikEigenHCode" placeholder="Eigen code (bijv. H999)" style="max-width:160px">
          <input type="text" id="wikEigenHTekst" placeholder="Eigen tekst">
          <button class="ghost" onclick="voegEigenZinToe('H')">+ Toevoegen</button>
        </div>
      </div>

      <div class="eyebrow">P-zinnen</div>
      <div class="card">
        <div id="wikPGeselecteerd">${renderGeselecteerdeZinnen(wikGeselecteerdePZinnen, 'P')}</div>
        <input type="text" id="wikZoekP" placeholder="Zoek op code of tekst…" oninput="filterZinnen('P')" style="margin-top:8px">
        <div id="wikPResultaten" style="max-height:180px; overflow-y:auto; margin-top:6px"></div>
        <div class="row" style="margin-top:10px; gap:6px">
          <input type="text" id="wikEigenPCode" placeholder="Eigen code (bijv. P999)" style="max-width:160px">
          <input type="text" id="wikEigenPTekst" placeholder="Eigen tekst">
          <button class="ghost" onclick="voegEigenZinToe('P')">+ Toevoegen</button>
        </div>
      </div>

      <div class="eyebrow">Overige informatie</div>
      <div class="card">
        <label style="margin-top:0">Persoonlijke beschermingsmiddelen (PBM)</label>
        <textarea id="wikPbm" rows="2" oninput="wikData.pbm=this.value">${wikData.pbm||''}</textarea>
        <label>EHBO</label>
        <textarea id="wikEhbo" rows="2" oninput="wikData.ehbo=this.value">${wikData.ehbo||''}</textarea>
        <label>Calamiteiten / brand</label>
        <textarea id="wikCalamiteiten" rows="2" oninput="wikData.calamiteiten=this.value">${wikData.calamiteiten||''}</textarea>
        <label>Opslag / afval</label>
        <textarea id="wikOpslagAfval" rows="2" oninput="wikData.opslag_afval=this.value">${wikData.opslag_afval||''}</textarea>
        <label>Extra toelichting</label>
        <textarea id="wikExtra" rows="2" oninput="wikData.extra_tekst=this.value">${wikData.extra_tekst||''}</textarea>
        <div class="row" style="margin-top:16px">
          <button class="ghost" onclick="printWik()">🖨️ Print WIK (A4)</button>
          <button class="primary" onclick="opslaanWik()">Opslaan</button>
        </div>
        <div class="fout verborgen" id="wikFout"></div>
        <div class="melding verborgen" id="wikMelding"></div>
      </div>
    `;
  }

  function renderGeselecteerdeZinnen(lijst, prefix){
    if(!lijst.length) return '<div class="meta">Nog geen zinnen geselecteerd.</div>';
    return lijst.map(z => `<span class="tag" style="margin:3px 4px 0 0; background:var(--accent-dim); color:var(--accent); cursor:pointer;" onclick="verwijderZin('${z.id}','${prefix}')">${z.code} ✕</span>`).join('');
  }

  function togglePictogram(code){
    const idx = wikData.clp_pictogrammen.indexOf(code);
    if(idx >= 0) wikData.clp_pictogrammen.splice(idx, 1);
    else wikData.clp_pictogrammen.push(code);
    render();
  }

  async function filterZinnen(soort){
    const zoekterm = document.getElementById('wikZoek' + soort).value.trim().toLowerCase();
    const resultatenEl = document.getElementById('wik' + soort + 'Resultaten');
    if(!zoekterm){ resultatenEl.innerHTML = ''; return; }
    const tabel = soort === 'H' ? 'wik_hzinnen' : 'wik_pzinnen';
    const { data } = await supabaseClient.from(tabel).select('*').order('code');
    const geselecteerdeIds = new Set((soort==='H' ? wikGeselecteerdeHZinnen : wikGeselecteerdePZinnen).map(z=>z.id));
    const gefilterd = (data||[]).filter(z => z.code.toLowerCase().includes(zoekterm) || z.tekst.toLowerCase().includes(zoekterm)).slice(0, 20);
    resultatenEl.innerHTML = gefilterd.map(z => `
      <div onclick="${geselecteerdeIds.has(z.id)?'':`selecteerZin('${z.id}','${soort}')`}" style="padding:7px 8px; border-bottom:1px solid var(--border); font-size:12.5px; cursor:${geselecteerdeIds.has(z.id)?'default':'pointer'}; ${geselecteerdeIds.has(z.id)?'opacity:.4;':''}">
        <b>${z.code}</b> — ${z.tekst}
      </div>
    `).join('') || '<div class="meta" style="padding:6px 0">Niets gevonden.</div>';
  }

  async function selecteerZin(id, soort){
    const tabel = soort === 'H' ? 'wik_hzinnen' : 'wik_pzinnen';
    const { data: zin } = await supabaseClient.from(tabel).select('*').eq('id', id).single();
    if(!zin) return;
    if(soort === 'H'){
      wikGeselecteerdeHZinnen.push(zin);
      const { data: gekoppeldePictogrammen } = await supabaseClient.from('wik_hzin_pictogrammen').select('pictogram_code').eq('hzin_id', id);
      let nieuwPictogramToegevoegd = false;
      (gekoppeldePictogrammen||[]).forEach(p => {
        if(!wikData.clp_pictogrammen.includes(p.pictogram_code)){
          wikData.clp_pictogrammen.push(p.pictogram_code);
          nieuwPictogramToegevoegd = true;
        }
      });
      if(nieuwPictogramToegevoegd){ await render(); return; }
    } else {
      wikGeselecteerdePZinnen.push(zin);
    }
    document.getElementById('wik' + soort + 'Geselecteerd').innerHTML = renderGeselecteerdeZinnen(soort==='H'?wikGeselecteerdeHZinnen:wikGeselecteerdePZinnen, soort);
    document.getElementById('wikZoek' + soort).value = '';
    document.getElementById('wik' + soort + 'Resultaten').innerHTML = '';
  }

  function verwijderZin(id, soort){
    if(soort === 'H') wikGeselecteerdeHZinnen = wikGeselecteerdeHZinnen.filter(z=>z.id!==id);
    else wikGeselecteerdePZinnen = wikGeselecteerdePZinnen.filter(z=>z.id!==id);
    document.getElementById('wik' + soort + 'Geselecteerd').innerHTML = renderGeselecteerdeZinnen(soort==='H'?wikGeselecteerdeHZinnen:wikGeselecteerdePZinnen, soort);
  }

  async function voegEigenZinToe(soort){
    const code = document.getElementById('wikEigen' + soort + 'Code').value.trim().toUpperCase();
    const tekst = document.getElementById('wikEigen' + soort + 'Tekst').value.trim();
    if(!code || !tekst) return;
    const tabel = soort === 'H' ? 'wik_hzinnen' : 'wik_pzinnen';
    const insertData = soort === 'H' ? { organisatie_id: huidigProfiel.organisatie_id, code, tekst, soort:'H' } : { organisatie_id: huidigProfiel.organisatie_id, code, tekst };
    const { data: zin, error } = await supabaseClient.from(tabel).insert(insertData).select().single();
    if(error){ alert('Toevoegen mislukt (mogelijk bestaat deze code al): ' + error.message); return; }
    if(soort === 'H') wikGeselecteerdeHZinnen.push(zin); else wikGeselecteerdePZinnen.push(zin);
    document.getElementById('wikEigen' + soort + 'Code').value = '';
    document.getElementById('wikEigen' + soort + 'Tekst').value = '';
    document.getElementById('wik' + soort + 'Geselecteerd').innerHTML = renderGeselecteerdeZinnen(soort==='H'?wikGeselecteerdeHZinnen:wikGeselecteerdePZinnen, soort);
  }

  async function opslaanWik(){
    const foutEl = document.getElementById('wikFout');
    const meldingEl = document.getElementById('wikMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    const disclaimer_akkoord = document.getElementById('wikDisclaimer').checked;
    if(!disclaimer_akkoord){ foutEl.textContent = 'De disclaimer moet bevestigd zijn voordat je kan opslaan.'; foutEl.classList.remove('verborgen'); return; }

    const payload = {
      organisatie_id: huidigProfiel.organisatie_id, stof_id: wikStofId,
      disclaimer_akkoord: true, disclaimer_akkoord_door: huidigProfiel.id, disclaimer_akkoord_op: new Date().toISOString(),
      clp_pictogrammen: wikData.clp_pictogrammen,
      pbm: wikData.pbm || null, ehbo: wikData.ehbo || null, calamiteiten: wikData.calamiteiten || null,
      opslag_afval: wikData.opslag_afval || null, extra_tekst: wikData.extra_tekst || null,
      bijgewerkt_op: new Date().toISOString()
    };
    const { data: opgeslagen, error } = await supabaseClient.from('wik').upsert(payload, { onConflict: 'stof_id' }).select().single();
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    wikData = opgeslagen;

    await supabaseClient.from('wik_hzinnen_gekoppeld').delete().eq('wik_id', opgeslagen.id);
    if(wikGeselecteerdeHZinnen.length){
      await supabaseClient.from('wik_hzinnen_gekoppeld').insert(wikGeselecteerdeHZinnen.map(z => ({ wik_id: opgeslagen.id, hzin_id: z.id })));
    }
    await supabaseClient.from('wik_pzinnen_gekoppeld').delete().eq('wik_id', opgeslagen.id);
    if(wikGeselecteerdePZinnen.length){
      await supabaseClient.from('wik_pzinnen_gekoppeld').insert(wikGeselecteerdePZinnen.map(z => ({ wik_id: opgeslagen.id, pzin_id: z.id })));
    }

    meldingEl.textContent = '✓ WIK opgeslagen.'; meldingEl.classList.remove('verborgen');
  }

  async function printWik(){
    const { data: stof } = await supabaseClient.from('stoffen').select('*').eq('id', wikStofId).single();
    const pictoImgs = await Promise.all(wikData.clp_pictogrammen.map(async (code) => {
      const pad = `${huidigProfiel.organisatie_id}/${code}.png`;
      const { data } = await supabaseClient.storage.from('clp-pictogrammen').createSignedUrl(pad, 300);
      return data ? `<img src="${data.signedUrl}" style="width:70px; height:70px; object-fit:contain; margin:4px;">` : '';
    }));

    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>WIK — ${stof.naam}</title>
      <style>
        body{ font-family: Arial, sans-serif; padding:30px; color:#1c1d1b; }
        h1{ font-size:20px; border-bottom:3px solid #2f6f5e; padding-bottom:8px; }
        h2{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#5a5c57; margin-top:20px; border-bottom:1px solid #ccc; padding-bottom:4px; }
        .zin{ font-size:12px; margin:4px 0; }
        .picto-rij{ display:flex; flex-wrap:wrap; }
        table{ border-collapse:collapse; margin-top:6px; }
        td{ padding:3px 10px 3px 0; font-size:12px; vertical-align:top; }
      </style></head><body>
        <h1>Werkplekinstructiekaart — ${stof.naam}</h1>
        <table>
          <tr><td><b>CAS-nummer</b></td><td>${stof.cas_nummer || '—'}</td></tr>
          <tr><td><b>Fabrikant</b></td><td>${stof.fabrikant || '—'}</td></tr>
        </table>
        <h2>Gevarenpictogrammen</h2>
        <div class="picto-rij">${pictoImgs.join('') || '<i>geen geselecteerd</i>'}</div>
        <h2>H-/EUH-zinnen</h2>
        ${wikGeselecteerdeHZinnen.map(z => `<div class="zin"><b>${z.code}</b> — ${z.tekst}</div>`).join('') || '<i>geen</i>'}
        <h2>P-zinnen</h2>
        ${wikGeselecteerdePZinnen.map(z => `<div class="zin"><b>${z.code}</b> — ${z.tekst}</div>`).join('') || '<i>geen</i>'}
        <h2>Persoonlijke beschermingsmiddelen</h2><div class="zin">${(wikData.pbm||'—').replace(/\n/g,'<br>')}</div>
        <h2>EHBO</h2><div class="zin">${(wikData.ehbo||'—').replace(/\n/g,'<br>')}</div>
        <h2>Calamiteiten / brand</h2><div class="zin">${(wikData.calamiteiten||'—').replace(/\n/g,'<br>')}</div>
        <h2>Opslag / afval</h2><div class="zin">${(wikData.opslag_afval||'—').replace(/\n/g,'<br>')}</div>
        ${wikData.extra_tekst ? `<h2>Extra toelichting</h2><div class="zin">${wikData.extra_tekst.replace(/\n/g,'<br>')}</div>` : ''}
        <p style="margin-top:30px; font-size:10px; color:#999;">Opgesteld/gecontroleerd door een deskundige persoon (bijv. een arbeidshygiënist of toxicoloog). Gegenereerd op ${new Date().toLocaleDateString('nl-NL')}.</p>
        <script>window.print();<\/script>
      </body></html>
    `);
    venster.document.close();
  }

  async function uploadSDS(inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    const statusEl = document.getElementById('sdsStatus');
    statusEl.textContent = 'Uploaden…';
    const pad = `${huidigProfiel.organisatie_id}/sds/${actiefId}-${Date.now()}.pdf`;
    const { error: uploadFout } = await supabaseClient.storage.from('stoffen-bestanden').upload(pad, file);
    if(uploadFout){ statusEl.textContent = 'Upload mislukt: ' + uploadFout.message; return; }
    const { error: updateFout } = await supabaseClient.from('stoffen').update({ sds_pad: pad }).eq('id', actiefId);
    if(updateFout){ statusEl.textContent = 'Koppelen mislukt: ' + updateFout.message; return; }
    await render();
  }

  async function renderAanvragen(){
    const { data: aanvragen, error } = await supabaseClient
      .from('stof_aanvragen').select('*, profielen(voornaam, achternaam)').order('aangemaakt_op', { ascending:false });
    if(error) return '<div class="fout">Kon aanvragen niet laden: ' + error.message + '</div>';
    const rows = await Promise.all((aanvragen||[]).map(async (a) => {
      let fotoLink = '';
      if(a.foto_pad){
        fotoLink = `<button class="ghost" style="margin-top:8px" onclick="bekijkFoto('${a.foto_pad}')">📷 Foto bekijken</button>`;
      }
      return `
        <div class="card">
          <div class="row">
            <b>${a.naam}</b>
            <span class="tag" style="${a.status==='afgehandeld' ? 'background:var(--green-dim); color:var(--green);' : 'background:var(--amber-dim); color:var(--amber);'}">${a.status}</span>
          </div>
          <div class="meta" style="margin-top:6px">${a.fabrikant || 'fabrikant onbekend'} · aangevraagd door ${a.profielen ? a.profielen.voornaam + ' ' + a.profielen.achternaam : '—'}</div>
          <div style="font-size:13px; margin-top:6px">${a.omschrijving || ''}</div>
          ${fotoLink}
          ${a.status==='nieuw' ? `<div class="row" style="margin-top:10px"><span></span><button class="primary" onclick="markeerAfgehandeld('${a.id}')">Markeer afgehandeld</button></div>` : ''}
        </div>`;
    }));
    return rows.join('') || '<div class="meta">Nog geen aanvragen.</div>';
  }

  async function bekijkFoto(pad){
    const { data, error } = await supabaseClient.storage.from('stoffen-bestanden').createSignedUrl(pad, 300);
    if(error){ alert('Kon foto niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function markeerAfgehandeld(id){
    const afhandel_notitie = prompt('Notitie voor de audittrail (optioneel):');
    const { error } = await supabaseClient.from('stof_aanvragen').update({ status: 'afgehandeld', afhandel_notitie: afhandel_notitie || null }).eq('id', id);
    if(error){ alert('Afhandelen mislukt: ' + error.message); return; }
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
