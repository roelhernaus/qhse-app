<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QHSE — Toolboxen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  input, select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .tag.verplicht{ background:var(--amber-dim); color:var(--amber); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .deelnemer-rij{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .deelnemer-rij:last-child{ border-bottom:none; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem</div>
      <h1>Toolboxen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  let huidigProfiel = null;
  let scherm = 'lijst'; // 'lijst' | 'geven'
  let actieveSessie = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('login-scherm').classList.add('verborgen');
    document.getElementById('app-scherm').classList.remove('verborgen');
    scherm = 'lijst';
    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'geven') inhoud.innerHTML = await renderGeven();
  }

  async function renderLijst(){
    const { data: bibliotheek, error: bibFout } = await supabaseClient
      .from('toolbox_bibliotheek').select('*').order('naam');
    if(bibFout) return '<div class="fout">Kon bibliotheek niet laden: ' + bibFout.message + '</div>';

    const { data: sessies, error: sesFout } = await supabaseClient
      .from('toolbox_sessies').select('*, toolbox_bibliotheek(naam), profielen(voornaam, achternaam)')
      .order('datum', { ascending:false }).limit(15);
    if(sesFout) return '<div class="fout">Kon geschiedenis niet laden: ' + sesFout.message + '</div>';

    const bibRows = (bibliotheek||[]).map(t => `
      <div class="card">
        <div class="row">
          <div>
            <b>${t.naam}</b>
            ${t.verplicht ? '<span class="tag verplicht" style="margin-left:8px">Verplicht</span>' : ''}
          </div>
          <button class="primary" onclick="startGeven('${t.id}','${t.naam.replace(/'/g,"\\'")}')">Geef deze toolbox</button>
        </div>
        ${t.pdf_pad
          ? `<button class="ghost" style="margin-top:10px" onclick="bekijkMateriaal('${t.pdf_pad}')">📄 Materiaal bekijken</button>`
          : `<div class="meta" style="margin-top:10px">Nog geen materiaal toegevoegd.</div>`}
      </div>`).join('') || '<div class="meta">Nog geen toolboxen aan jou toegewezen.</div>';

    const sesRows = (sessies||[]).map(s => `
      <div class="card">
        <div class="row">
          <span>${s.toolbox_bibliotheek ? s.toolbox_bibliotheek.naam : '—'}</span>
          <span class="meta">${new Date(s.datum).toLocaleDateString('nl-NL')}</span>
        </div>
        <div class="meta" style="margin-top:4px">Gegeven door ${s.profielen ? s.profielen.voornaam + ' ' + s.profielen.achternaam : '—'}</div>
      </div>`).join('') || '<div class="meta">Nog geen sessies gegeven.</div>';

    return `
      <div class="eyebrow" style="margin-top:4px">Bibliotheek</div>
      ${bibRows}
      <div class="eyebrow" style="margin-top:22px">Recent gegeven</div>
      ${sesRows}
    `;
  }

  async function bekijkMateriaal(pad){
    const { data, error } = await supabaseClient.storage.from('toolbox-materiaal').createSignedUrl(pad, 300);
    if(error){ alert('Kon materiaal niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function startGeven(toolboxId, toolboxNaam){
    const { data: profielen, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam').eq('in_dienst', true).order('achternaam');
    if(error){ alert('Kon medewerkers niet laden: ' + error.message); return; }
    actieveSessie = { toolboxId, toolboxNaam, datum: new Date().toISOString().slice(0,10), profielen: profielen||[], geselecteerd: new Set(), extern: [] };
    scherm = 'geven';
    await render();
  }

  function toggleDeelnemer(id){
    if(actieveSessie.geselecteerd.has(id)) actieveSessie.geselecteerd.delete(id);
    else actieveSessie.geselecteerd.add(id);
    render();
  }
  function voegExterneToe(){
    const naam = document.getElementById('externeNaamInvoer').value.trim();
    if(!naam) return;
    actieveSessie.extern.push(naam);
    document.getElementById('externeNaamInvoer').value = '';
    render();
  }
  function verwijderExterne(i){
    actieveSessie.extern.splice(i,1);
    render();
  }

  async function renderGeven(){
    const { toolboxNaam, datum, profielen, geselecteerd, extern } = actieveSessie;
    const rows = profielen.map(p => `
      <div class="deelnemer-rij">
        <input type="checkbox" style="width:auto" ${geselecteerd.has(p.id)?'checked':''} onchange="toggleDeelnemer('${p.id}')">
        <span>${p.voornaam} ${p.achternaam}</span>
      </div>`).join('');
    const externRows = extern.map((naam, i) => `
      <div class="deelnemer-rij">
        <span>${naam} <span class="meta">(extern)</span></span>
        <button class="ghost" style="margin-left:auto; padding:4px 9px;" onclick="verwijderExterne(${i})">×</button>
      </div>`).join('');
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug</button>
      <div class="card" style="margin-bottom:16px">
        <b>${toolboxNaam}</b>
        <label>Datum</label>
        <input type="date" id="sessieDatum" value="${datum}" onchange="actieveSessie.datum=this.value">
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-top:0">Deelnemers (${geselecteerd.size + extern.length})</div>
        ${rows}
        ${externRows}
        <div class="row" style="margin-top:10px; gap:8px">
          <input type="text" id="externeNaamInvoer" placeholder="Naam externe/inhuur deelnemer…">
          <button class="ghost" onclick="voegExterneToe()">+ Toevoegen</button>
        </div>
      </div>
      <div class="row" style="margin:18px 0 30px">
        <span class="meta">${(geselecteerd.size + extern.length) === 0 ? 'Kies minstens één deelnemer.' : 'Klaar om vast te leggen.'}</span>
        <button class="primary" ${(geselecteerd.size + extern.length)===0 ? 'disabled' : ''} onclick="legVast()">Toolbox vastleggen</button>
      </div>
      <div class="fout verborgen" id="gevenFout"></div>
    `;
  }

  async function legVast(){
    const { toolboxId, datum, geselecteerd, extern } = actieveSessie;
    const foutEl = document.getElementById('gevenFout');
    foutEl.classList.add('verborgen');

    const { data: sessie, error: sessieFout } = await supabaseClient
      .from('toolbox_sessies')
      .insert({ organisatie_id: huidigProfiel.organisatie_id, toolbox_id: toolboxId, gever_id: huidigProfiel.id, datum })
      .select().single();
    if(sessieFout){ foutEl.textContent = 'Vastleggen mislukt: ' + sessieFout.message; foutEl.classList.remove('verborgen'); return; }

    const deelnemerRijen = [
      ...[...geselecteerd].map(profiel_id => ({ sessie_id: sessie.id, profiel_id, aanwezig: true })),
      ...extern.map(naam => ({ sessie_id: sessie.id, naam, aanwezig: true }))
    ];
    const { error: deelnemersFout } = await supabaseClient.from('toolbox_deelnemers').insert(deelnemerRijen);
    if(deelnemersFout){ foutEl.textContent = 'Deelnemers opslaan mislukt: ' + deelnemersFout.message; foutEl.classList.remove('verborgen'); return; }

    actieveSessie = null;
    scherm = 'lijst';
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
