<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>QHSE-systeem — Bouwbedrijf Van der Berg</title>

<style>
  :root{
    --bg:#f4f5f3; --bg-card:#ffffff; --border:#e2e3df; --text-primary:#1c1d1b; --text-secondary:#5a5c57; --text-tertiary:#9a9c96;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10);
  }
  body.donker{
    --bg:#15181a; --bg-card:#1e2225; --border:#2c3134; --text-primary:#f2f3f1; --text-secondary:#a8ada9; --text-tertiary:#6d726e;
    --accent:#4a9c85; --accent-dim:rgba(74,156,133,0.15);
  }
  body{ transition: background .15s ease, color .15s ease; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-primary); height:100vh; overflow:hidden; }
  .font-display{ font-family:'Oswald',sans-serif; }

  /* ---- login ---- */
  #loginScherm{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  #loginScherm.verborgen{ display:none; }
  .login-box{ width:100%; max-width:380px; }
  .login-brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .login-brand .logo{ width:42px; height:42px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; }
  .login-brand .naam{ font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; }
  .login-brand .sub{ font-size:11.5px; color:var(--text-secondary); }
  .card{ background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:22px; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-primary); padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .fout{ background:#fbeae8; color:#c0392b; font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .verborgen{ display:none; }

  /* ---- shell ---- */
  #appShell{ display:none; height:100vh; }
  #appShell.actief{ display:flex; }

  #rail{
    width:220px; flex-shrink:0; background:#1c1d1b; color:#fff; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; padding:0;
  }
  .rail-header{ padding:18px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .rail-header .merk{ display:flex; align-items:center; gap:10px; }
  .rail-header .merk .logo{ width:32px; height:32px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; flex-shrink:0; }
  .rail-header .merk .naam{ font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; line-height:1.25; }

  .omgeving-toggle{ display:flex; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; }
  .omgeving-toggle button{
    background:transparent; border:none; color:var(--text-secondary); font-size:12px; font-weight:600;
    padding:7px 14px; border-radius:6px; white-space:nowrap;
  }
  .omgeving-toggle button.actief{ background:var(--accent); color:#fff; }

  .rail-groep{ font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:rgba(255,255,255,0.35); padding:16px 18px 6px; }
  .rail-item{
    display:flex; align-items:center; gap:11px; padding:9px 18px; font-size:13px; cursor:pointer; color:rgba(255,255,255,0.78);
    border-left:3px solid transparent;
  }
  .rail-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
  .rail-item .badge{
    margin-left:auto; background:#e5484d; color:#fff; font-size:10.5px; font-weight:700;
    padding:1px 6px; border-radius:20px; min-width:16px; text-align:center;
  }
  .rail-item .badge.alert{ background:#e5484d; font-size:12px; padding:0 6px; }
  .tegel .tegel-badge{
    position:absolute; top:12px; right:12px; background:#e5484d; color:#fff; font-size:11px; font-weight:700;
    padding:2px 7px; border-radius:20px;
  }
  .rail-item:hover{ background:rgba(255,255,255,0.05); }
  .rail-item.actief{ background:rgba(255,255,255,0.09); color:#fff; border-left-color:var(--accent); }
  .rail-item.actief svg{ opacity:1; }

  #hoofdgebied{ flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
  #topbar{
    display:flex; align-items:center; padding:11px 20px;
    background:var(--bg-card); border-bottom:1px solid var(--border); flex-shrink:0; gap:16px;
  }
  #topbar .whoami{ display:flex; align-items:center; gap:10px; }
  #topbar .avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-dim); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; }
  #topbar .whoami .naam{ font-size:13px; font-weight:600; }
  #topbar .whoami .rol{ font-size:11px; color:var(--text-tertiary); }
  #frameGebied{ flex:1; position:relative; background:var(--bg); overflow-y:auto; }
  #frameGebied iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }
  #dashboardScherm{ padding:28px 32px; max-width:960px; }
  #dashboardScherm .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:4px; }
  #dashboardScherm h2{ font-family:'Oswald',sans-serif; font-weight:600; font-size:26px; margin-bottom:22px; }
  .tegel-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:18px; }
  .tegel{
    position:relative; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:26px;
    cursor:pointer; transition:.12s ease; display:flex; flex-direction:column; gap:16px; min-height:130px;
  }
  .tegel:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.08); }
  .tegel .tegel-icon{
    width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  }
  .tegel .tegel-icon svg{ width:28px; height:28px; }
  .tegel .tegel-naam{ font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; }
  .theme-toggle{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; margin-right:8px;
  }

  .mobiel-home-knop{ display:none; }

  @media (max-width: 760px){
    #rail{ display:none; }
    #frameGebied{ padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
    #topbar{ flex-wrap:wrap; row-gap:10px; }
    .omgeving-toggle{ order:3; width:100%; margin:0 !important; }
    .omgeving-toggle button{ flex:1; }
    #topbar .whoami{ order:1; }
    #topbar > div[style*="margin-left:auto"]{ order:2; margin-left:auto !important; }
    .mobiel-home-knop{
      display:flex; align-items:center; justify-content:center; gap:8px;
      position:fixed; left:0; right:0; bottom:0; height:calc(56px + env(safe-area-inset-bottom)); z-index:50;
      padding-bottom:env(safe-area-inset-bottom);
      background:#1c1d1b; color:#fff; font-size:13px; font-weight:600; cursor:pointer;
      border-top:1px solid rgba(255,255,255,0.1);
    }
    .mobiel-home-knop svg{ width:18px; height:18px; }
  }
</style>
</head>

      MODULES_FRONTEND.map(m => `<div class="rail-item" data-pagina="${m.pagina}" onclick="ga(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONEN[m.icon]}</svg>${moduleNaam(m)}</div>`).join('');
    document.getElementById('railItemsBackend').innerHTML = `<div class="rail-groep">${t('beheer')}</div>` +
      toegestaneBackend.map(m => `<div class="rail-item" data-pagina="${m.pagina}" onclick="ga(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONEN[m.icon]}</svg>${moduleNaam(m)}</div>`).join('');
  }

  function bouwTegels(lijst){
    document.getElementById('tegelGrid').innerHTML = lijst.map((m,i) => `
      <div class="tegel" onclick="openVanuitTegel('${m.pagina}')">
        <div class="tegel-icon" style="background:${KLEUREN[i % KLEUREN.length]}22; color:${KLEUREN[i % KLEUREN.length]}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONEN[m.icon]}</svg>
        </div>
        <div class="tegel-naam">${moduleNaam(m)}</div>
      </div>
    `).join('');
  }

  function openVanuitTegel(pagina){
    document.getElementById('dashboardScherm').style.display = 'none';
    document.getElementById('hoofdFrame').style.display = 'block';
    document.getElementById('hoofdFrame').src = pagina;
    document.querySelectorAll('.rail-item').forEach(i => {
      i.classList.toggle('actief', i.dataset.pagina === pagina);
    });
  }

  function toonDashboard(){
    document.getElementById('hoofdFrame').style.display = 'none';
    document.getElementById('dashboardScherm').style.display = 'block';
    document.querySelectorAll('.rail-item').forEach(i => i.classList.remove('actief'));
  }

  function ganaarDashboardMobiel(){
    toonDashboard();
  }

  function wisselThema(){
    document.body.classList.toggle('donker');
    document.getElementById('themeIcon').textContent = document.body.classList.contains('donker') ? '☾' : '☀';
  }

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initShell();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }

  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('appShell').classList.remove('actief');
    document.getElementById('loginScherm').classList.remove('verborgen');
  }

  function initialen(naam){
    return naam.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  }

  let huidigProfielId = null;
  let openstaandeActiesAantal = 0;
  let heeftOpenstaandeAlert = false;

  async function initShell(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }

    if(profiel.rol === 'extern'){
      window.location.href = 'qhse-extern.html';
      return;
    }
    huidigProfielId = profiel.id;
    huidigProfielRol = profiel.rol;

    const { data: org } = await supabaseClient.from('organisaties').select('taal').eq('id', profiel.organisatie_id).single();
    huidigeTaal = (org && org.taal === 'en') ? 'en' : 'nl';
    pasVertalingenToe();

    const volledigeNaam = profiel.voornaam + ' ' + profiel.achternaam;
    document.getElementById('avatarInitialen').textContent = initialen(volledigeNaam);
    document.getElementById('wieBenIkNaam').textContent = volledigeNaam;
    document.getElementById('wieBenIkRol').textContent = profiel.rol;
    document.getElementById('loginScherm').classList.add('verborgen');
    document.getElementById('appShell').classList.add('actief');

    bouwRail();

    const heeftBeheerToegang = MODULES_BACKEND.some(m => m.rollen.includes(profiel.rol));
    if(heeftBeheerToegang){
      document.getElementById('omgevingToggle').classList.remove('verborgen');
    }

    kiesOmgeving('frontend');
    berekenOpenstaandeActies();
  }

  async function ledenVanGroepShell(groepId){
    const { data } = await supabaseClient.from('groep_leden').select('profiel_id').eq('groep_id', groepId);
    return (data||[]).map(l=>l.profiel_id);
  }
  async function bentIkToegewezenShell(koppelingType, koppelingGroepId){
    if(koppelingType === 'iedereen') return true;
    if(!koppelingGroepId) return false;
    const ledenIds = await ledenVanGroepShell(koppelingGroepId);
    return ledenIds.includes(huidigProfielId);
  }

  async function berekenOpenstaandeActies(){
    let aantal = 0;
    let alert = false;

    const { data: meldingen } = await supabaseClient.from('meldingen_view').select('id').eq('actiehouder_id', huidigProfielId).neq('status','Afgehandeld');
    aantal += (meldingen||[]).length;

    const { data: shiftActies } = await supabaseClient.from('logboek_regels').select('id').eq('toegewezen_aan', huidigProfielId).eq('afgerond', false);
    aantal += (shiftActies||[]).length;

    const { data: vergaderActies } = await supabaseClient.from('logboek_acties').select('id').eq('toegewezen_aan', huidigProfielId).eq('afgerond', false);
    aantal += (vergaderActies||[]).length;

    const { data: opleidingen } = await supabaseClient.from('opleidingen').select('*, opleiding_soorten(is_alert)');
    for(const o of (opleidingen||[])){
      if(!(await bentIkToegewezenShell(o.koppeling_type, o.koppeling_groep_id))) continue;
      const { data: versie } = await supabaseClient.from('opleiding_versies').select('id').eq('opleiding_id', o.id).eq('actief', true).maybeSingle();
      if(!versie) continue;
      const { data: laatstePoging } = await supabaseClient
        .from('opleiding_pogingen').select('afgerond_op').eq('versie_id', versie.id).eq('profiel_id', huidigProfielId).eq('geslaagd', true)
        .order('afgerond_op', { ascending:false }).limit(1).maybeSingle();
      let openstaand = !laatstePoging;
      if(laatstePoging){
        const vervalDatum = new Date(laatstePoging.afgerond_op);
        vervalDatum.setMonth(vervalDatum.getMonth() + o.interval_maanden);
        openstaand = vervalDatum < new Date();
      }
      if(openstaand){
        aantal++;
        if(o.opleiding_soorten && o.opleiding_soorten.is_alert) alert = true;
      }
    }

    const { data: toolboxen } = await supabaseClient.from('toolbox_bibliotheek').select('*').eq('verplicht', true);
    for(const tb of (toolboxen||[])){
      if(!(await bentIkToegewezenShell(tb.koppeling_type, tb.koppeling_groep_id))) continue;
      const { data: sessies } = await supabaseClient.from('toolbox_sessies').select('id').eq('toolbox_id', tb.id);
      const sessieIds = (sessies||[]).map(s=>s.id);
      let gedaan = false;
      if(sessieIds.length){
        const { data: deelname } = await supabaseClient.from('toolbox_deelnemers').select('id').in('sessie_id', sessieIds).eq('profiel_id', huidigProfielId).limit(1);
        gedaan = !!(deelname && deelname.length);
      }
      if(!gedaan) aantal++;
    }

    const { data: wpiActies } = await supabaseClient.from('wpi_antwoord_acties').select('id').eq('toegewezen_aan', huidigProfielId).eq('afgerond', false);
    aantal += (wpiActies||[]).length;

    const { data: toolboxBevestigingen } = await supabaseClient.from('toolbox_bevestigingen').select('id').eq('profiel_id', huidigProfielId).eq('bevestigd', false);
    aantal += (toolboxBevestigingen||[]).length;

    const { data: toolboxControles } = await supabaseClient.from('toolbox_controle_ontvangers').select('id').eq('profiel_id', huidigProfielId).eq('beantwoord', false);
    aantal += (toolboxControles||[]).length;

    openstaandeActiesAantal = aantal;
    heeftOpenstaandeAlert = alert;
    pasActiesBadgeToe();
  }

  function pasActiesBadgeToe(){
    const railItem = document.querySelector('.rail-item[data-pagina="qhse-acties.html"]');
    if(railItem){
      railItem.querySelectorAll('.badge').forEach(b => b.remove());
      if(openstaandeActiesAantal > 0){
        railItem.insertAdjacentHTML('beforeend', `<span class="badge">${openstaandeActiesAantal}</span>`);
      }
      if(heeftOpenstaandeAlert){
        railItem.insertAdjacentHTML('beforeend', `<span class="badge alert">!</span>`);
      }
    }
    const tegel = document.querySelector('.tegel[onclick*="qhse-acties.html"]');
    if(tegel){
      tegel.querySelectorAll('.tegel-badge').forEach(b => b.remove());
      if(openstaandeActiesAantal > 0){
        tegel.insertAdjacentHTML('beforeend', `<span class="tegel-badge" style="right:12px">${openstaandeActiesAantal}</span>`);
      }
      if(heeftOpenstaandeAlert){
        tegel.insertAdjacentHTML('beforeend', `<span class="tegel-badge" style="right:${openstaandeActiesAantal > 0 ? '44px' : '12px'}; background:#e5484d;">!</span>`);
      }
    }
  }

  function kiesOmgeving(omgeving){
    const toegestaneBackend = MODULES_BACKEND.filter(m => m.rollen.includes(huidigProfielRol));
    if(omgeving === 'backend' && toegestaneBackend.length === 0){
      omgeving = 'frontend'; // vangnet: geen enkele beheer-module toegankelijk, dus niet eens tonen
    }
    document.getElementById('btnFrontend').classList.toggle('actief', omgeving==='frontend');
    document.getElementById('btnBackend').classList.toggle('actief', omgeving==='backend');
    document.getElementById('railItemsFrontend').classList.toggle('verborgen', omgeving!=='frontend');
    document.getElementById('railItemsBackend').classList.toggle('verborgen', omgeving!=='backend');
    bouwTegels(omgeving==='frontend' ? MODULES_FRONTEND : toegestaneBackend);
    toonDashboard();
    pasActiesBadgeToe();
  }

  function ga(el){
    document.querySelectorAll('.rail-item').forEach(i => i.classList.remove('actief'));
    el.classList.add('actief');
    document.getElementById('dashboardScherm').style.display = 'none';
    document.getElementById('hoofdFrame').style.display = 'block';
    document.getElementById('hoofdFrame').src = el.dataset.pagina;
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      if(session) initShell();
    });
  }
</script>
</body>
</html>
