<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Mijn Acties</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:7px 12px; font-size:12.5px; font-weight:600; }
  button.ghost{ background:transparent; }
  button.ghost.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  input, label{ font-family:'Inter',sans-serif; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; background:#fafaf9; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); padding:9px 14px; font-size:13px; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem</div>
      <h1>Mijn Acties</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  // Binnen de schil geopend? Dan hoort uitloggen via de schil zelf te gaan,
  // niet via deze losse knop (die anders alleen dit venster resette, terwijl
  // de schil eromheen nergens van wist).
  if(window.self !== window.top){
    const verbergUitlogKnoppenLokaal = () => {
      document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none');
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', verbergUitlogKnoppenLokaal);
    } else {
      verbergUitlogKnoppenLokaal();
    }
  }

  let huidigProfiel = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('login-scherm').classList.add('verborgen');
    document.getElementById('app-scherm').classList.remove('verborgen');
    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    inhoud.innerHTML = '<div class="meta">Laden…</div>';

    const [ontvangen, gemaakt, teDoen] = await Promise.all([verzamelOntvangen(), verzamelGemaakt(), verzamelTeDoen()]);

    inhoud.innerHTML = `
      <div class="eyebrow" style="margin-top:0">Te doen (${teDoen.length})</div>
      ${teDoen.map(renderTeDoenKaart).join('') || '<div class="meta" style="margin-bottom:16px">Niets te doen — helemaal bij.</div>'}
      <div class="eyebrow" style="margin-top:22px">Ontvangen (${ontvangen.length})</div>
      ${ontvangen.map(renderActieKaart).join('') || '<div class="meta" style="margin-bottom:16px">Niets openstaand voor jou.</div>'}
      <div class="eyebrow" style="margin-top:22px">Door mij gemaakt (${gemaakt.length})</div>
      ${gemaakt.map(renderActieKaart).join('') || '<div class="meta">Je hebt nog niets aangemaakt.</div>'}
    `;
  }

  async function ledenVanGroep(groepId){
    const { data } = await supabaseClient.from('groep_leden').select('profiel_id').eq('groep_id', groepId);
    return (data||[]).map(l=>l.profiel_id);
  }
  async function bentIkToegewezen(koppelingType, koppelingGroepId){
    if(koppelingType === 'iedereen') return true;
    if(!koppelingGroepId) return false;
    const ledenIds = await ledenVanGroep(koppelingGroepId);
    return ledenIds.includes(huidigProfiel.id);
  }

  async function verzamelTeDoen(){
    const items = [];

    const { data: opleidingen } = await supabaseClient.from('opleidingen').select('*, opleiding_soorten(naam, is_alert)');
    for(const o of (opleidingen||[])){
      if(!(await bentIkToegewezen(o.koppeling_type, o.koppeling_groep_id))) continue;
      const { data: versie } = await supabaseClient.from('opleiding_versies').select('id').eq('opleiding_id', o.id).eq('actief', true).maybeSingle();
      if(!versie) continue;
      const { data: laatstePoging } = await supabaseClient
        .from('opleiding_pogingen').select('*').eq('versie_id', versie.id).eq('profiel_id', huidigProfiel.id).eq('geslaagd', true)
        .order('afgerond_op', { ascending:false }).limit(1).maybeSingle();
      let openstaand = !laatstePoging;
      if(laatstePoging){
        const vervalDatum = new Date(laatstePoging.afgerond_op);
        vervalDatum.setMonth(vervalDatum.getMonth() + o.interval_maanden);
        openstaand = vervalDatum < new Date();
      }
      if(openstaand){
        const isAlert = o.opleiding_soorten && o.opleiding_soorten.is_alert;
        items.push({ bron: isAlert ? 'Alert' : 'Opleiding', isAlert, omschrijving: o.naam, pagina:'qhse-opleidingen.html?open=' + o.id });
      }
    }

    const { data: toolboxen } = await supabaseClient.from('toolbox_bibliotheek').select('*').eq('verplicht', true);
    for(const tb of (toolboxen||[])){
      if(!(await bentIkToegewezen(tb.koppeling_type, tb.koppeling_groep_id))) continue;
      const { data: sessies } = await supabaseClient.from('toolbox_sessies').select('id').eq('toolbox_id', tb.id);
      const sessieIds = (sessies||[]).map(s=>s.id);
      let gedaan = false;
      if(sessieIds.length){
        const { data: deelname } = await supabaseClient.from('toolbox_deelnemers').select('id').in('sessie_id', sessieIds).eq('profiel_id', huidigProfiel.id).limit(1);
        gedaan = !!(deelname && deelname.length);
      }
      if(!gedaan) items.push({ bron:'Toolbox', isAlert:false, omschrijving: tb.naam, pagina:'qhse-toolboxen.html?geef=' + tb.id + '&naam=' + encodeURIComponent(tb.naam) });
    }

    return items;
  }

  function renderTeDoenKaart(item){
    return `<div class="card klikbaar" onclick="window.location.href='${item.pagina}'" style="${item.isAlert ? 'border-color:var(--red);' : ''} cursor:pointer">
      <div class="row">
        <span class="tag" style="${item.isAlert ? 'background:var(--red-dim); color:var(--red);' : ''}">${item.isAlert ? '⚠️ ' : ''}${item.bron}</span>
        <span class="meta">→</span>
      </div>
      <div style="font-size:13px; margin-top:8px">${item.omschrijving}</div>
    </div>`;
  }

  async function verzamelOntvangen(){
    const items = [];

    const { data: meldingen } = await supabaseClient
      .from('meldingen_view').select('*').eq('actiehouder_id', huidigProfiel.id).neq('status', 'Afgehandeld');
    (meldingen||[]).forEach(m => items.push({ bron:'Melding', context:m.type, omschrijving:m.omschrijving, afgerond:false, actieType:'melding', actieId:m.id }));

    const { data: shiftActies } = await supabaseClient
      .from('logboek_regels').select('id, boodschap, afgerond, logboeken(naam)')
      .eq('toegewezen_aan', huidigProfiel.id).eq('afgerond', false);
    (shiftActies||[]).forEach(r => items.push({ bron:'Logboek', context: r.logboeken ? r.logboeken.naam : '', omschrijving:r.boodschap, afgerond:false, actieType:'shift', actieId:r.id }));

    const { data: vergaderActies } = await supabaseClient
      .from('logboek_acties').select('id, omschrijving, deadline, afgerond, logboek_regels(naam_vergadering, logboeken(naam))')
      .eq('toegewezen_aan', huidigProfiel.id).eq('afgerond', false);
    (vergaderActies||[]).forEach(a => items.push({
      bron:'Notule',
      context: a.logboek_regels ? a.logboek_regels.naam_vergadering : '',
      omschrijving:a.omschrijving,
      deadline: a.deadline,
      afgerond:false,
      actieType:'vergadering', actieId:a.id
    }));

    const { data: wpiActies } = await supabaseClient
      .from('wpi_antwoord_acties').select('id, omschrijving, deadline, afgerond, antwoord_id')
      .eq('toegewezen_aan', huidigProfiel.id).eq('afgerond', false);
    if(wpiActies && wpiActies.length){
      const antwoordIds = [...new Set(wpiActies.map(a=>a.antwoord_id))];
      const { data: antwoorden } = await supabaseClient.from('wpi_antwoorden').select('id, vraag_id, bezoek_id, antwoord, foto_pad').in('id', antwoordIds);
      const vraagIds = [...new Set((antwoorden||[]).map(a=>a.vraag_id))];
      const bezoekIds = [...new Set((antwoorden||[]).map(a=>a.bezoek_id))];
      const { data: vragen } = vraagIds.length ? await supabaseClient.from('wpi_vragen').select('id, tekst').in('id', vraagIds) : { data: [] };
      const { data: bezoeken } = bezoekIds.length ? await supabaseClient.from('wpi_bezoeken').select('id, formulier_id').in('id', bezoekIds) : { data: [] };
      const formulierIds = [...new Set((bezoeken||[]).map(b=>b.formulier_id))];
      const { data: formulieren } = formulierIds.length ? await supabaseClient.from('wpi_formulieren').select('id, naam').in('id', formulierIds) : { data: [] };

      const antwoordMap = {}; (antwoorden||[]).forEach(a => { antwoordMap[a.id] = a; });
      const vraagMap = {}; (vragen||[]).forEach(v => { vraagMap[v.id] = v; });
      const bezoekMap = {}; (bezoeken||[]).forEach(b => { bezoekMap[b.id] = b; });
      const formulierMap = {}; (formulieren||[]).forEach(f => { formulierMap[f.id] = f; });

      wpiActies.forEach(a => {
        const antw = antwoordMap[a.antwoord_id];
        const vraag = antw ? vraagMap[antw.vraag_id] : null;
        const bezoek = antw ? bezoekMap[antw.bezoek_id] : null;
        const formulier = bezoek ? formulierMap[bezoek.formulier_id] : null;
        items.push({
          bron:'WPI/MBB',
          context: formulier ? formulier.naam : '',
          omschrijving: a.omschrijving,
          vraagContext: vraag ? { vraag: vraag.tekst, antwoord: antw.antwoord, fotoPad: antw.foto_pad || null } : null,
          deadline: a.deadline,
          afgerond:false,
          actieType:'wpi', actieId:a.id
        });
      });
    }

    const { data: bevestigingen } = await supabaseClient
      .from('toolbox_bevestigingen').select('id, deelnemer_id, bevestigd')
      .eq('profiel_id', huidigProfiel.id).eq('bevestigd', false);
    if(bevestigingen && bevestigingen.length){
      const deelnemerIds = bevestigingen.map(b=>b.deelnemer_id);
      const { data: deelnemers } = await supabaseClient.from('toolbox_deelnemers').select('id, sessie_id').in('id', deelnemerIds);
      const sessieIds = [...new Set((deelnemers||[]).map(d=>d.sessie_id))];
      const { data: sessies } = sessieIds.length ? await supabaseClient.from('toolbox_sessies').select('id, toolbox_id, datum').in('id', sessieIds) : { data: [] };
      const toolboxIds = [...new Set((sessies||[]).map(s=>s.toolbox_id))];
      const { data: toolboxen } = toolboxIds.length ? await supabaseClient.from('toolbox_bibliotheek').select('id, naam').in('id', toolboxIds) : { data: [] };

      const deelnemerMap = {}; (deelnemers||[]).forEach(d => { deelnemerMap[d.id] = d; });
      const sessieMap = {}; (sessies||[]).forEach(s => { sessieMap[s.id] = s; });
      const toolboxMap = {}; (toolboxen||[]).forEach(t => { toolboxMap[t.id] = t; });

      bevestigingen.forEach(b => {
        const deelnemer = deelnemerMap[b.deelnemer_id];
        const sessie = deelnemer ? sessieMap[deelnemer.sessie_id] : null;
        const toolbox = sessie ? toolboxMap[sessie.toolbox_id] : null;
        items.push({
          bron:'Toolbox',
          context: sessie ? new Date(sessie.datum).toLocaleDateString('nl-NL') : '',
          omschrijving: 'Bevestig ontvangst: ' + (toolbox ? toolbox.naam : 'toolbox'),
          afgerond:false,
          actieType:'toolboxBevestiging', actieId:b.id
        });
      });
    }

    const { data: controleOntvangers } = await supabaseClient
      .from('toolbox_controle_ontvangers').select('id, controle_id')
      .eq('profiel_id', huidigProfiel.id).eq('beantwoord', false);
    if(controleOntvangers && controleOntvangers.length){
      const controleIds = [...new Set(controleOntvangers.map(o=>o.controle_id))];
      const { data: controles } = await supabaseClient.from('toolbox_controles').select('id, toolbox_id').in('id', controleIds);
      const toolboxIds = [...new Set((controles||[]).map(c=>c.toolbox_id))];
      const { data: toolboxen } = toolboxIds.length ? await supabaseClient.from('toolbox_bibliotheek').select('id, naam').in('id', toolboxIds) : { data: [] };
      const { data: vragen } = toolboxIds.length ? await supabaseClient.from('toolbox_controlevragen').select('*').in('toolbox_id', toolboxIds).order('volgorde') : { data: [] };

      const controleMap = {}; (controles||[]).forEach(c => { controleMap[c.id] = c; });
      const toolboxMap = {}; (toolboxen||[]).forEach(t => { toolboxMap[t.id] = t; });

      controleOntvangers.forEach(o => {
        const controle = controleMap[o.controle_id];
        const toolbox = controle ? toolboxMap[controle.toolbox_id] : null;
        const vragenVoorToolbox = controle ? (vragen||[]).filter(v => v.toolbox_id === controle.toolbox_id) : [];
        items.push({
          bron:'Controlevragen',
          context: toolbox ? toolbox.naam : '',
          omschrijving: 'Beantwoord de controlevragen over: ' + (toolbox ? toolbox.naam : 'deze toolbox'),
          afgerond:false,
          controleVragen: vragenVoorToolbox,
          actieType:'toolboxControle', actieId:o.id
        });
      });
    }

    return items;
  }

  async function verzamelGemaakt(){
    const items = [];

    const { data: verborgen } = await supabaseClient.from('verborgen_items').select('bron_tabel, bron_id').eq('profiel_id', huidigProfiel.id);
    const verborgenSet = new Set((verborgen||[]).map(v => v.bron_tabel + ':' + v.bron_id));
    const isVerborgen = (tabel, id) => verborgenSet.has(tabel + ':' + id);

    const { data: meldingen } = await supabaseClient
      .from('meldingen_view').select('*').eq('melder_id', huidigProfiel.id);
    (meldingen||[]).forEach(m => { if(!isVerborgen('meldingen', m.id)) items.push({ bron:'Melding', context:m.type, omschrijving:m.omschrijving, afgerond: m.status==='Afgehandeld', verbergTabel:'meldingen', verbergId:m.id }); });

    const { data: shiftActies } = await supabaseClient
      .from('logboek_regels').select('id, boodschap, afgerond, toegewezen_aan, logboeken(naam)')
      .eq('invuller_id', huidigProfiel.id).not('toegewezen_aan', 'is', null);
    (shiftActies||[]).forEach(r => { if(!isVerborgen('logboek_regels', r.id)) items.push({ bron:'Logboek', context: r.logboeken ? r.logboeken.naam : '', omschrijving:r.boodschap, afgerond:r.afgerond, verbergTabel:'logboek_regels', verbergId:r.id }); });

    const { data: regelsVanMij } = await supabaseClient
      .from('logboek_regels').select('id, naam_vergadering, logboeken(naam)').eq('invuller_id', huidigProfiel.id);
    const regelIds = (regelsVanMij||[]).map(r=>r.id);
    if(regelIds.length){
      const { data: acties } = await supabaseClient
        .from('logboek_acties').select('id, omschrijving, deadline, afgerond, regel_id').in('regel_id', regelIds);
      (acties||[]).forEach(a => {
        if(isVerborgen('logboek_acties', a.id)) return;
        const regel = (regelsVanMij||[]).find(r=>r.id===a.regel_id);
        items.push({ bron:'Notule', context: regel ? regel.naam_vergadering : '', omschrijving:a.omschrijving, deadline:a.deadline, afgerond:a.afgerond, verbergTabel:'logboek_acties', verbergId:a.id });
      });
    }

    return items;
  }

  async function verbergItem(tabel, id){
    const { error } = await supabaseClient.from('verborgen_items').insert({ profiel_id: huidigProfiel.id, bron_tabel: tabel, bron_id: id });
    if(error){ alert('Verbergen mislukt: ' + error.message); return; }
    await render();
  }

  async function bekijkWpiFoto(pad){
    const { data, error } = await supabaseClient.storage.from('wpi-fotos').createSignedUrl(pad, 300);
    if(error){ alert('Kon foto niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  let controleAntwoorden = {};

  function kiesControleAntwoord(actieId, vraagIndex, waarde){
    if(!controleAntwoorden[actieId]) controleAntwoorden[actieId] = {};
    controleAntwoorden[actieId][vraagIndex] = waarde;
    const jaKnop = document.getElementById(`controleJa-${actieId}-${vraagIndex}`);
    const neeKnop = document.getElementById(`controleNee-${actieId}-${vraagIndex}`);
    if(jaKnop) jaKnop.classList.toggle('actief', waarde === 'ja');
    if(neeKnop) neeKnop.classList.toggle('actief', waarde === 'nee');
  }

  async function verstuurControleAntwoorden(actieId){
    const vragenInfo = controleVragenCache[actieId] || [];
    const gegeven = controleAntwoorden[actieId] || {};
    const verplichtVragen = vragenInfo.filter(v => v.type !== 'open');
    const verplichtIndexen = vragenInfo.map((v,i) => v.type !== 'open' ? i : null).filter(i => i !== null);
    const ontbrekend = verplichtIndexen.some(i => !gegeven[i]);
    if(ontbrekend){
      alert('Beantwoord in ieder geval de ja/nee-vragen — de open vragen zijn optioneel.');
      return;
    }
    let score = 0;
    const antwoordRijen = vragenInfo
      .map((v, i) => ({ v, antwoord: gegeven[i] }))
      .filter(({ antwoord }) => antwoord !== undefined && antwoord !== '')
      .map(({ v, antwoord }) => {
        const isOpen = v.type === 'open';
        const juist = isOpen ? true : antwoord === v.juist;
        if(!isOpen && juist) score++;
        return { ontvanger_id: actieId, vraag_id: v.id, antwoord, juist };
      });
    const { error: antwoordFout } = await supabaseClient.from('toolbox_controle_antwoorden').insert(antwoordRijen);
    if(antwoordFout){ alert('Versturen mislukt: ' + antwoordFout.message); return; }
    const { error: ontvangerFout } = await supabaseClient.from('toolbox_controle_ontvangers').update({
      beantwoord: true, score, totaal: verplichtVragen.length, beantwoord_op: new Date().toISOString()
    }).eq('id', actieId);
    if(ontvangerFout){ alert('Opslaan mislukt: ' + ontvangerFout.message); return; }
    await render();
  }

  let controleVragenCache = {};

  function renderActieKaart(item){
    if(item.controleVragen){
      controleVragenCache[item.actieId] = item.controleVragen.map(v => ({ id:v.id, juist:v.juist_antwoord, type:v.type }));
    }
    return `<div class="card">
      <div class="row">
        <span class="tag">${item.bron}${item.context ? ' · ' + item.context : ''}</span>
        ${item.afgerond ? '<span class="tag" style="background:var(--green-dim); color:var(--green);">Afgerond</span>' : ''}
      </div>
      <div style="font-size:13px; margin-top:8px">${item.omschrijving || ''}</div>
      ${item.vraagContext ? `
        <div class="meta" style="margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px;">
          <b>${item.vraagContext.vraag}</b><br>Antwoord: ${item.vraagContext.antwoord}
          ${item.vraagContext.fotoPad ? `<div style="margin-top:6px"><button class="ghost" style="padding:5px 10px; font-size:12px" onclick="bekijkWpiFoto('${item.vraagContext.fotoPad}')">📷 Foto bekijken</button></div>` : ''}
        </div>
      ` : ''}
      ${item.deadline ? `<div class="meta" style="margin-top:6px">Deadline: ${new Date(item.deadline).toLocaleDateString('nl-NL')}</div>` : ''}
      ${item.controleVragen ? `
        <div id="controleBlok-${item.actieId}" style="margin-top:10px">
          <div class="meta">Fijn dat je erbij was — we horen graag hoe het was. Dit is geen toets, gewoon input om de toolboxen steeds beter te maken.</div>
          ${item.controleVragen.map((v,i) => v.type === 'open' ? `
            <div class="meta" style="margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px;">
              <b>${v.vraag}</b>
              <textarea rows="3" style="width:100%; margin-top:6px; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px;" oninput="kiesControleAntwoord('${item.actieId}', ${i}, this.value)" placeholder="Jouw antwoord (optioneel)"></textarea>
            </div>
          ` : `
            <div class="meta" style="margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px;">
              <b>${v.vraag}</b>
              <div class="row" style="margin-top:6px">
                <button class="ghost" id="controleJa-${item.actieId}-${i}" onclick="kiesControleAntwoord('${item.actieId}', ${i}, 'ja')" style="flex:1">Ja</button>
                <button class="ghost" id="controleNee-${item.actieId}-${i}" onclick="kiesControleAntwoord('${item.actieId}', ${i}, 'nee')" style="flex:1">Nee</button>
              </div>
            </div>
          `).join('')}
          <button class="primary" style="width:100%; margin-top:10px" onclick="verstuurControleAntwoorden('${item.actieId}')">Antwoorden versturen</button>
        </div>
      ` : ''}
      <div class="row" style="margin-top:10px">
        <span></span>
        <div style="display:flex; gap:8px">
          ${item.verbergTabel ? `<button class="ghost" onclick="verbergItem('${item.verbergTabel}','${item.verbergId}')">Verbergen</button>` : ''}
          ${!item.afgerond && item.actieType && item.actieType !== 'toolboxControle' ? `<button class="ghost" onclick="voerActieUit('${item.actieType}','${item.actieId}')">Markeer afgerond</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  async function voerActieUit(type, id){
    const afhandel_notitie = prompt('Notitie voor de audittrail (optioneel):');
    const notitieVeld = { afhandel_notitie: afhandel_notitie || null };
    if(type === 'melding') await supabaseClient.from('meldingen').update({ status: 'Afgehandeld', ...notitieVeld }).eq('id', id);
    else if(type === 'shift') await supabaseClient.from('logboek_regels').update({ afgerond: true, ...notitieVeld }).eq('id', id);
    else if(type === 'vergadering') await supabaseClient.from('logboek_acties').update({ afgerond: true, ...notitieVeld }).eq('id', id);
    else if(type === 'wpi') await supabaseClient.from('wpi_antwoord_acties').update({ afgerond: true, ...notitieVeld }).eq('id', id);
    else if(type === 'toolboxBevestiging') await supabaseClient.from('toolbox_bevestigingen').update({ bevestigd: true, bevestigd_op: new Date().toISOString() }).eq('id', id);
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
