<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Incidenten</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim: color-mix(in srgb, var(--accent) 10%, transparent); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip{ display:inline-block; font-size:12px; font-weight:600; padding:5px 11px; border-radius:20px; background:#eee; margin:3px 4px 0 0; cursor:pointer; }
  .chip.actief{ background:var(--accent-dim); color:var(--accent); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.ghost{ background:transparent; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:10px; }
  .klikbaar{ cursor:pointer; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .status{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; }
  .status.Afgehandeld{ background:var(--green-dim); color:var(--green); }
  .status.In-behandeling{ background:var(--amber-dim); color:var(--amber); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .waarschuwing{ background:#fbf0e2; color:#8a5416; font-size:13px; padding:10px 12px; border-radius:8px; }
  .info-signaal{ background:#e8f0f7; color:#2c5878; font-size:12.5px; padding:9px 12px; border-radius:8px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input, select, textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  .logboek-entry{ border-left:2px solid var(--accent); padding:6px 0 6px 12px; margin-bottom:8px; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit onderdeel is alleen voor Admin of KAM.</p>
    <button class="ghost btn-uitloggen-lokaal" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Incidenten</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  if(window.self !== window.top){
    const verbergUitlogKnoppenLokaal = () => { document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none'); };
    if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', verbergUitlogKnoppenLokaal); } else { verbergUitlogKnoppenLokaal(); }
  }

  const KLASSEN = ['Milieuincident','Bijna-ongeval','Ongeval zonder verzuim','Ongeval met EHBO','Ongeval met letsel/verzuim <1 dag','Ongeval met letsel/verzuim >1 dag','Ongeval met letsel/verzuim >3 werkdagen','Ongeval met blijvend letsel','Dodelijk ongeval','Beroepsziekte','Verkeersongeval','Brand','Materiële schade','Anders/onbekend'];
  const NLA_LIJST = ['Ongeval met letsel/verzuim >3 werkdagen','Ongeval met blijvend letsel','Dodelijk ongeval'];

  let huidigProfiel = null;
  let scherm = 'lijst'; // 'lijst' | 'detail'
  let actiefId = null;
  let filterStatus = '';
  let filterKlasse = '';

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }

  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id, is_leidinggevende').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    supabaseClient.from('organisaties').select('accentkleur').eq('id', profiel.organisatie_id).single()
      .then(({ data: kleurOrg }) => { if(kleurOrg && kleurOrg.accentkleur){ document.documentElement.style.setProperty('--accent', kleurOrg.accentkleur); } });
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    const params = new URLSearchParams(window.location.search);
    const klasseUitLink = params.get('classificatie');
    if(klasseUitLink) filterKlasse = klasseUitLink;
    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(scherm === 'detail'){
      inhoud.innerHTML = await renderDetail();
      await vulOverdrachtKandidaten();
    } else {
      inhoud.innerHTML = await renderLijst();
    }
  }

  async function vulOverdrachtKandidaten(){
    const select = document.getElementById('overdrachtNaar');
    if(!select) return;
    const { data: kandidaten } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').in('rol', ['admin','kam']).eq('in_dienst', true).order('achternaam');
    select.innerHTML = (kandidaten||[]).filter(k=>k.id!==huidigProfiel.id).map(k => `<option value="${k.id}">${k.voornaam} ${k.achternaam}</option>`).join('');
  }

  async function draagOver(){
    const naarId = document.getElementById('overdrachtNaar').value;
    if(!naarId) return;
    const { error } = await supabaseClient.from('meldingen').update({ actiehouder_id: naarId }).eq('id', actiefId);
    if(error){ alert('Overdragen mislukt: ' + error.message); return; }
    await render();
  }

  async function renderLijst(){
    let query = supabaseClient.from('meldingen').select('*').eq('type', 'Incident').eq('organisatie_id', huidigProfiel.organisatie_id).order('aangemaakt_op', { ascending:false });
    if(filterStatus) query = query.eq('status', filterStatus);
    if(filterKlasse) query = query.eq('classificatie_definitief', filterKlasse);
    const { data: incidenten, error } = await query;
    if(error) return '<div class="fout">Kon incidenten niet laden: ' + error.message + '</div>';

    function isVerouderd(m){
      const dagenOud = (Date.now() - new Date(m.aangemaakt_op).getTime()) / (1000*60*60*24);
      if(m.status === 'Nieuw' && dagenOud > 1) return true;
      if(m.status === 'In behandeling' && dagenOud > 30) return true;
      return false;
    }

    const rows = (incidenten||[]).map(m => `
      <div class="card klikbaar" onclick="openDetail('${m.id}')">
        <div class="row">
          <b>${m.classificatie_definitief || (m.classificatie_melder ? m.classificatie_melder + ' (nog niet definitief)' : 'Nog niet geclassificeerd')}</b>
          <span class="status ${m.status.replace(' ','-')}">${m.status}</span>
        </div>
        <div class="meta" style="margin-top:4px">${(m.omschrijving||'').slice(0,120)}${(m.omschrijving||'').length>120?'…':''}</div>
        <div class="meta" style="margin-top:4px">${new Date(m.aangemaakt_op).toLocaleDateString('nl-NL')}${m.nla_gemeld === false && m.classificatie_definitief && NLA_LIJST.includes(m.classificatie_definitief) ? ' · ⚠ NLA nog niet gemeld' : ''}${isVerouderd(m) ? ` · ⚠ Staat al langer dan ${m.status==='Nieuw'?'24 uur op Nieuw':'een maand in behandeling'}` : ''}</div>
      </div>`).join('') || '<div class="meta">Geen incidenten gevonden (met deze filters).</div>';

    return `
      <div class="card" style="margin-bottom:16px">
        <div class="eyebrow" style="margin-top:0">Filteren</div>
        <div class="row" style="gap:8px">
          <select id="fStatus" onchange="filterStatus=this.value; render();" style="flex:1">
            <option value="">Alle statussen</option>
            <option ${filterStatus==='Nieuw'?'selected':''}>Nieuw</option>
            <option ${filterStatus==='In behandeling'?'selected':''}>In behandeling</option>
            <option ${filterStatus==='Afgehandeld'?'selected':''}>Afgehandeld</option>
          </select>
          <select id="fKlasse" onchange="filterKlasse=this.value; render();" style="flex:1">
            <option value="">Alle classificaties</option>
            ${KLASSEN.map(k => `<option ${filterKlasse===k?'selected':''}>${k}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="meta" style="margin-bottom:12px">${(incidenten||[]).length} incident(en)</div>
      ${rows}
    `;
  }

  async function openDetail(id){
    actiefId = id;
    scherm = 'detail';
    await render();
  }

  async function renderDetail(){
    const { data: m, error } = await supabaseClient.from('meldingen').select('*').eq('id', actiefId).single();
    if(error) return '<div class="fout">Kon incident niet laden: ' + error.message + '</div>';

    let melderNaam = 'Anoniem';
    if(!m.anoniem && m.melder_id){
      const { data: melder } = await supabaseClient.from('profielen').select('voornaam, achternaam').eq('id', m.melder_id).maybeSingle();
      if(melder) melderNaam = melder.voornaam + ' ' + melder.achternaam;
    } else if(m.extern_naam){
      melderNaam = m.extern_naam + ' (extern)';
    }

    let locatieNaam = '', vestigingNaam = '';
    if(m.locatie_id){ const { data: loc } = await supabaseClient.from('locaties').select('naam').eq('id', m.locatie_id).maybeSingle(); if(loc) locatieNaam = loc.naam; }
    if(m.vestiging_id){ const { data: vest } = await supabaseClient.from('vestigingen').select('naam').eq('id', m.vestiging_id).maybeSingle(); if(vest) vestigingNaam = vest.naam; }

    let actiehouderNaam = '';
    if(m.actiehouder_id){
      const { data: ah } = await supabaseClient.from('profielen').select('voornaam, achternaam').eq('id', m.actiehouder_id).maybeSingle();
      if(ah) actiehouderNaam = ah.voornaam + ' ' + ah.achternaam;
    }
    const magOverdragen = huidigProfiel.rol === 'admin'
      || (huidigProfiel.rol === 'kam' && (m.actiehouder_id === huidigProfiel.id || huidigProfiel.is_leidinggevende));

    const magWijzigenClassificatie = huidigProfiel.rol === 'admin' || !m.classificatie_definitief || (huidigProfiel.rol === 'kam' && huidigProfiel.is_leidinggevende);
    const nlaVerplicht = m.classificatie_definitief && NLA_LIJST.includes(m.classificatie_definitief);

    let herhalingSignaal = '';
    if(m.classificatie_definitief && m.locatie_id){
      const dertigDagenGeleden = new Date(Date.now() - 30*24*60*60*1000).toISOString();
      const { count: herhalingAantal } = await supabaseClient.from('meldingen').select('*', { count:'exact', head:true })
        .eq('type', 'Incident').eq('classificatie_definitief', m.classificatie_definitief).eq('locatie_id', m.locatie_id)
        .gte('aangemaakt_op', dertigDagenGeleden);
      if(herhalingAantal && herhalingAantal > 1){
        herhalingSignaal = `ℹ️ Ter info (geen harde conclusie, alleen een signaal): dit is de ${herhalingAantal}e melding met classificatie "${m.classificatie_definitief}" op deze locatie in de afgelopen 30 dagen.`;
      }
    }

    const { data: historie } = await supabaseClient.from('melding_classificatie_historie').select('*, profielen(voornaam, achternaam)').eq('melding_id', m.id).order('gewijzigd_op', { ascending:false });
    const { data: opvolgingEntries } = await supabaseClient.from('melding_opvolging_entries').select('*, profielen(voornaam, achternaam)').eq('melding_id', m.id).order('aangemaakt_op', { ascending:false });
    const { data: documenten } = await supabaseClient.from('melding_incidentonderzoek_documenten').select('*, profielen(voornaam, achternaam)').eq('melding_id', m.id).order('geupload_op', { ascending:false });

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>

      <div class="card">
        <div class="row">
          <b>Incident-details</b>
          <span class="status ${m.status.replace(' ','-')}">${m.status}</span>
        </div>
        <div class="meta" style="margin-top:8px">${m.omschrijving}</div>
        <div class="meta" style="margin-top:8px">Gemeld door: ${melderNaam} · ${new Date(m.aangemaakt_op).toLocaleString('nl-NL')}</div>
        <div class="meta" style="margin-top:2px">${m.actiehouder_id ? `In behandeling bij: ${actiehouderNaam || '—'}` : 'Nog niet toegewezen'}</div>
        ${magOverdragen && m.actiehouder_id ? `
          <div class="row" style="gap:8px; margin-top:8px">
            <select id="overdrachtNaar" style="flex:1"></select>
            <button class="ghost" onclick="draagOver()">Overdragen</button>
          </div>
        ` : ''}
        ${locatieNaam || vestigingNaam ? `<div class="meta" style="margin-top:2px">📍 ${locatieNaam}${locatieNaam && vestigingNaam ? ' · ' : ''}${vestigingNaam}</div>` : ''}
        ${m.foto_pad ? `<button class="ghost" style="margin-top:8px" onclick="bekijkFoto('${m.foto_pad}')">📷 Foto bekijken</button>` : ''}
      </div>

      <div class="card" style="margin-top:12px">
        <div class="eyebrow" style="margin-top:0">Classificatie</div>
        <div class="meta">Inschatting van de melder: <b>${m.classificatie_melder || 'geen opgegeven'}</b></div>
        <label>Definitieve classificatie ${!m.classificatie_definitief ? '(verplicht vóór afhandelen)' : ''}</label>
        <select id="classDef" ${magWijzigenClassificatie ? '' : 'disabled'}>
          <option value="">— nog niet bepaald —</option>
          ${KLASSEN.map(k => `<option ${m.classificatie_definitief===k?'selected':''}>${k}</option>`).join('')}
        </select>
        ${!magWijzigenClassificatie ? '<div class="meta" style="margin-top:2px">Alleen een KAM-medewerker met leidinggevende-rechten (of admin) mag dit nog wijzigen.</div>' : ''}

        <label>Materiële schade — bandbreedte (indien van toepassing)</label>
        <select id="schadeBand" ${magWijzigenClassificatie ? '' : 'disabled'}>
          <option value="">—</option>
          ${['< €500','€500 - €2.500','€2.500 - €10.000','> €10.000'].map(b => `<option ${m.materiele_schade_bandbreedte===b?'selected':''}>${b}</option>`).join('')}
        </select>

        ${herhalingSignaal ? `<div class="info-signaal" style="margin-top:10px">${herhalingSignaal}</div>` : ''}

        ${nlaVerplicht ? `
          <div class="waarschuwing" style="margin-top:10px">⚠ Dit type moet gemeld worden bij de Nederlandse Arbeidsinspectie (NLA) — onverwijld, zonder uitstel.</div>
          <label style="display:flex; align-items:center; gap:8px; margin-top:8px">
            <input type="checkbox" id="nlaGemeld" style="width:auto" ${m.nla_gemeld?'checked':''}> Al gemeld bij de NLA
          </label>
          <label>NLA-registratienummer</label>
          <input type="text" id="nlaNummer" value="${m.nla_registratienummer||''}">
        ` : ''}

        <button class="primary" style="margin-top:14px" onclick="slaClassificatieOp()">Opslaan</button>
        <div class="fout verborgen" id="classFout"></div>
        <div class="melding verborgen" id="classMelding"></div>

        ${historie && historie.length > 1 ? `
          <div class="meta" style="margin-top:14px; font-weight:600">Wijzigingsgeschiedenis</div>
          ${historie.map(h => `<div class="meta">${h.classificatie} — ${h.profielen ? h.profielen.voornaam+' '+h.profielen.achternaam : 'onbekend'}, ${new Date(h.gewijzigd_op).toLocaleString('nl-NL')}</div>`).join('')}
        ` : ''}
      </div>

      <div class="card" style="margin-top:12px">
        <div class="eyebrow" style="margin-top:0">Opvolging (logboek)</div>
        <textarea id="nieuweOpvolging" rows="3" placeholder="Beschrijf de genomen of geplande vervolgstap…"></textarea>
        <button class="ghost" style="margin-top:8px" onclick="voegOpvolgingToe()">+ Toevoegen aan logboek</button>
        <div class="fout verborgen" id="opvolgFout"></div>
        <div style="margin-top:14px">
          ${(opvolgingEntries||[]).map(e => `
            <div class="logboek-entry">
              <div style="font-size:13px">${e.tekst}</div>
              <div class="meta" style="margin-top:2px">${e.profielen ? e.profielen.voornaam+' '+e.profielen.achternaam : 'onbekend'} · ${new Date(e.aangemaakt_op).toLocaleString('nl-NL')}</div>
            </div>
          `).join('') || '<div class="meta">Nog geen opvolging ingevoerd.</div>'}
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="eyebrow" style="margin-top:0">Incidentonderzoek-documenten</div>
        <div class="meta" style="margin-bottom:8px">Elk geüpload document blijft permanent bewaard — eerdere versies verdwijnen nooit.</div>
        <label style="margin-top:0">Documentnaam</label>
        <input type="text" id="nieuwDocNaam" placeholder="Bijv. 'Onderzoeksrapport v1' of 'Foto's ongevalslocatie'">
        <label>Bestand</label>
        <input type="file" id="nieuwDocBestand" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
        <button class="ghost" style="margin-top:8px" onclick="voegDocumentToe()">+ Toevoegen aan documentenlijst</button>
        <div class="fout verborgen" id="docFout"></div>
        <div style="margin-top:14px">
          ${(documenten||[]).map(d => `
            <div class="logboek-entry klikbaar" onclick="bekijkOnderzoek('${d.bestandspad}')">
              <div style="font-size:13px; font-weight:600;">📄 ${d.documentnaam}</div>
              <div class="meta" style="margin-top:2px">${d.profielen ? d.profielen.voornaam+' '+d.profielen.achternaam : 'onbekend'} · ${new Date(d.geupload_op).toLocaleString('nl-NL')}</div>
            </div>
          `).join('') || '<div class="meta">Nog geen documenten geüpload.</div>'}
        </div>
      </div>
    `;
  }

  async function slaClassificatieOp(){
    const foutEl = document.getElementById('classFout');
    const meldingEl = document.getElementById('classMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    const classificatie_definitief = document.getElementById('classDef').value || null;
    const materiele_schade_bandbreedte = document.getElementById('schadeBand').value || null;
    const payload = { classificatie_definitief, materiele_schade_bandbreedte };

    const nlaGemeldEl = document.getElementById('nlaGemeld');
    const nlaNummerEl = document.getElementById('nlaNummer');
    if(nlaGemeldEl) payload.nla_gemeld = nlaGemeldEl.checked;
    if(nlaNummerEl) payload.nla_registratienummer = nlaNummerEl.value.trim() || null;


    const { error } = await supabaseClient.from('meldingen').update(payload).eq('id', actiefId);
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    meldingEl.textContent = '✓ Opgeslagen.'; meldingEl.classList.remove('verborgen');
    await render();
  }

  async function voegOpvolgingToe(){
    const tekst = document.getElementById('nieuweOpvolging').value.trim();
    const foutEl = document.getElementById('opvolgFout');
    foutEl.classList.add('verborgen');
    if(!tekst) return;
    const { error } = await supabaseClient.from('melding_opvolging_entries').insert({ melding_id: actiefId, tekst, aangemaakt_door: huidigProfiel.id });
    if(error){ foutEl.textContent = 'Toevoegen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    await render();
  }

  async function bepaalOpnameMoment(file){
    let opnameTijd = null;
    try{
      if(window.exifr){
        const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
        if(exif) opnameTijd = exif.DateTimeOriginal || exif.CreateDate || null;
      }
    }catch(e){ /* geen EXIF, geen probleem */ }
    if(!opnameTijd) opnameTijd = new Date(file.lastModified);
    const minutenGeleden = (Date.now() - opnameTijd.getTime()) / 60000;
    return { opnameTijd, isNetGenomen: minutenGeleden > -5 && minutenGeleden < 5 };
  }

  async function vraagLocatieOp(){
    if(!navigator.geolocation) return null;
    try{
      const positie = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
      });
      return `${positie.coords.latitude.toFixed(5)}, ${positie.coords.longitude.toFixed(5)}`;
    }catch(e){ return null; }
  }

  function tekenOverlay(ctx, width, height, regels){
    const fontGrootte = Math.max(14, Math.round(width / 40));
    ctx.font = `${fontGrootte}px sans-serif`;
    ctx.textBaseline = 'bottom';
    const regelHoogte = fontGrootte * 1.3;
    const padding = fontGrootte * 0.5;
    const breedste = Math.max(...regels.map(t => ctx.measureText(t).width));
    const blokHoogte = regels.length * regelHoogte + padding;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(width - breedste - padding*2, height - blokHoogte, breedste + padding*2, blokHoogte);
    ctx.fillStyle = '#fff';
    regels.forEach((regel, i) => {
      ctx.fillText(regel, width - breedste - padding, height - padding - (regels.length-1-i)*regelHoogte);
    });
  }

  // Alleen voor afbeeldingen: comprimeert en brandt eventueel tijd+locatie in, als de foto net genomen is.
  // PDF/Word-bestanden gaan hier niet doorheen — die worden ongewijzigd geüpload.
  async function verwerkFotoMetOverlay(file){
    const { opnameTijd, isNetGenomen } = await bepaalOpnameMoment(file);
    const locatieTekst = isNetGenomen ? await vraagLocatieOp() : null;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = () => reject(new Error('Bestand kon niet gelezen worden.'));
      img.onload = () => {
        const MAX = 1600;
        let { width, height } = img;
        if(width > MAX || height > MAX){
          const schaal = MAX / Math.max(width, height);
          width = Math.round(width * schaal);
          height = Math.round(height * schaal);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        if(isNetGenomen){
          const regels = [opnameTijd.toLocaleString('nl-NL')];
          if(locatieTekst) regels.push(locatieTekst);
          tekenOverlay(ctx, width, height, regels);
        }
        canvas.toBlob((blob) => {
          if(!blob){ reject(new Error('Comprimeren mislukt.')); return; }
          resolve(blob);
        }, 'image/jpeg', 0.8);
      };
      img.onerror = () => reject(new Error('Foto kon niet geladen worden.'));
      reader.readAsDataURL(file);
    });
  }

  async function voegDocumentToe(){
    const documentnaam = document.getElementById('nieuwDocNaam').value.trim();
    const bestandInput = document.getElementById('nieuwDocBestand');
    const foutEl = document.getElementById('docFout');
    foutEl.classList.add('verborgen');
    if(!documentnaam){ foutEl.textContent = 'Geef het document een naam.'; foutEl.classList.remove('verborgen'); return; }
    if(!bestandInput.files[0]){ foutEl.textContent = 'Kies een bestand.'; foutEl.classList.remove('verborgen'); return; }

    const file = bestandInput.files[0];
    let teUploaden = file;
    let extensie = (file.name.split('.').pop() || '').toLowerCase();
    if(file.type.startsWith('image/')){
      try{
        teUploaden = await verwerkFotoMetOverlay(file);
        extensie = 'jpg';
      }catch(e){
        foutEl.textContent = 'Foto verwerken mislukt: ' + e.message; foutEl.classList.remove('verborgen'); return;
      }
    }
    const pad = `${huidigProfiel.organisatie_id}/${actiefId}-${Date.now()}.${extensie}`;
    const { error: uploadFout } = await supabaseClient.storage.from('incidentonderzoeken').upload(pad, teUploaden);
    if(uploadFout){ foutEl.textContent = 'Uploaden mislukt: ' + uploadFout.message; foutEl.classList.remove('verborgen'); return; }

    const { error } = await supabaseClient.from('melding_incidentonderzoek_documenten').insert({
      melding_id: actiefId, documentnaam, bestandspad: pad, geupload_door: huidigProfiel.id
    });
    if(error){ foutEl.textContent = 'Toevoegen aan lijst mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    await render();
  }

  async function bekijkFoto(pad){
    const { data, error } = await supabaseClient.storage.from('meldingen-extern-fotos').createSignedUrl(pad, 300);
    if(error){ alert('Kon foto niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }
  async function bekijkOnderzoek(pad){
    const { data, error } = await supabaseClient.storage.from('incidentonderzoeken').createSignedUrl(pad, 300);
    if(error){ alert('Kon document niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
