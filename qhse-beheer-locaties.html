<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QHSE — Locaties</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --red:#c0392b; --red-dim:#fbeae8;
    --green:#1c9468; --green-dim:#d3f1e3; --amber:#b57a10; --amber-dim:#f6e3bd;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.ghost{ background:transparent; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .klikbaar{ cursor:pointer; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .callout{ background:var(--amber-dim); color:var(--amber); font-size:12.5px; padding:12px 14px; border-radius:8px; margin-bottom:16px; line-height:1.5; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input, select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit scherm is alleen voor Admin of KAM.</p>
    <button class="ghost" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Locaties</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  const APP_URL = "https://roelhernaus.github.io/qhse-app";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  let huidigProfiel = null;
  let huidigeOrganisatie = null;
  let scherm = 'lijst'; // 'lijst' | 'locatie' | 'nieuw'
  let actieveLocatieId = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }

  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');

    const { data: org } = await supabaseClient.from('organisaties').select('*').eq('id', profiel.organisatie_id).single();
    huidigeOrganisatie = org;

    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'nieuw') inhoud.innerHTML = renderNieuw();
    else if(scherm === 'locatie') inhoud.innerHTML = await renderLocatie();
  }

  async function renderLijst(){
    const { data: locaties, error } = await supabaseClient.from('locaties').select('*').order('naam');
    if(error) return '<div class="fout">Kon locaties niet laden: ' + error.message + '</div>';

    const kaarten = await Promise.all((locaties||[]).map(async (l) => {
      let telQuery = supabaseClient.from('checkins').select('*', { count:'exact', head:true })
        .eq('locatie_id', l.id).is('uitgecheckt_op', null);
      if(huidigeOrganisatie.checkin_dagelijks_resetten){
        const vandaag00 = new Date(); vandaag00.setHours(0,0,0,0);
        telQuery = telQuery.gte('ingecheckt_op', vandaag00.toISOString());
      }
      const { count } = await telQuery;
      return `
        <div class="card klikbaar" onclick="openLocatie('${l.id}')">
          <div class="row">
            <b>${l.naam}</b>
            <span class="tag" style="${count > 0 ? 'background:var(--green-dim); color:var(--green);' : ''}">${count ?? 0} ingecheckt</span>
          </div>
        </div>`;
    }));

    return `
      <div class="callout">
        Dit systeem houdt uitsluitend bij óf iemand op dit moment is ingecheckt. Er wordt <b>geen aanwezigheidsduur of werktijd</b> bijgehouden of berekend.
      </div>
      <div class="card">
        <label style="margin-top:0; display:flex; align-items:center; gap:8px">
          <input type="checkbox" id="dagResetCheckbox" style="width:auto" ${huidigeOrganisatie.checkin_dagelijks_resetten ? 'checked' : ''} onchange="wisselDagReset(this.checked)">
          Elke dag om 00:00 automatisch alle inchecks resetten
        </label>
        <div class="meta" style="margin-top:4px">Staat dit uit, dan blijft iemand ingecheckt totdat hij zelf uitcheckt, of een beheerder dat voor hem doet — ook op een volgende dag.</div>
      </div>
      <div class="row" style="margin:16px 0">
        <span class="meta">${(locaties||[]).length} locaties</span>
        <button class="primary" onclick="scherm='nieuw'; render();">+ Nieuwe locatie</button>
      </div>
      ${kaarten.join('') || '<div class="meta">Nog geen locaties.</div>'}
    `;
  }

  async function wisselDagReset(waarde){
    const { error } = await supabaseClient.from('organisaties').update({ checkin_dagelijks_resetten: waarde }).eq('id', huidigeOrganisatie.id);
    if(error){ alert('Opslaan mislukt: ' + error.message); return; }
    huidigeOrganisatie.checkin_dagelijks_resetten = waarde;
  }

  function renderNieuw(){
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Naam van de locatie</label>
        <input type="text" id="nlNaam" placeholder="Bijv. 'Bouwplaats Rotterdam-Zuid'">
        <div class="row" style="margin-top:16px">
          <span></span>
          <button class="primary" onclick="opslaanNieuweLocatie()">Aanmaken</button>
        </div>
        <div class="fout verborgen" id="nlFout"></div>
      </div>
    `;
  }

  async function opslaanNieuweLocatie(){
    const naam = document.getElementById('nlNaam').value.trim();
    const foutEl = document.getElementById('nlFout');
    foutEl.classList.add('verborgen');
    if(!naam){ foutEl.textContent = 'Naam is verplicht.'; foutEl.classList.remove('verborgen'); return; }
    const { data, error } = await supabaseClient.from('locaties').insert({ organisatie_id: huidigProfiel.organisatie_id, naam }).select().single();
    if(error){ foutEl.textContent = 'Aanmaken mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    actieveLocatieId = data.id;
    scherm = 'locatie';
    await render();
  }

  async function openLocatie(id){
    actieveLocatieId = id;
    scherm = 'locatie';
    await render();
  }

  async function renderLocatie(){
    const { data: l, error } = await supabaseClient.from('locaties').select('*').eq('id', actieveLocatieId).single();
    if(error) return '<div class="fout">Kon locatie niet laden: ' + error.message + '</div>';

    const checkinUrl = `${APP_URL}/qhse-checkin.html?locatie=${l.qr_code}`;
    const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(checkinUrl)}`;

    let checkinsQuery = supabaseClient
      .from('checkins').select('*').eq('locatie_id', l.id).is('uitgecheckt_op', null)
      .order('ingecheckt_op', { ascending:true });
    if(huidigeOrganisatie.checkin_dagelijks_resetten){
      const vandaag00 = new Date(); vandaag00.setHours(0,0,0,0);
      checkinsQuery = checkinsQuery.gte('ingecheckt_op', vandaag00.toISOString());
    }
    const { data: checkins, error: checkinsFout } = await checkinsQuery;
    if(checkinsFout) console.error('Kon checkins niet laden:', checkinsFout);

    const profielIds = (checkins||[]).map(c => c.profiel_id);
    let profielenMap = {};
    if(profielIds.length){
      const { data: profielen } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').in('id', profielIds);
      (profielen||[]).forEach(p => { profielenMap[p.id] = p; });
    }

    const rows = (checkins||[]).map(c => {
      const p = profielenMap[c.profiel_id];
      return `
      <div class="card row">
        <span>${p ? p.voornaam + ' ' + p.achternaam : '—'}</span>
        <button class="ghost" onclick="checkUit('${c.id}')">Uitchecken</button>
      </div>`;
    }).join('') || '<div class="meta">Niemand ingecheckt.</div>';

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <b>${l.naam}</b>
        <div class="row" style="margin-top:10px">
          <button class="ghost" onclick="verwijderLocatie()">Verwijderen</button>
          <button class="ghost" onclick="printQr('${qrImg.replace(/'/g,"\\'")}', '${l.naam.replace(/'/g,"\\'")}')">🖨️ Print QR-code (A4)</button>
        </div>
      </div>
      <div class="eyebrow" style="margin-top:20px">Nu ingecheckt (${(checkins||[]).length})</div>
      ${rows}
    `;
  }

  function printQr(qrImgUrl, naam){
    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>Check-in QR — ${naam}</title>
      <style>
        body{ font-family: Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
        h1{ font-size:32px; margin-bottom:4px; }
        h2{ font-size:20px; font-weight:400; color:#555; margin-top:0; margin-bottom:30px; }
        img{ width:320px; height:320px; }
        p{ font-size:14px; color:#888; margin-top:24px; }
      </style></head><body>
        <h1>Check-in op deze locatie:</h1>
        <h2>${naam}</h2>
        <img src="${qrImgUrl}">
        <p>Scan met de camera van je telefoon</p>
        <script>window.print();<\/script>
      </body></html>
    `);
    venster.document.close();
  }

  async function checkUit(checkinId){
    const { error } = await supabaseClient.from('checkins').update({
      uitgecheckt_op: new Date().toISOString(), uitgecheckt_door: huidigProfiel.id
    }).eq('id', checkinId);
    if(error){ alert('Uitchecken mislukt: ' + error.message); return; }
    await render();
  }

  async function verwijderLocatie(){
    if(!confirm('Deze locatie verwijderen? De QR-code werkt daarna niet meer.')) return;
    const { error } = await supabaseClient.from('locaties').delete().eq('id', actieveLocatieId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    scherm = 'lijst';
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
