<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Beheer Keuringen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  input, select, textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .card.klikbaar{ cursor:pointer; }
  .card.klikbaar:hover{ border-color:var(--accent); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit beheerscherm is alleen voor Admin, KAM of Keurmeester.</p>
    <button class="ghost btn-uitloggen-lokaal" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Keuringen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  // Binnen de schil geopend? Dan hoort uitloggen via de schil zelf te gaan,
  // niet via deze losse knop (die anders alleen dit venster resette, terwijl
  // de schil eromheen nergens van wist).
  if(window.self !== window.top){
    const verbergUitlogKnoppenLokaal = () => {
      document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none');
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', verbergUitlogKnoppenLokaal);
    } else {
      verbergUitlogKnoppenLokaal();
    }
  }

  let huidigProfiel = null;
  let tabActief = 'register'; // 'register' | 'onbekend' | 'checklists'
  let scherm = 'lijst'; // 'lijst' | 'middel' | 'aanvraagDetail'
  let actiefId = null;
  let checklistCategorieId = null;
  let checklistTypeId = null;
  let zelfRegistrerenAntwoorden = [];
  let vastleggenModus = 'upload'; // 'upload' | 'checklist'
  let actiefAanvraagId = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam','keurmeester'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    await render();
  }

  function setTab(t){ tabActief = t; scherm = 'lijst'; render(); }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    let tabsHtml = `
      <div class="tabs">
        <div class="tab ${tabActief==='register'?'actief':''}" onclick="setTab('register')">Register</div>
        <div class="tab ${tabActief==='onbekend'?'actief':''}" onclick="setTab('onbekend')">Onbekende ID's</div>
        <div class="tab ${tabActief==='checklists'?'actief':''}" onclick="setTab('checklists')">Checklists</div>
      </div>`;
    let inhoudHtml = '';
    if(scherm === 'middel') inhoudHtml = await renderMiddel();
    else if(scherm === 'nieuw') inhoudHtml = await renderNieuwMiddel();
    else if(scherm === 'aanvraagDetail') inhoudHtml = await renderAanvraagDetail();
    else if(scherm === 'checklistCategorie') inhoudHtml = await renderChecklistCategorie();
    else if(scherm === 'checklistType') inhoudHtml = await renderChecklistType();
    else if(scherm === 'zelfRegistreren') inhoudHtml = await renderZelfRegistreren();
    else if(tabActief === 'register') inhoudHtml = await renderRegister();
    else if(tabActief === 'checklists') inhoudHtml = await renderChecklists();
    else inhoudHtml = await renderOnbekend();
    inhoud.innerHTML = tabsHtml + inhoudHtml;
  }

  async function renderChecklists(){
    const { data: categorieen, error } = await supabaseClient.from('keuringscategorieen').select('*').order('naam');
    if(error) return '<div class="fout">Kon categorieën niet laden: ' + error.message + '</div>';
    const { data: typen } = await supabaseClient.from('arbeidsmiddel_typen').select('id, keuringscategorie_id');
    const aantalPerCategorie = {};
    (typen||[]).forEach(t => { aantalPerCategorie[t.keuringscategorie_id] = (aantalPerCategorie[t.keuringscategorie_id]||0) + 1; });
    const rows = (categorieen||[]).map(c => `
      <div class="card klikbaar" onclick="openChecklistCategorie('${c.id}')">
        <div class="row">
          <b>${c.naam}</b>
          <span class="meta">${aantalPerCategorie[c.id] || 0} typen</span>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen categorieën (beheer die via Instellingen).</div>';
    return `
      <div class="meta" style="margin-bottom:16px">Checklists zijn ingedeeld per categorie én per type arbeidsmiddel binnen die categorie — een boormachine heeft een andere checklist dan een hamer, ook al vallen ze onder dezelfde categorie.</div>
      ${rows}
    `;
  }

  async function openChecklistCategorie(id){
    checklistCategorieId = id;
    scherm = 'checklistCategorie';
    await render();
  }

  async function renderChecklistCategorie(){
    const { data: categorie } = await supabaseClient.from('keuringscategorieen').select('*').eq('id', checklistCategorieId).single();
    const { data: typen } = await supabaseClient.from('arbeidsmiddel_typen').select('*').eq('keuringscategorie_id', checklistCategorieId).order('naam');
    const typeIds = (typen||[]).map(t=>t.id);
    let aantalVragen = {};
    if(typeIds.length){
      const { data: vragen } = await supabaseClient.from('keuring_checklist_vragen').select('arbeidsmiddel_type_id').in('arbeidsmiddel_type_id', typeIds);
      (vragen||[]).forEach(v => { aantalVragen[v.arbeidsmiddel_type_id] = (aantalVragen[v.arbeidsmiddel_type_id]||0) + 1; });
    }
    const rows = (typen||[]).map(t => `
      <div class="card">
        <div class="row">
          <input type="text" id="typeNaam-${t.id}" value="${t.naam}" style="flex:1; margin-right:8px" onclick="event.stopPropagation()">
          <button class="ghost" onclick="hernoemArbeidsmiddelType('${t.id}')">Opslaan</button>
        </div>
        <div class="row" style="margin-top:8px">
          <span class="meta klikbaar" onclick="openChecklistType('${t.id}')" style="cursor:pointer">${aantalVragen[t.id] || 0} vragen bekijken →</span>
          <button class="ghost" onclick="verwijderArbeidsmiddelType('${t.id}')">Verwijderen</button>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen typen binnen deze categorie.</div>';
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="tabActief='checklists'; scherm='lijst'; render();">← Terug naar checklists</button>
      <div class="eyebrow" style="margin-top:0">Typen — ${categorie ? categorie.naam : ''}</div>
      ${rows}
      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Nieuw type binnen deze categorie</label>
        <input type="text" id="atNieuwType" placeholder="Bijv. 'Boormachine', 'Ladder (enkel)', 'Trap'">
        <button class="ghost" style="margin-top:10px" onclick="voegArbeidsmiddelTypeToe()">+ Toevoegen</button>
      </div>
    `;
  }

  async function voegArbeidsmiddelTypeToe(){
    const naam = document.getElementById('atNieuwType').value.trim();
    if(!naam) return;
    const { error } = await supabaseClient.from('arbeidsmiddel_typen').insert({ organisatie_id: huidigProfiel.organisatie_id, keuringscategorie_id: checklistCategorieId, naam });
    if(error){ alert('Toevoegen mislukt: ' + error.message); return; }
    await render();
  }

  async function hernoemArbeidsmiddelType(id){
    const nieuweNaam = document.getElementById('typeNaam-' + id).value.trim();
    if(!nieuweNaam) return;
    const { data: oud } = await supabaseClient.from('arbeidsmiddel_typen').select('naam').eq('id', id).single();
    const { error } = await supabaseClient.from('arbeidsmiddel_typen').update({ naam: nieuweNaam }).eq('id', id);
    if(error){ alert('Hernoemen mislukt: ' + error.message); return; }
    if(oud && oud.naam !== nieuweNaam){
      await supabaseClient.from('arbeidsmiddelen').update({ type: nieuweNaam }).eq('type', oud.naam);
    }
    await render();
  }

  async function verwijderArbeidsmiddelType(id){
    if(!confirm('Dit type verwijderen? De bijbehorende checklist-vragen verdwijnen dan ook.')) return;
    const { error } = await supabaseClient.from('arbeidsmiddel_typen').delete().eq('id', id);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  async function openChecklistType(id){
    checklistTypeId = id;
    scherm = 'checklistType';
    await render();
  }

  async function renderChecklistType(){
    const { data: type } = await supabaseClient.from('arbeidsmiddel_typen').select('*').eq('id', checklistTypeId).single();
    const { data: vragen } = await supabaseClient.from('keuring_checklist_vragen').select('*').eq('arbeidsmiddel_type_id', checklistTypeId).order('volgorde');
    const rows = (vragen||[]).map((v,i) => `
      <div class="card row">
        <span>${i+1}. ${v.vraag} ${v.soort==='open' ? '<span class="tag" style="margin-left:6px">Open vraag</span>' : ''}</span>
        <div style="display:flex; gap:4px; flex-shrink:0">
          <button class="ghost" style="padding:6px 10px" onclick="verplaatsChecklistVraag('${v.id}', -1)" ${i===0?'disabled':''}>↑</button>
          <button class="ghost" style="padding:6px 10px" onclick="verplaatsChecklistVraag('${v.id}', 1)" ${i===(vragen||[]).length-1?'disabled':''}>↓</button>
          <button class="ghost" onclick="verwijderChecklistVraag('${v.id}')">Verwijderen</button>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen vragen voor dit type.</div>';
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="openChecklistCategorie('${type.keuringscategorie_id}')">← Terug naar typen</button>
      <div class="eyebrow" style="margin-top:0">Checklist — ${type ? type.naam : ''}</div>
      ${rows}
      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Nieuwe vraag/controlepunt (één tegelijk)</label>
        <input type="text" id="ccvNieuweVraag" placeholder="Bijv. 'Isolatieweerstand gemeten en binnen norm?'">
        <label>Soort</label>
        <select id="ccvSoort">
          <option value="ja_nee_nvt">Ja / Nee / N.v.t.</option>
          <option value="open">Open vraag (los antwoord, bijv. een aantal of merk)</option>
        </select>
        <button class="ghost" style="margin-top:10px" onclick="voegChecklistVraagToe()">+ Toevoegen</button>
      </div>
      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Meerdere tegelijk plakken (één controlepunt per regel)</label>
        <textarea id="ccvBulkVragen" rows="6" placeholder="Isolatieweerstand gemeten en binnen norm?
Aardlekschakelaar getest?
OPEN: Aantal treden/sporten
..."></textarea>
        <div class="meta" style="margin-top:4px">Zet <b>OPEN:</b> voor een regel om er een open vraag (los antwoord) van te maken, in plaats van Ja/Nee/N.v.t.</div>
        <button class="primary" style="margin-top:10px" onclick="voegBulkChecklistVragenToe()">+ Alle regels toevoegen</button>
        <div class="fout verborgen" id="ccvBulkFout"></div>
        <div class="melding verborgen" id="ccvBulkMelding"></div>
      </div>
    `;
  }

  async function voegChecklistVraagToe(){
    const vraag = document.getElementById('ccvNieuweVraag').value.trim();
    const soort = document.getElementById('ccvSoort').value;
    if(!vraag) return;
    const { data: bestaande } = await supabaseClient.from('keuring_checklist_vragen').select('volgorde').eq('arbeidsmiddel_type_id', checklistTypeId).order('volgorde', { ascending:false }).limit(1);
    const volgorde = bestaande && bestaande.length ? bestaande[0].volgorde + 1 : 1;
    const { error } = await supabaseClient.from('keuring_checklist_vragen').insert({ organisatie_id: huidigProfiel.organisatie_id, arbeidsmiddel_type_id: checklistTypeId, vraag, soort, volgorde });
    if(error){ alert('Toevoegen mislukt: ' + error.message); return; }
    await render();
  }

  async function voegBulkChecklistVragenToe(){
    const foutEl = document.getElementById('ccvBulkFout');
    const meldingEl = document.getElementById('ccvBulkMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');

    const regels = document.getElementById('ccvBulkVragen').value
      .split('\n').map(r => r.trim()).filter(r => r.length > 0);
    if(!regels.length){ foutEl.textContent = 'Plak eerst één of meer regels.'; foutEl.classList.remove('verborgen'); return; }

    const { data: bestaande } = await supabaseClient.from('keuring_checklist_vragen').select('volgorde').eq('arbeidsmiddel_type_id', checklistTypeId).order('volgorde', { ascending:false }).limit(1);
    let volgorde = bestaande && bestaande.length ? bestaande[0].volgorde : 0;

    const rijen = regels.map(regel => {
      volgorde++;
      const isOpen = /^open:\s*/i.test(regel);
      const vraag = isOpen ? regel.replace(/^open:\s*/i, '') : regel;
      return { organisatie_id: huidigProfiel.organisatie_id, arbeidsmiddel_type_id: checklistTypeId, vraag, soort: isOpen ? 'open' : 'ja_nee_nvt', volgorde };
    });

    const { error } = await supabaseClient.from('keuring_checklist_vragen').insert(rijen);
    if(error){ foutEl.textContent = 'Toevoegen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    document.getElementById('ccvBulkVragen').value = '';
    await render();
  }

  async function verwijderChecklistVraag(id){
    if(!confirm('Deze vraag verwijderen?')) return;
    const { error } = await supabaseClient.from('keuring_checklist_vragen').delete().eq('id', id);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  async function verplaatsChecklistVraag(id, richting){
    const { data: vragen } = await supabaseClient.from('keuring_checklist_vragen').select('*').eq('arbeidsmiddel_type_id', checklistTypeId).order('volgorde');
    if(!vragen) return;
    const index = vragen.findIndex(v => v.id === id);
    const nieuweIndex = index + richting;
    if(index === -1 || nieuweIndex < 0 || nieuweIndex >= vragen.length) return;
    const huidige = vragen[index];
    const buur = vragen[nieuweIndex];
    await supabaseClient.from('keuring_checklist_vragen').update({ volgorde: buur.volgorde }).eq('id', huidige.id);
    await supabaseClient.from('keuring_checklist_vragen').update({ volgorde: huidige.volgorde }).eq('id', buur.id);
    await render();
  }

  async function renderRegister(){
    const { data: middelen, error } = await supabaseClient.from('arbeidsmiddelen').select('*').order('uniek_id');
    if(error) return '<div class="fout">Kon register niet laden: ' + error.message + '</div>';
    const rows = (middelen||[]).map(m => `
      <div class="card klikbaar" onclick="openMiddel('${m.id}')">
        <div class="row">
          <div><b>${m.uniek_id}</b> <span class="meta">${m.type}</span></div>
          <span class="tag">${m.herkomst}</span>
        </div>
        <div class="meta" style="margin-top:6px">${m.categorie || ''}</div>
      </div>`).join('') || '<div class="meta">Nog geen arbeidsmiddelen geregistreerd.</div>';
    return `
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(middelen||[]).length} arbeidsmiddelen</span>
        <button class="primary" onclick="nieuwMiddel()">+ Nieuw arbeidsmiddel</button>
      </div>
      ${rows}
    `;
  }

  async function nieuwMiddel(){
    scherm = 'nieuw';
    await render();
  }

  async function renderNieuwMiddel(){
    const { data: categorieen } = await supabaseClient.from('keuringscategorieen').select('*').order('naam');
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar register</button>
      <div class="card">
        <label style="margin-top:0">Uniek ID</label>
        <input type="text" id="nmUniekId" placeholder="Het nummer dat op het middel staat">
        <label>Categorie</label>
        <select id="nmCategorie" onchange="ververTypeOpties('nm')">
          <option value="">— geen categorie —</option>
          ${(categorieen||[]).map(c => `<option value="${c.naam}" data-id="${c.id}">${c.naam}</option>`).join('')}
        </select>
        <label>Type</label>
        <select id="nmType" disabled onchange="typeGewijzigd('nm')">
          <option value="">— kies eerst een categorie —</option>
        </select>
        <div class="meta" id="nmTypeUitleg" style="margin-top:4px"></div>
        <label>Herkomst</label>
        <select id="nmHerkomst">
          <option value="eigen">Eigen</option>
          <option value="gehuurd">Gehuurd</option>
        </select>
        <div class="row" style="margin-top:16px">
          <span></span>
          <button class="primary" onclick="opslaanNieuwMiddel()">Aanmaken</button>
        </div>
        <div class="fout verborgen" id="nmFout"></div>
      </div>
    `;
  }

  async function ververTypeOpties(prefix, voorkeurWaarde){
    const catSelect = document.getElementById(prefix + 'Categorie');
    const optie = catSelect.options[catSelect.selectedIndex];
    const categorieId = optie ? optie.dataset.id : null;
    const typeSelect = document.getElementById(prefix + 'Type');
    const uitlegEl = document.getElementById(prefix + 'TypeUitleg');
    const huidigeWaarde = voorkeurWaarde !== undefined ? voorkeurWaarde : typeSelect.value;

    if(!categorieId){
      typeSelect.disabled = true;
      typeSelect.innerHTML = '<option value="">— kies eerst een categorie —</option>';
      if(uitlegEl) uitlegEl.textContent = '';
      return;
    }
    const { data: typen } = await supabaseClient.from('arbeidsmiddel_typen').select('naam').eq('keuringscategorie_id', categorieId).order('naam');
    typeSelect.disabled = false;
    typeSelect.innerHTML = '<option value="">— geen type —</option>' +
      (typen||[]).map(t => `<option value="${t.naam}" ${t.naam===huidigeWaarde?'selected':''}>${t.naam}</option>`).join('') +
      `<option value="__nieuw__">+ Nieuw type toevoegen…</option>`;
    if(uitlegEl) uitlegEl.textContent = (typen||[]).length ? 'Alleen een type uit deze lijst geeft toegang tot de bijbehorende checklist.' : 'Nog geen typen voor deze categorie — voeg er eerst een toe via Keuringen → Checklists, of kies hieronder "Nieuw type toevoegen".';
  }

  async function typeGewijzigd(prefix){
    const typeSelect = document.getElementById(prefix + 'Type');
    if(typeSelect.value !== '__nieuw__') return;
    const catSelect = document.getElementById(prefix + 'Categorie');
    const optie = catSelect.options[catSelect.selectedIndex];
    const categorieId = optie ? optie.dataset.id : null;
    const nieuweNaam = prompt('Naam van het nieuwe type:');
    if(!nieuweNaam || !nieuweNaam.trim()){ typeSelect.value = ''; return; }
    const { error } = await supabaseClient.from('arbeidsmiddel_typen').insert({ organisatie_id: huidigProfiel.organisatie_id, keuringscategorie_id: categorieId, naam: nieuweNaam.trim() });
    if(error){ alert('Toevoegen mislukt: ' + error.message); typeSelect.value = ''; return; }
    await ververTypeOpties(prefix);
    typeSelect.value = nieuweNaam.trim();
  }

  async function opslaanNieuwMiddel(){
    const uniek_id = document.getElementById('nmUniekId').value.trim();
    const type = document.getElementById('nmType').value.trim();
    const categorie = document.getElementById('nmCategorie').value || null;
    const herkomst = document.getElementById('nmHerkomst').value;
    const foutEl = document.getElementById('nmFout');
    foutEl.classList.add('verborgen');
    if(!uniek_id){ foutEl.textContent = 'Uniek ID is verplicht.'; foutEl.classList.remove('verborgen'); return; }

    const { data, error } = await supabaseClient
      .from('arbeidsmiddelen').insert({ organisatie_id: huidigProfiel.organisatie_id, uniek_id, type, categorie, herkomst }).select().single();
    if(error){ foutEl.textContent = 'Aanmaken mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    actiefId = data.id;
    scherm = 'middel';
    await render();
  }

  async function openMiddel(id){
    actiefId = id;
    scherm = 'middel';
    vastleggenModus = 'upload';
    await render();
    const { data: middel } = await supabaseClient.from('arbeidsmiddelen').select('type').eq('id', id).single();
    if(document.getElementById('bewCategorie')) await ververTypeOpties('bew', middel ? middel.type : '');
  }

  async function renderMiddel(){
    const { data: m, error } = await supabaseClient.from('arbeidsmiddelen').select('*').eq('id', actiefId).single();
    if(error) return '<div class="fout">Kon arbeidsmiddel niet laden: ' + error.message + '</div>';
    const { data: categorieen } = await supabaseClient.from('keuringscategorieen').select('*').order('naam');
    const { data: keuringen } = await supabaseClient
      .from('keuringen').select('*, profielen(voornaam, achternaam)').eq('arbeidsmiddel_id', actiefId).order('datum', { ascending:false });

    const keuringRows = (keuringen||[]).map(k => `
      <div class="card">
        <div class="row">
          <span class="tag" style="${k.resultaat==='goedgekeurd' ? 'background:var(--green-dim); color:var(--green);' : 'background:var(--red-dim); color:var(--red);'}">${k.resultaat}</span>
          <span class="meta">${new Date(k.datum).toLocaleDateString('nl-NL')}</span>
        </div>
        <div class="meta" style="margin-top:6px">Keurmeester: ${k.profielen ? k.profielen.voornaam + ' ' + k.profielen.achternaam : '—'}</div>
        ${k.reden ? `<div class="meta">Reden: ${k.reden}</div>` : ''}
        ${k.volgende_keuring ? `<div class="meta">Volgende keuring: ${new Date(k.volgende_keuring).toLocaleDateString('nl-NL')}</div>` : ''}
        <div class="row" style="margin-top:8px">
          ${k.rapport_pad ? `<button class="ghost" onclick="bekijkRapport('${k.rapport_pad}')">📄 Extern keuringsrapport bekijken</button>` : (k.checklist_antwoorden ? `<button class="ghost" onclick="printChecklistRapport('${k.id}')">📋 Intern keuringsrapport bekijken</button>` : `<span class="meta" style="color:var(--red)">Geen rapport gekoppeld</span>`)}
          <button class="ghost" onclick="verwijderKeuring('${k.id}')">Verwijderen</button>
        </div>
      </div>`).join('') || '<div class="meta">Nog geen keuringen vastgelegd.</div>';

    const catRij = m.categorie ? (categorieen||[]).find(c => c.naam === m.categorie) : null;
    let heeftGeldigeAanwijzing = false;
    if(catRij && huidigProfiel.rol === 'keurmeester'){
      const vandaag = new Date().toISOString().slice(0,10);
      const { data: geldigeAanwijzing } = await supabaseClient
        .from('aanwijzingen').select('id, geldig_tot').eq('profiel_id', huidigProfiel.id).eq('keuringscategorie_id', catRij.id);
      heeftGeldigeAanwijzing = (geldigeAanwijzing||[]).some(a => !a.geldig_tot || a.geldig_tot >= vandaag);
    }

    const magVastleggen = ['admin','kam'].includes(huidigProfiel.rol)
      || (huidigProfiel.rol === 'keurmeester' && heeftGeldigeAanwijzing);

    let magZelfRegistreren = false;
    let typeId = null;
    if(magVastleggen && catRij && m.type){
      const { data: typeRij } = await supabaseClient.from('arbeidsmiddel_typen').select('id').eq('keuringscategorie_id', catRij.id).eq('naam', m.type).maybeSingle();
      typeId = typeRij ? typeRij.id : null;
      if(typeId){
        const { data: checklistVragen } = await supabaseClient.from('keuring_checklist_vragen').select('id').eq('arbeidsmiddel_type_id', typeId).limit(1);
        const heeftChecklist = !!(checklistVragen && checklistVragen.length);
        if(heeftChecklist){
          magZelfRegistreren = ['admin','kam'].includes(huidigProfiel.rol) || heeftGeldigeAanwijzing;
        }
      }
    }

    const vastleggenBlok = magVastleggen ? `
      <div class="card">
        ${magZelfRegistreren ? `
          <div class="tabs" style="margin-bottom:14px">
            <div class="tab ${vastleggenModus==='upload'?'actief':''}" onclick="vastleggenModus='upload'; render();">Extern keuringsrapport</div>
            <div class="tab ${vastleggenModus==='checklist'?'actief':''}" onclick="vastleggenModus='checklist'; startZelfRegistreren('${typeId}'); render();">Intern keuringsrapport</div>
          </div>
        ` : ''}
        ${vastleggenModus === 'checklist' && magZelfRegistreren ? renderChecklistInvulBlok() : `
        <label style="margin-top:0">Resultaat</label>
        <select id="nkResultaat" onchange="toggleRedenVeld()">
          <option value="goedgekeurd">Goedgekeurd</option>
          <option value="afgekeurd">Afgekeurd</option>
        </select>
        <div id="nkRedenBlok" class="verborgen">
          <label>Reden van afkeuring</label>
          <input type="text" id="nkReden">
        </div>
        <label>Volgende keuring (datum)</label>
        <input type="date" id="nkVolgende">
        <label>Extern keuringsrapport (PDF, verplicht)</label>
        <input type="file" accept="application/pdf" id="nkRapport">
        <div class="row" style="margin-top:14px">
          <span></span>
          <button class="primary" onclick="legKeuringVast()">Vastleggen</button>
        </div>
        <div class="fout verborgen" id="nkFout"></div>
        `}
      </div>
    ` : `
      <div class="card">
        <div class="meta">Je hebt geen geldige aanwijzing om een keuring vast te leggen voor de categorie "${m.categorie || 'geen categorie'}". Laat admin/HR een aanwijzing voor deze categorie vastleggen via Personeel, of pas hieronder de categorie van dit arbeidsmiddel aan.</div>
      </div>
    `;

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar register</button>
      <div class="card">
        <label style="margin-top:0">Uniek ID</label>
        <input type="text" id="bewUniekId" value="${m.uniek_id}">
        <label>Categorie</label>
        <select id="bewCategorie" onchange="ververTypeOpties('bew')">
          <option value="">— geen categorie —</option>
          ${(categorieen||[]).map(c => `<option value="${c.naam}" data-id="${c.id}" ${m.categorie===c.naam?'selected':''}>${c.naam}</option>`).join('')}
        </select>
        <label>Type</label>
        <select id="bewType" disabled onchange="typeGewijzigd('bew')">
          <option value="">— kies eerst een categorie —</option>
        </select>
        <div class="meta" id="bewTypeUitleg" style="margin-top:4px"></div>
        <label>Herkomst</label>
        <select id="bewHerkomst">
          <option value="eigen" ${m.herkomst==='eigen'?'selected':''}>Eigen</option>
          <option value="gehuurd" ${m.herkomst==='gehuurd'?'selected':''}>Gehuurd</option>
        </select>
        <div class="row" style="margin-top:14px">
          <button class="ghost" onclick="verwijderMiddel()">Arbeidsmiddel verwijderen</button>
          <button class="primary" onclick="opslaanMiddel()">Opslaan</button>
        </div>
        <button class="ghost" style="width:100%; margin-top:10px" onclick="printMiddelQr('${m.uniek_id.replace(/'/g,"\\'")}')">🖨️ Print QR-sticker (label)</button>
        <div class="fout verborgen" id="bewMiddelFout"></div>
        <div class="melding verborgen" id="bewMiddelMelding"></div>
      </div>

      <div class="eyebrow" style="margin-top:20px">Nieuwe keuring vastleggen</div>
      ${vastleggenBlok}

      <div class="eyebrow" style="margin-top:20px">Geschiedenis</div>
      ${keuringRows}
    `;
  }

  async function opslaanMiddel(){
    const uniek_id = document.getElementById('bewUniekId').value.trim();
    const type = document.getElementById('bewType').value.trim();
    const categorie = document.getElementById('bewCategorie').value || null;
    const herkomst = document.getElementById('bewHerkomst').value;
    const foutEl = document.getElementById('bewMiddelFout');
    const meldingEl = document.getElementById('bewMiddelMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    const { error } = await supabaseClient.from('arbeidsmiddelen').update({ uniek_id, type, categorie, herkomst }).eq('id', actiefId);
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    meldingEl.textContent = '✓ Opgeslagen.'; meldingEl.classList.remove('verborgen');
    await render();
  }

  async function verwijderMiddel(){
    if(!confirm('Dit arbeidsmiddel, inclusief de volledige keuringsgeschiedenis, definitief verwijderen? Dit wordt vastgelegd in de audittrail.')) return;
    const { error } = await supabaseClient.from('arbeidsmiddelen').delete().eq('id', actiefId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    actiefId = null; scherm = 'lijst'; await render();
  }

  async function printMiddelQr(uniekId){
    const APP_URL = "https://mijn.appvoorveiligheid.nl";
    const zoekUrl = `${APP_URL}/qhse-keuringen.html?zoek=${encodeURIComponent(uniekId)}`;
    const { data: org } = await supabaseClient.from('organisaties').select('qr_logo_pad, qr_logo_keuring').eq('id', huidigProfiel.organisatie_id).single();
    let logoUrl = null;
    if(org && org.qr_logo_keuring && org.qr_logo_pad){
      logoUrl = supabaseClient.storage.from('organisatie-qr-logos').getPublicUrl(org.qr_logo_pad).data.publicUrl;
    }
    const qrOpties = {
      width: 200, height: 200, data: zoekUrl,
      dotsOptions: { color: '#1c1d1b' },
      qrOptions: { errorCorrectionLevel: 'H' }
    };
    if(logoUrl){
      qrOpties.image = logoUrl;
      qrOpties.imageOptions = { crossOrigin: 'anonymous', margin: 4, imageSize: 0.16 };
    }
    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>Keuring QR — ${uniekId}</title>
      <style>
        @page{ margin:2mm; }
        body{ font-family: Arial, sans-serif; margin:0; padding:6px; text-align:center; width:fit-content; }
        h2{ font-size:13px; margin:0 0 4px; font-family:monospace; letter-spacing:.02em; }
        #qr{ width:90px; height:90px; margin:0 auto; }
      </style></head><body>
        <div id="qr"></div>
        <h2>${uniekId}</h2>
        <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"><\/script>
        <script>
          new QRCodeStyling(${JSON.stringify(qrOpties)}).append(document.getElementById('qr'));
          setTimeout(() => window.print(), 400);
        <\/script>
      </body></html>
    `);
    venster.document.close();
  }

  async function verwijderKeuring(keuringId){
    if(!confirm('Deze keuring definitief verwijderen? Dit wordt vastgelegd in de audittrail.')) return;
    const { error } = await supabaseClient.from('keuringen').delete().eq('id', keuringId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  function toggleRedenVeld(){
    const resultaat = document.getElementById('nkResultaat').value;
    document.getElementById('nkRedenBlok').classList.toggle('verborgen', resultaat !== 'afgekeurd');
  }

  async function legKeuringVast(){
    const resultaat = document.getElementById('nkResultaat').value;
    const redenEl = document.getElementById('nkReden');
    const reden = redenEl ? redenEl.value.trim() : null;
    const volgende_keuring = document.getElementById('nkVolgende').value || null;
    const rapportInput = document.getElementById('nkRapport');
    const foutEl = document.getElementById('nkFout');
    foutEl.classList.add('verborgen');

    if(!rapportInput.files[0]){ foutEl.textContent = 'Een keuringsrapport (PDF) is verplicht.'; foutEl.classList.remove('verborgen'); return; }
    if(resultaat === 'afgekeurd' && !reden){ foutEl.textContent = 'Geef een reden op bij afkeuring.'; foutEl.classList.remove('verborgen'); return; }

    const file = rapportInput.files[0];
    const pad = `${huidigProfiel.organisatie_id}/${actiefId}-${Date.now()}.pdf`;
    const { error: uploadFout } = await supabaseClient.storage.from('keuringen-rapporten').upload(pad, file);
    if(uploadFout){ foutEl.textContent = 'Rapport uploaden mislukt: ' + uploadFout.message; foutEl.classList.remove('verborgen'); return; }

    const { error } = await supabaseClient.from('keuringen').insert({
      arbeidsmiddel_id: actiefId, keurmeester_id: huidigProfiel.id, resultaat, reden: reden || null, volgende_keuring, rapport_pad: pad
    });
    if(error){ foutEl.textContent = 'Vastleggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }

    await render();
  }

  async function bekijkRapport(pad){
    const { data, error } = await supabaseClient.storage.from('keuringen-rapporten').createSignedUrl(pad, 300);
    if(error){ alert('Kon rapport niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function startZelfRegistreren(typeId){
    const { data: vragen } = await supabaseClient.from('keuring_checklist_vragen').select('*').eq('arbeidsmiddel_type_id', typeId).order('volgorde');
    zelfRegistrerenAntwoorden = (vragen||[]).map(v => ({
      vraag_id: v.id, vraag: v.vraag, soort: v.soort || 'ja_nee_nvt',
      antwoord: v.soort === 'open' ? '' : 'ja', opmerking: ''
    }));
  }

  function renderChecklistInvulBlok(){
    const vraagRows = zelfRegistrerenAntwoorden.map((a,i) => a.soort === 'open' ? `
      <div class="card" style="margin-bottom:8px">
        <div style="font-size:13px">${a.vraag}</div>
        <input type="text" placeholder="Antwoord" value="${a.antwoord||''}" oninput="zelfRegistrerenAntwoorden[${i}].antwoord=this.value" style="margin-top:8px">
      </div>
    ` : `
      <div class="card" style="margin-bottom:8px">
        <div style="font-size:13px">${a.vraag}</div>
        <div class="tabs" style="margin-top:8px">
          <div class="tab ${a.antwoord==='ja'?'actief':''}" onclick="zelfRegistrerenAntwoorden[${i}].antwoord='ja'; render();">✓ Ja</div>
          <div class="tab ${a.antwoord==='nee'?'actief':''}" onclick="zelfRegistrerenAntwoorden[${i}].antwoord='nee'; render();">✗ Nee</div>
          <div class="tab ${a.antwoord==='nvt'?'actief':''}" onclick="zelfRegistrerenAntwoorden[${i}].antwoord='nvt'; render();">— N.v.t.</div>
        </div>
        <input type="text" placeholder="Opmerking (optioneel)" value="${a.opmerking||''}" oninput="zelfRegistrerenAntwoorden[${i}].opmerking=this.value" style="margin-top:8px">
      </div>
    `).join('');

    return `
      <div class="eyebrow" style="margin-top:0">Checklist (${zelfRegistrerenAntwoorden.length} punten)</div>
      ${vraagRows}
      <label>Volgende keuring (datum)</label>
      <input type="date" id="crVolgende">
      <div class="row" style="margin-top:14px">
        <span></span>
        <button class="primary" onclick="legKeuringVastViaChecklist()">Vastleggen</button>
      </div>
      <div class="fout verborgen" id="crFout"></div>
    `;
  }

  async function legKeuringVastViaChecklist(){
    const volgende_keuring = document.getElementById('crVolgende').value || null;
    const foutEl = document.getElementById('crFout');
    foutEl.classList.add('verborgen');

    const afwijkingen = zelfRegistrerenAntwoorden.filter(a => a.antwoord === 'nee');
    const resultaat = afwijkingen.length ? 'afgekeurd' : 'goedgekeurd';
    const reden = afwijkingen.length ? afwijkingen.map(a => a.vraag + (a.opmerking ? ' — ' + a.opmerking : '')).join('; ') : null;

    const { error } = await supabaseClient.from('keuringen').insert({
      arbeidsmiddel_id: actiefId, keurmeester_id: huidigProfiel.id, resultaat, reden, volgende_keuring,
      checklist_antwoorden: zelfRegistrerenAntwoorden
    });
    if(error){ foutEl.textContent = 'Vastleggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }

    vastleggenModus = 'upload';
    zelfRegistrerenAntwoorden = [];
    await render();
  }

  async function printChecklistRapport(keuringId){
    const { data: k, error } = await supabaseClient.from('keuringen').select('*, profielen(voornaam, achternaam)').eq('id', keuringId).single();
    if(error){ alert('Kon keuring niet laden: ' + error.message); return; }
    const { data: m } = await supabaseClient.from('arbeidsmiddelen').select('*').eq('id', k.arbeidsmiddel_id).single();

    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>Intern keuringsrapport — ${m.uniek_id}</title>
      <style>
        body{ font-family: Arial, sans-serif; padding:30px; color:#1c1d1b; }
        h1{ font-size:20px; border-bottom:3px solid #2f6f5e; padding-bottom:8px; }
        table{ border-collapse:collapse; margin-top:6px; width:100%; }
        td{ padding:5px 10px 5px 0; font-size:12px; vertical-align:top; border-bottom:1px solid #eee; }
        .ja{ color:#1c9468; font-weight:600; }
        .nee{ color:#c0392b; font-weight:600; }
        .nvt{ color:#999; font-weight:600; }
      </style></head><body>
        <h1>Intern keuringsrapport — ${m.uniek_id} (${m.type || ''})</h1>
        <table>
          <tr><td><b>Categorie</b></td><td>${m.categorie || '—'}</td></tr>
          <tr><td><b>Datum</b></td><td>${new Date(k.datum).toLocaleDateString('nl-NL')}</td></tr>
          <tr><td><b>Keurmeester</b></td><td>${k.profielen ? k.profielen.voornaam + ' ' + k.profielen.achternaam : '—'}</td></tr>
          <tr><td><b>Resultaat</b></td><td>${k.resultaat}</td></tr>
          ${k.volgende_keuring ? `<tr><td><b>Volgende keuring</b></td><td>${new Date(k.volgende_keuring).toLocaleDateString('nl-NL')}</td></tr>` : ''}
        </table>
        <h2 style="font-size:14px; margin-top:20px;">Checklist</h2>
        <table>
          ${(k.checklist_antwoorden||[]).map(a => a.soort === 'open'
            ? `<tr><td>${a.vraag}</td><td colspan="2">${a.antwoord || '—'}</td></tr>`
            : `<tr><td>${a.vraag}</td><td class="${a.antwoord}">${a.antwoord==='ja'?'✓ Ja':(a.antwoord==='nee'?'✗ Nee':'— N.v.t.')}</td><td>${a.opmerking||''}</td></tr>`
          ).join('')}
        </table>
        <p style="margin-top:30px; font-size:10px; color:#999;">Digitaal keuringsformulier, gegenereerd op ${new Date().toLocaleDateString('nl-NL')}.</p>
        <script>window.print();<\/script>
      </body></html>
    `);
    venster.document.close();
  }

  async function renderOnbekend(){
    const { data: aanvragen, error } = await supabaseClient
      .from('arbeidsmiddel_aanvragen').select('*, profielen(voornaam, achternaam)')
      .eq('status', 'nieuw').order('aangemaakt_op', { ascending:false });
    if(error) return '<div class="fout">Kon aanvragen niet laden: ' + error.message + '</div>';
    const rows = (aanvragen||[]).map(a => `
      <div class="card klikbaar" onclick="openAanvraagDetail('${a.id}')">
        <div class="row">
          <b>${a.uniek_id}</b>
          <span class="meta">${new Date(a.aangemaakt_op).toLocaleString('nl-NL')}</span>
        </div>
        <div class="meta" style="margin-top:6px">Aangevraagd door ${a.profielen ? a.profielen.voornaam + ' ' + a.profielen.achternaam : '—'}</div>
      </div>`).join('') || '<div class="meta">Geen openstaande aanvragen.</div>';
    return rows;
  }

  async function openAanvraagDetail(id){
    actiefAanvraagId = id;
    scherm = 'aanvraagDetail';
    await render();
  }

  async function renderAanvraagDetail(){
    const { data: a, error } = await supabaseClient
      .from('arbeidsmiddel_aanvragen').select('*, profielen(voornaam, achternaam)').eq('id', actiefAanvraagId).single();
    if(error) return '<div class="fout">Kon aanvraag niet laden: ' + error.message + '</div>';
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <b>${a.uniek_id}</b>
        <div class="meta" style="margin-top:4px">Aangevraagd door ${a.profielen ? a.profielen.voornaam + ' ' + a.profielen.achternaam : '—'} · ${new Date(a.aangemaakt_op).toLocaleString('nl-NL')}</div>
        <div style="font-size:13.5px; margin-top:14px; line-height:1.7">
          <b>Eigendom:</b> ${a.eigendom === 'gehuurd' ? 'Gehuurd' + (a.verhuurder ? ' via ' + a.verhuurder : '') : 'Eigen materieel'}<br>
          <b>Merk:</b> ${a.merk || '—'}<br>
          <b>Type:</b> ${a.type || '—'}<br>
          <b>Keuringssticker:</b> ${a.keuringssticker_aanwezig ? 'Aanwezig' + (a.keuringssticker_datum ? ' (' + new Date(a.keuringssticker_datum).toLocaleDateString('nl-NL') + ')' : '') : 'Niet aanwezig'}
        </div>
        <div class="row" style="margin-top:14px; gap:8px">
          ${a.foto_arbeidsmiddel_pad ? `<button class="ghost" onclick="bekijkAanvraagFoto('${a.foto_arbeidsmiddel_pad}')">📷 Foto arbeidsmiddel</button>` : ''}
          ${a.foto_uniek_nummer_pad ? `<button class="ghost" onclick="bekijkAanvraagFoto('${a.foto_uniek_nummer_pad}')">📷 Foto uniek nummer</button>` : ''}
        </div>
        <div class="row" style="margin-top:18px">
          <button class="ghost" onclick="verwerkAanvraag('${a.id}')">Afwijzen / markeer afgehandeld</button>
          <button class="primary" onclick="voegToeVanuitAanvraag('${a.id}','${a.uniek_id}','${(a.merk||'').replace(/'/g,"\\'")}','${(a.type||'').replace(/'/g,"\\'")}')">+ Toevoegen aan register</button>
        </div>
      </div>
    `;
  }

  async function bekijkAanvraagFoto(pad){
    const { data, error } = await supabaseClient.storage.from('keuringen-aanvragen').createSignedUrl(pad, 300);
    if(error){ alert('Kon foto niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function voegToeVanuitAanvraag(aanvraagId, uniekId, merk, type){
    const { error } = await supabaseClient.from('arbeidsmiddelen').insert({
      organisatie_id: huidigProfiel.organisatie_id, uniek_id: uniekId, type: type || merk || 'Onbekend type'
    });
    if(error){ alert('Toevoegen mislukt: ' + error.message); return; }
    const afhandel_notitie = prompt('Notitie voor de audittrail (optioneel):');
    await supabaseClient.from('arbeidsmiddel_aanvragen').update({ status: 'afgehandeld', afhandel_notitie: afhandel_notitie || null }).eq('id', aanvraagId);
    scherm = 'lijst';
    await render();
  }

  async function verwerkAanvraag(id){
    const afhandel_notitie = prompt('Notitie voor de audittrail (optioneel) — bijv. reden van afwijzing:');
    const { error } = await supabaseClient.from('arbeidsmiddel_aanvragen').update({ status: 'afgehandeld', afhandel_notitie: afhandel_notitie || null }).eq('id', id);
    if(error){ alert('Mislukt: ' + error.message); return; }
    scherm = 'lijst';
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
