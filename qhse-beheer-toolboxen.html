<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Beheer Toolboxen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim: color-mix(in srgb, var(--accent) 10%, transparent); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs{ display:flex; gap:8px; }
  .tab{ padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  input, select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .card.klikbaar{ cursor:pointer; }
  .card.klikbaar:hover{ border-color:var(--accent); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .tag.verplicht{ background:var(--amber-dim); color:var(--amber); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .chip{ display:inline-block; padding:6px 12px; border:1px solid var(--border); border-radius:20px; font-size:12.5px; cursor:pointer; margin:3px 4px 0 0; }
  .chip.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit beheerscherm is alleen voor Admin of KAM.</p>
    <button class="ghost btn-uitloggen-lokaal" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Toolboxen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost btn-uitloggen-lokaal" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  // Binnen de schil geopend? Dan hoort uitloggen via de schil zelf te gaan,
  // niet via deze losse knop (die anders alleen dit venster resette, terwijl
  // de schil eromheen nergens van wist).
  if(window.self !== window.top){
    const verbergUitlogKnoppenLokaal = () => {
      document.querySelectorAll('.btn-uitloggen-lokaal').forEach(b => b.style.display = 'none');
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', verbergUitlogKnoppenLokaal);
    } else {
      verbergUitlogKnoppenLokaal();
    }
  }

  let huidigProfiel = null;
  let scherm = 'lijst';
  let actiefId = null;

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    supabaseClient.from('organisaties').select('accentkleur').eq('id', profiel.organisatie_id).single()
      .then(({ data: kleurOrg }) => { if(kleurOrg && kleurOrg.accentkleur){ document.documentElement.style.setProperty('--accent', kleurOrg.accentkleur); } });
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    scherm = 'lijst';
    await render();
  }

  let hoofdScherm = 'bibliotheek'; // 'bibliotheek' | 'sessies'

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(hoofdScherm === 'sessies'){
      if(scherm === 'sessieDetail') inhoud.innerHTML = await renderSessieDetail();
      else if(scherm === 'controlevragenBeheer') inhoud.innerHTML = await renderControlevragenBeheer();
      else if(scherm === 'controleResultaten') inhoud.innerHTML = await renderControleResultaten();
      else inhoud.innerHTML = await renderSessiesLijst();
      return;
    }
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'bewerken') inhoud.innerHTML = await renderBewerken();
    else if(scherm === 'controlevragenBeheer') inhoud.innerHTML = await renderControlevragenBeheer();
  }

  function kiesHoofdScherm(keuze){
    hoofdScherm = keuze;
    scherm = keuze === 'sessies' ? 'sessiesLijst' : 'lijst';
    render();
  }

  function renderHoofdTabs(){
    return `
      <div class="tabs" style="margin-bottom:16px">
        <div class="tab ${hoofdScherm==='bibliotheek'?'actief':''}" onclick="kiesHoofdScherm('bibliotheek')">Bibliotheek</div>
        <div class="tab ${hoofdScherm==='sessies'?'actief':''}" onclick="kiesHoofdScherm('sessies')">Sessies &amp; controlevragen</div>
      </div>
    `;
  }

  async function renderLijst(){
    const { data: bibliotheek, error } = await supabaseClient
      .from('toolbox_bibliotheek').select('*, groepen(naam)').order('naam');
    if(error) return '<div class="fout">Kon bibliotheek niet laden: ' + error.message + '</div>';
    const rows = (bibliotheek||[]).map(t => `
      <div class="card klikbaar" onclick="openBewerken('${t.id}')">
        <div class="row">
          <div>
            <b>${t.naam}</b>
            ${t.verplicht ? '<span class="tag verplicht" style="margin-left:8px">Verplicht</span>' : ''}
          </div>
          <span class="meta">${t.koppeling_type === 'iedereen' ? 'Iedereen' : (t.groepen ? t.groepen.naam : 'Groep')}</span>
        </div>
        <div class="meta" style="margin-top:6px">${t.pdf_pad ? '📄 Materiaal gekoppeld' : 'Nog geen materiaal'}</div>
      </div>`).join('') || '<div class="meta">Nog geen toolboxen.</div>';
    return `
      ${renderHoofdTabs()}
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(bibliotheek||[]).length} toolboxen</span>
        <button class="primary" onclick="nieuweToolbox()">+ Nieuwe toolbox</button>
      </div>
      ${rows}
    `;
  }

  async function nieuweToolbox(){
    const { data, error } = await supabaseClient
      .from('toolbox_bibliotheek')
      .insert({ organisatie_id: huidigProfiel.organisatie_id, naam: 'Nieuwe toolbox', verplicht: true, koppeling_type: 'iedereen' })
      .select().single();
    if(error){ alert('Aanmaken mislukt: ' + error.message); return; }
    actiefId = data.id;
    scherm = 'bewerken';
    await render();
  }

  async function openBewerken(id){
    actiefId = id;
    scherm = 'bewerken';
    await render();
  }

  let bewGroepenCache = [];

  async function renderBewerken(){
    const { data: t, error } = await supabaseClient.from('toolbox_bibliotheek').select('*').eq('id', actiefId).single();
    if(error) return '<div class="fout">Kon toolbox niet laden: ' + error.message + '</div>';
    const { data: groepen } = await supabaseClient.from('groepen').select('*').order('naam');
    bewGroepenCache = groepen || [];
    const { data: gekoppeldePersonen } = await supabaseClient.from('toolbox_bibliotheek_personen').select('profiel_id').eq('bibliotheek_id', actiefId);
    const gekoppeldeIds = new Set((gekoppeldePersonen||[]).map(p=>p.profiel_id));
    let ledenHtml = '';
    if(t.koppeling_type === 'groep' && t.koppeling_groep_id){
      const { data: leden } = await supabaseClient
        .from('groep_leden').select('profielen(id, voornaam, achternaam)').eq('groep_id', t.koppeling_groep_id);
      ledenHtml = `
        <div class="meta" style="margin:10px 0 6px">Beperk optioneel tot specifieke personen binnen deze groep (niets aangevinkt = hele groep)</div>
        ${(leden||[]).map(l => l.profielen ? `
          <span class="chip ${gekoppeldeIds.has(l.profielen.id)?'actief':''}" onclick="togglePersoon('${l.profielen.id}')">${l.profielen.voornaam} ${l.profielen.achternaam}</span>
        ` : '').join('')}
      `;
    }
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Naam</label>
        <input type="text" id="bewNaam" value="${t.naam}">
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px">
          <input type="checkbox" id="bewVerplicht" style="width:auto" ${t.verplicht?'checked':''}> Verplicht
        </label>
        <label style="display:flex; align-items:center; gap:8px; margin-top:10px">
          <input type="checkbox" id="bewBevestiging" style="width:auto" ${t.vereist_bevestiging?'checked':''}> Ontvangers moeten ontvangst zelf bevestigen (via Mijn Acties)
        </label>
        <div class="meta" style="margin-top:4px">Staat dit aan, dan krijgt elke geregistreerde (interne) deelnemer een losse bevestigingstaak, bovenop de aanwezigheidsregistratie door de gever.</div>
        <button class="ghost" style="margin-top:14px" onclick="actiefId='${t.id}'; scherm='controlevragenBeheer'; render();">✏️ Controlevragen beheren</button>

        <label>Toegewezen aan</label>
        <select id="bewKoppelType" onchange="toggleKoppelType()">
          <option value="iedereen" ${t.koppeling_type==='iedereen'?'selected':''}>Iedereen</option>
          <option value="groep" ${t.koppeling_type==='groep'?'selected':''}>Specifieke groep</option>
        </select>
        <div id="koppelDetails" style="margin-top:10px">
          ${t.koppeling_type==='groep' ? `
            <select id="bewGroep" onchange="toonGroepLeden()">
              <option value="">— kies een groep —</option>
              ${bewGroepenCache.map(g => `<option value="${g.id}" ${t.koppeling_groep_id===g.id?'selected':''}>${g.naam}</option>`).join('')}
            </select>
            <div id="ledenBlok">${ledenHtml}</div>
          ` : ''}
        </div>

        <label>Materiaal (PDF)</label>
        <div class="row">
          <span class="meta" id="materiaalTekst">${t.pdf_pad ? '📄 Materiaal gekoppeld' : 'Nog geen materiaal'}</span>
          <label class="ghost" style="display:inline-block; padding:8px 13px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; margin:0;">
            <span id="materiaalKnopLabel">${t.pdf_pad ? 'Vervangen' : 'PDF toevoegen'}</span>
            <input type="file" accept="application/pdf" style="display:none" onchange="uploadMateriaal(this)">
          </label>
        </div>
        <div class="meta" id="materiaalStatus" style="margin-top:6px"></div>

        <div class="row" style="margin-top:18px">
          <button class="ghost" onclick="verwijderToolbox()">Verwijderen</button>
          <button class="primary" onclick="opslaan()">Opslaan</button>
        </div>
        <div class="fout verborgen" id="bewFout"></div>
        <div class="melding verborgen" id="bewMelding"></div>
      </div>
    `;
  }

  function toggleKoppelType(){
    const type = document.getElementById('bewKoppelType').value;
    const detailsEl = document.getElementById('koppelDetails');
    if(type === 'groep'){
      detailsEl.innerHTML = `
        <select id="bewGroep" onchange="toonGroepLeden()">
          <option value="">— kies een groep —</option>
          ${bewGroepenCache.map(g => `<option value="${g.id}">${g.naam}</option>`).join('')}
        </select>
        <div id="ledenBlok"></div>
      `;
    } else {
      detailsEl.innerHTML = '';
    }
  }

  async function toonGroepLeden(){
    const groepId = document.getElementById('bewGroep').value;
    const ledenBlok = document.getElementById('ledenBlok');
    if(!groepId){ ledenBlok.innerHTML = ''; return; }
    const { data: gekoppeldePersonen } = await supabaseClient.from('toolbox_bibliotheek_personen').select('profiel_id').eq('bibliotheek_id', actiefId);
    const gekoppeldeIds = new Set((gekoppeldePersonen||[]).map(p=>p.profiel_id));
    const { data: leden } = await supabaseClient.from('groep_leden').select('profielen(id, voornaam, achternaam)').eq('groep_id', groepId);
    ledenBlok.innerHTML = `
      <div class="meta" style="margin:10px 0 6px">Beperk optioneel tot specifieke personen binnen deze groep (niets aangevinkt = hele groep)</div>
      ${(leden||[]).map(l => l.profielen ? `<span class="chip ${gekoppeldeIds.has(l.profielen.id)?'actief':''}" onclick="togglePersoon('${l.profielen.id}')">${l.profielen.voornaam} ${l.profielen.achternaam}</span>` : '').join('')}
    `;
  }

  function togglePersoon(profielId){
    const chip = event.target;
    const actief = chip.classList.contains('actief');
    const bewerking = actief
      ? supabaseClient.from('toolbox_bibliotheek_personen').delete().eq('bibliotheek_id', actiefId).eq('profiel_id', profielId)
      : supabaseClient.from('toolbox_bibliotheek_personen').insert({ bibliotheek_id: actiefId, profiel_id: profielId });
    bewerking.then(() => toonGroepLeden());
  }

  async function opslaan(){
    const naam = document.getElementById('bewNaam').value.trim();
    const verplicht = document.getElementById('bewVerplicht').checked;
    const vereist_bevestiging = document.getElementById('bewBevestiging').checked;
    const koppeling_type = document.getElementById('bewKoppelType').value;
    const koppeling_groep_id = koppeling_type === 'groep' ? (document.getElementById('bewGroep').value || null) : null;
    const foutEl = document.getElementById('bewFout');
    const meldingEl = document.getElementById('bewMelding');
    foutEl.classList.add('verborgen');
    meldingEl.classList.add('verborgen');

    const { error } = await supabaseClient.from('toolbox_bibliotheek')
      .update({ naam, verplicht, vereist_bevestiging, koppeling_type, koppeling_groep_id }).eq('id', actiefId);
    if(error){
      foutEl.textContent = 'Opslaan mislukt: ' + error.message;
      foutEl.classList.remove('verborgen');
      return;
    }
    meldingEl.textContent = '✓ Opgeslagen.';
    meldingEl.classList.remove('verborgen');
    await render();
  }

  async function verwijderToolbox(){
    if(!confirm('Deze toolbox definitief verwijderen?')) return;
    const { error } = await supabaseClient.from('toolbox_bibliotheek').delete().eq('id', actiefId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    actiefId = null;
    scherm = 'lijst';
    await render();
  }

  async function uploadMateriaal(inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    const statusEl = document.getElementById('materiaalStatus');
    statusEl.textContent = 'Uploaden…';
    const pad = `${huidigProfiel.organisatie_id}/${actiefId}-${Date.now()}.pdf`;
    const { error: uploadFout } = await supabaseClient.storage.from('toolbox-materiaal').upload(pad, file);
    if(uploadFout){ statusEl.textContent = 'Upload mislukt: ' + uploadFout.message; return; }
    const { error: updateFout } = await supabaseClient.from('toolbox_bibliotheek').update({ pdf_pad: pad }).eq('id', actiefId);
    if(updateFout){ statusEl.textContent = 'Koppelen mislukt: ' + updateFout.message; return; }
    statusEl.textContent = '✓ Geüpload.';
    document.getElementById('materiaalTekst').textContent = '📄 Materiaal gekoppeld';
    document.getElementById('materiaalKnopLabel').textContent = 'Vervangen';
  }

  // ==================== Controlevragen beheren ====================
  async function renderControlevragenBeheer(){
    const { data: toolbox } = await supabaseClient.from('toolbox_bibliotheek').select('naam').eq('id', actiefId).single();
    const { data: vragen } = await supabaseClient.from('toolbox_controlevragen').select('*').eq('toolbox_id', actiefId).order('volgorde');
    const rows = (vragen||[]).map((v,i) => `
      <div class="card row">
        <span>${i+1}. ${v.vraag} ${v.type === 'open' ? '<span class="meta">(open vraag)</span>' : `<span class="meta">(juist: ${v.juist_antwoord})</span>`}</span>
        <button class="ghost" onclick="verwijderControlevraag('${v.id}')">Verwijderen</button>
      </div>`).join('') || '<div class="meta">Nog geen controlevragen voor deze toolbox.</div>';

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="hoofdScherm='bibliotheek'; scherm='bewerken'; render();">← Terug naar toolbox</button>
      <div class="eyebrow" style="margin-top:0">Controlevragen — ${toolbox ? toolbox.naam : ''}</div>
      <div class="meta" style="margin-bottom:16px">Combineer gerust een paar korte begripsvragen met open vragen om ervaring en verbeterpunten op te halen — zo voelt het als betrokkenheid, niet als een toets.</div>
      ${rows}
      <div class="card" style="margin-top:12px">
        <label style="margin-top:0">Type vraag</label>
        <select id="cvType" onchange="toggleCvJuistAntwoord()">
          <option value="ja/nee">Ja/Nee (begripsvraag)</option>
          <option value="open">Open vraag (ervaring / verbeterpunt)</option>
        </select>
        <label style="margin-top:0">Nieuwe vraag</label>
        <input type="text" id="cvVraag" placeholder="Bijv. 'Moet je bij deze werkzaamheden een veiligheidsbril dragen?' of 'Wat zou je aan deze toolbox willen verbeteren?'">
        <div id="cvJuistAntwoordBlok">
          <label>Juist antwoord</label>
          <select id="cvJuistAntwoord">
            <option value="ja">Ja</option>
            <option value="nee">Nee</option>
          </select>
        </div>
        <button class="ghost" style="margin-top:10px" onclick="voegControlevraagToe()">+ Toevoegen</button>
      </div>
    `;
  }

  function toggleCvJuistAntwoord(){
    document.getElementById('cvJuistAntwoordBlok').style.display = document.getElementById('cvType').value === 'open' ? 'none' : 'block';
  }

  async function voegControlevraagToe(){
    const vraag = document.getElementById('cvVraag').value.trim();
    const type = document.getElementById('cvType').value;
    const juist_antwoord = type === 'open' ? null : document.getElementById('cvJuistAntwoord').value;
    if(!vraag) return;
    const { data: bestaande } = await supabaseClient.from('toolbox_controlevragen').select('volgorde').eq('toolbox_id', actiefId).order('volgorde', { ascending:false }).limit(1);
    const volgorde = bestaande && bestaande.length ? bestaande[0].volgorde + 1 : 1;
    const { error } = await supabaseClient.from('toolbox_controlevragen').insert({
      organisatie_id: huidigProfiel.organisatie_id, toolbox_id: actiefId, vraag, type, juist_antwoord, volgorde
    });
    if(error){ alert('Toevoegen mislukt: ' + error.message); return; }
    await render();
  }

  async function verwijderControlevraag(id){
    if(!confirm('Deze controlevraag verwijderen?')) return;
    const { error } = await supabaseClient.from('toolbox_controlevragen').delete().eq('id', id);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  // ==================== Sessies & versturen ====================
  let actieveSessieId = null;

  async function renderSessiesLijst(){
    const datumVan = (document.getElementById('sessiesDatumVan') || {}).value || '';
    const datumTot = (document.getElementById('sessiesDatumTot') || {}).value || '';
    let query = supabaseClient
      .from('toolbox_sessies').select('*, toolbox_bibliotheek(naam), profielen(voornaam, achternaam)').order('datum', { ascending:false }).limit(50);
    if(datumVan) query = query.gte('datum', datumVan);
    if(datumTot) query = query.lte('datum', datumTot + 'T23:59:59');
    const { data: sessies, error } = await query;
    if(error) return renderHoofdTabs() + '<div class="fout">Kon sessies niet laden: ' + error.message + '</div>';
    const rows = (sessies||[]).map(s => `
      <div class="card klikbaar" onclick="actieveSessieId='${s.id}'; scherm='sessieDetail'; render();">
        <div class="row">
          <b>${s.toolbox_bibliotheek ? s.toolbox_bibliotheek.naam : '—'}</b>
          <span class="meta">${new Date(s.datum).toLocaleDateString('nl-NL')}</span>
        </div>
        <div class="meta" style="margin-top:4px">Gegeven door ${s.profielen ? s.profielen.voornaam + ' ' + s.profielen.achternaam : 'onbekend'}</div>
      </div>`).join('') || '<div class="meta">Geen sessies gevonden.</div>';
    return `
      ${renderHoofdTabs()}
      <div class="row" style="gap:10px; margin-bottom:16px; align-items:flex-end;">
        <div style="flex:1">
          <label style="font-size:11.5px; font-weight:600; display:block; margin-bottom:4px">Van</label>
          <input type="date" id="sessiesDatumVan" value="${datumVan}" onchange="render()">
        </div>
        <div style="flex:1">
          <label style="font-size:11.5px; font-weight:600; display:block; margin-bottom:4px">Tot</label>
          <input type="date" id="sessiesDatumTot" value="${datumTot}" onchange="render()">
        </div>
        <button class="ghost" onclick="document.getElementById('sessiesDatumVan').value=''; document.getElementById('sessiesDatumTot').value=''; render();">Wissen</button>
      </div>
      <div class="meta" style="margin-bottom:16px">Laatste 50 toolbox-sessies. Open een sessie om controlevragen te versturen naar de deelnemers.</div>
      ${rows}
    `;
  }

  async function renderSessieDetail(){
    const { data: s } = await supabaseClient.from('toolbox_sessies').select('*, toolbox_bibliotheek(naam)').eq('id', actieveSessieId).single();
    const { data: deelnemers } = await supabaseClient.from('toolbox_deelnemers').select('*').eq('sessie_id', actieveSessieId);
    const interneDeelnemers = (deelnemers||[]).filter(d => d.profiel_id);
    const { data: vragen } = await supabaseClient.from('toolbox_controlevragen').select('id').eq('toolbox_id', s.toolbox_id);
    const { data: bestaandeControles } = await supabaseClient.from('toolbox_controles').select('*').eq('sessie_id', actieveSessieId).order('aangemaakt_op', { ascending:false });

    const controleRows = await Promise.all((bestaandeControles||[]).map(async (c) => {
      const { count: totaalCount } = await supabaseClient.from('toolbox_controle_ontvangers').select('*', { count:'exact', head:true }).eq('controle_id', c.id);
      const { count: beantwoordCount } = await supabaseClient.from('toolbox_controle_ontvangers').select('*', { count:'exact', head:true }).eq('controle_id', c.id).eq('beantwoord', true);
      return `
        <div class="card klikbaar" onclick="actieveControleId='${c.id}'; scherm='controleResultaten'; render();">
          <div class="row">
            <span>Verstuurd op ${new Date(c.aangemaakt_op).toLocaleDateString('nl-NL')}</span>
            <span class="meta">${beantwoordCount ?? 0} / ${totaalCount ?? 0} beantwoord</span>
          </div>
        </div>`;
    }));

    return `
      ${renderHoofdTabs()}
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='sessiesLijst'; render();">← Terug naar sessies</button>
      <div class="card">
        <b>${s.toolbox_bibliotheek ? s.toolbox_bibliotheek.naam : '—'}</b>
        <div class="meta" style="margin-top:6px">${new Date(s.datum).toLocaleDateString('nl-NL')} · ${interneDeelnemers.length} interne deelnemers</div>
        ${(vragen||[]).length === 0 ? `
          <div class="meta" style="margin-top:10px">Deze toolbox heeft nog geen controlevragen — voeg die eerst toe bij de toolbox zelf in de Bibliotheek.</div>
        ` : `
          <button class="primary" style="margin-top:10px" onclick="verstuurControlevragen('${s.toolbox_id}')">📨 Controlevragen versturen naar deze deelnemers</button>
        `}
      </div>
      <div class="eyebrow" style="margin-top:20px">Eerder verstuurd</div>
      ${controleRows.join('') || '<div class="meta">Nog niets verstuurd voor deze sessie.</div>'}
    `;
  }

  async function verstuurControlevragen(toolboxId){
    const { data: deelnemers } = await supabaseClient.from('toolbox_deelnemers').select('profiel_id').eq('sessie_id', actieveSessieId);
    const profielIds = (deelnemers||[]).map(d=>d.profiel_id).filter(Boolean);
    if(!profielIds.length){ alert('Geen interne deelnemers om naar te versturen.'); return; }
    const { data: controle, error } = await supabaseClient.from('toolbox_controles').insert({
      organisatie_id: huidigProfiel.organisatie_id, toolbox_id: toolboxId, sessie_id: actieveSessieId, aangemaakt_door: huidigProfiel.id
    }).select().single();
    if(error){ alert('Versturen mislukt: ' + error.message); return; }
    const ontvangerRijen = profielIds.map(pid => ({ organisatie_id: huidigProfiel.organisatie_id, controle_id: controle.id, profiel_id: pid }));
    const { error: ontvangersFout } = await supabaseClient.from('toolbox_controle_ontvangers').insert(ontvangerRijen);
    if(ontvangersFout){ alert('Ontvangers aanmaken mislukt: ' + ontvangersFout.message); return; }
    alert('Verstuurd naar ' + profielIds.length + ' deelnemer(s).');
    await render();
  }

  // ==================== Resultaten bekijken ====================
  let actieveControleId = null;

  async function renderControleResultaten(){
    const { data: ontvangers } = await supabaseClient
      .from('toolbox_controle_ontvangers').select('*').eq('controle_id', actieveControleId);
    const profielIds = (ontvangers||[]).map(o=>o.profiel_id);
    let profielenMap = {};
    if(profielIds.length){
      const { data: profielen } = await supabaseClient.from('profielen').select('id, voornaam, achternaam').in('id', profielIds);
      (profielen||[]).forEach(p => { profielenMap[p.id] = p; });
    }

    const ontvangerIds = (ontvangers||[]).filter(o=>o.beantwoord).map(o=>o.id);
    let antwoordenPerOntvanger = {};
    if(ontvangerIds.length){
      const { data: antwoorden } = await supabaseClient.from('toolbox_controle_antwoorden').select('*, toolbox_controlevragen(vraag, type)').in('ontvanger_id', ontvangerIds);
      (antwoorden||[]).forEach(a => {
        if(a.toolbox_controlevragen && a.toolbox_controlevragen.type === 'open'){
          if(!antwoordenPerOntvanger[a.ontvanger_id]) antwoordenPerOntvanger[a.ontvanger_id] = [];
          antwoordenPerOntvanger[a.ontvanger_id].push({ vraag: a.toolbox_controlevragen.vraag, antwoord: a.antwoord });
        }
      });
    }

    const rows = (ontvangers||[]).map(o => {
      const p = profielenMap[o.profiel_id];
      const openAntwoorden = antwoordenPerOntvanger[o.id] || [];
      return `
        <div class="card">
          <div class="row">
            <span>${p ? p.voornaam + ' ' + p.achternaam : '—'}</span>
            <span class="tag" style="${o.beantwoord ? (o.totaal > 0 && o.score === o.totaal ? 'background:var(--green-dim); color:var(--green);' : (o.totaal > 0 ? 'background:var(--amber-dim); color:var(--amber);' : '')) : ''}">
              ${o.beantwoord ? (o.totaal > 0 ? o.score + '/' + o.totaal + ' goed' : 'Beantwoord') : 'Nog niet beantwoord'}
            </span>
          </div>
          ${openAntwoorden.map(a => `
            <div class="meta" style="margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px;">
              <b>${a.vraag}</b><br>${a.antwoord}
            </div>
          `).join('')}
        </div>`;
    }).join('') || '<div class="meta">Geen ontvangers.</div>';

    return `
      ${renderHoofdTabs()}
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='sessieDetail'; render();">← Terug naar sessie</button>
      <div class="eyebrow" style="margin-top:0">Resultaten</div>
      ${rows}
    `;
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
