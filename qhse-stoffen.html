<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>QHSE — Gevaarlijke Stoffen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; }
  .tab.actief{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  input, textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .tag.cmr{ background:var(--red-dim); color:var(--red); }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem</div>
      <h1>Gevaarlijke Stoffen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab" id="tabRegister" onclick="setTab('register')">Register</div>
    <div class="tab" id="tabAanvragen" onclick="setTab('aanvragen')">Mijn aanvragen</div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  const CMR_ZINNEN = ['H340','H341','H350','H351','H360','H361'];
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  let huidigProfiel = null;
  let tabActief = 'register';
  let zoekterm = '';
  let nieuwOpen = false;
  let gekozenFoto = null;

  function isCMR(stof){ return (stof.h_zinnen||[]).some(z => CMR_ZINNEN.includes(z)); }

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('login-scherm').classList.add('verborgen');
    document.getElementById('app-scherm').classList.remove('verborgen');
    await render();
  }

  function zoekenUitvoeren(){
    zoekterm = document.getElementById('zoekveld').value;
    render();
  }

  function setTab(t){ tabActief = t; render(); }

  async function render(){
    document.getElementById('tabRegister').className = 'tab' + (tabActief==='register' ? ' actief' : '');
    document.getElementById('tabAanvragen').className = 'tab' + (tabActief==='aanvragen' ? ' actief' : '');
    const inhoud = document.getElementById('inhoud');
    inhoud.innerHTML = tabActief === 'register' ? await renderRegister() : await renderAanvragen();
  }

  async function renderRegister(){
    const { data: stoffen, error } = await supabaseClient.from('stoffen').select('*').order('naam');
    if(error) return '<div class="fout">Kon register niet laden: ' + error.message + '</div>';
    const gefilterd = (stoffen||[]).filter(s =>
      !zoekterm || s.naam.toLowerCase().includes(zoekterm.toLowerCase()) || (s.cas_nummer||'').includes(zoekterm)
    );
    const rows = gefilterd.map(s => `
      <div class="card">
        <div class="row">
          <div><b>${s.naam}</b> ${isCMR(s) ? '<span class="tag cmr" style="margin-left:6px">CMR</span>' : ''}</div>
          <span class="meta">${s.cas_nummer || ''}</span>
        </div>
        <div class="meta" style="margin-top:6px">${s.fabrikant || ''}</div>
        ${s.sds_pad ? `<button class="ghost" style="margin-top:8px" onclick="bekijkSDS('${s.sds_pad}')">📄 SDS bekijken</button>` : `<div class="meta" style="margin-top:8px">Nog geen SDS beschikbaar.</div>`}
        <button class="ghost" style="margin-top:8px" onclick="bekijkWik('${s.id}', '${s.naam.replace(/'/g,"\\'")}')">📋 WIK bekijken</button>
      </div>`).join('') || '<div class="meta">Geen stoffen gevonden.</div>';
    return `
      <div class="row" style="gap:8px; margin-bottom:14px">
        <input type="text" id="zoekveld" placeholder="Zoek op naam of volledig CAS-nummer…" value="${zoekterm}" onkeydown="if(event.key==='Enter') zoekenUitvoeren()">
        <button class="primary" onclick="zoekenUitvoeren()" style="flex-shrink:0">Zoeken</button>
      </div>
      ${rows}
    `;
  }

  async function bekijkSDS(pad){
    const { data, error } = await supabaseClient.storage.from('stoffen-bestanden').createSignedUrl(pad, 300);
    if(error){ alert('Kon SDS niet openen: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function bekijkWik(stofId, stofNaam){
    const { data: wik, error } = await supabaseClient.from('wik').select('*').eq('stof_id', stofId).maybeSingle();
    if(error){ alert('Kon WIK niet laden: ' + error.message); return; }
    if(!wik){ alert('Voor deze stof is nog geen WIK opgesteld.'); return; }

    const { data: hzGekoppeld } = await supabaseClient.from('wik_hzinnen_gekoppeld').select('wik_hzinnen(*)').eq('wik_id', wik.id);
    const hZinnen = (hzGekoppeld||[]).map(r=>r.wik_hzinnen).filter(Boolean);
    const { data: pzGekoppeld } = await supabaseClient.from('wik_pzinnen_gekoppeld').select('wik_pzinnen(*)').eq('wik_id', wik.id);
    const pZinnen = (pzGekoppeld||[]).map(r=>r.wik_pzinnen).filter(Boolean);
    const { data: stof } = await supabaseClient.from('stoffen').select('*').eq('id', stofId).single();

    const pictoImgs = await Promise.all((wik.clp_pictogrammen||[]).map(async (code) => {
      const pad = `${huidigProfiel.organisatie_id}/${code}.png`;
      const { data } = await supabaseClient.storage.from('clp-pictogrammen').createSignedUrl(pad, 300);
      return data ? `<img src="${data.signedUrl}" style="width:70px; height:70px; object-fit:contain; margin:4px;">` : '';
    }));

    const venster = window.open('', '_blank');
    venster.document.write(`
      <html><head><title>WIK — ${stofNaam}</title>
      <style>
        body{ font-family: Arial, sans-serif; padding:30px; color:#1c1d1b; }
        h1{ font-size:20px; border-bottom:3px solid #2f6f5e; padding-bottom:8px; }
        h2{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#5a5c57; margin-top:20px; border-bottom:1px solid #ccc; padding-bottom:4px; }
        .zin{ font-size:12px; margin:4px 0; }
        .picto-rij{ display:flex; flex-wrap:wrap; }
        table{ border-collapse:collapse; margin-top:6px; }
        td{ padding:3px 10px 3px 0; font-size:12px; vertical-align:top; }
      </style></head><body>
        <h1>Werkplekinstructiekaart — ${stofNaam}</h1>
        <table>
          <tr><td><b>CAS-nummer</b></td><td>${stof.cas_nummer || '—'}</td></tr>
          <tr><td><b>Fabrikant</b></td><td>${stof.fabrikant || '—'}</td></tr>
        </table>
        <h2>Gevarenpictogrammen</h2>
        <div class="picto-rij">${pictoImgs.join('') || '<i>geen geselecteerd</i>'}</div>
        <h2>H-/EUH-zinnen</h2>
        ${hZinnen.map(z => `<div class="zin"><b>${z.code}</b> — ${z.tekst}</div>`).join('') || '<i>geen</i>'}
        <h2>P-zinnen</h2>
        ${pZinnen.map(z => `<div class="zin"><b>${z.code}</b> — ${z.tekst}</div>`).join('') || '<i>geen</i>'}
        <h2>Persoonlijke beschermingsmiddelen</h2><div class="zin">${(wik.pbm||'—').replace(/\n/g,'<br>')}</div>
        <h2>EHBO</h2><div class="zin">${(wik.ehbo||'—').replace(/\n/g,'<br>')}</div>
        <h2>Calamiteiten / brand</h2><div class="zin">${(wik.calamiteiten||'—').replace(/\n/g,'<br>')}</div>
        <h2>Opslag / afval</h2><div class="zin">${(wik.opslag_afval||'—').replace(/\n/g,'<br>')}</div>
        ${wik.extra_tekst ? `<h2>Extra toelichting</h2><div class="zin">${wik.extra_tekst.replace(/\n/g,'<br>')}</div>` : ''}
        <p style="margin-top:30px; font-size:10px; color:#999;">Opgesteld/gecontroleerd door een deskundige persoon (bijv. een arbeidshygiënist of toxicoloog).</p>
      </body></html>
    `);
    venster.document.close();
  }

  async function renderAanvragen(){
    const { data: aanvragen, error } = await supabaseClient
      .from('stof_aanvragen').select('*').eq('aanvrager_id', huidigProfiel.id).order('aangemaakt_op', { ascending:false });
    if(error) return '<div class="fout">Kon aanvragen niet laden: ' + error.message + '</div>';
    const rows = (aanvragen||[]).map(a => `
      <div class="card">
        <div class="row">
          <b>${a.naam}</b>
          <span class="tag" style="${a.status==='afgehandeld' ? 'background:var(--green-dim); color:var(--green);' : 'background:var(--amber-dim); color:var(--amber);'}">${a.status}</span>
        </div>
        <div class="meta" style="margin-top:6px">${a.fabrikant || ''}</div>
      </div>`).join('') || '<div class="meta">Je hebt nog geen stoffen aangevraagd.</div>';

    return `
      <button class="primary" style="margin-bottom:14px" onclick="toggleNieuw()">${nieuwOpen ? 'Annuleren' : '+ Nieuwe stof aanvragen'}</button>
      ${nieuwOpen ? renderNieuwFormulier() : ''}
      ${rows}
    `;
  }

  function toggleNieuw(){ nieuwOpen = !nieuwOpen; gekozenFoto = null; render(); }

  function renderNieuwFormulier(){
    return `
      <div class="card">
        <label style="margin-top:0">Naam van de stof</label>
        <input type="text" id="aanvNaam">
        <label>Fabrikant</label>
        <input type="text" id="aanvFabrikant">
        <label>Omschrijving</label>
        <textarea rows="3" id="aanvOmschrijving"></textarea>
        <label>Foto (verplicht)</label>
        <input type="file" accept="image/*" capture="environment" id="aanvFoto">
        <div class="row" style="margin-top:14px">
          <span></span>
          <button class="primary" onclick="verstuurAanvraag()">Aanvraag versturen</button>
        </div>
        <div class="fout verborgen" id="aanvFout"></div>
      </div>
    `;
  }

  async function verstuurAanvraag(){
    const naam = document.getElementById('aanvNaam').value.trim();
    const fabrikant = document.getElementById('aanvFabrikant').value.trim() || null;
    const omschrijving = document.getElementById('aanvOmschrijving').value.trim() || null;
    const fotoInput = document.getElementById('aanvFoto');
    const foutEl = document.getElementById('aanvFout');
    foutEl.classList.add('verborgen');

    if(!naam){ foutEl.textContent = 'Vul een naam in.'; foutEl.classList.remove('verborgen'); return; }
    if(!fotoInput.files[0]){ foutEl.textContent = 'Een foto is verplicht.'; foutEl.classList.remove('verborgen'); return; }

    const file = fotoInput.files[0];
    const extensie = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const pad = `${huidigProfiel.organisatie_id}/aanvragen/${Date.now()}.${extensie}`;
    const { error: uploadFout } = await supabaseClient.storage.from('stoffen-bestanden').upload(pad, file);
    if(uploadFout){ foutEl.textContent = 'Foto uploaden mislukt: ' + uploadFout.message; foutEl.classList.remove('verborgen'); return; }

    const { error } = await supabaseClient.from('stof_aanvragen').insert({
      organisatie_id: huidigProfiel.organisatie_id, aanvrager_id: huidigProfiel.id,
      naam, fabrikant, omschrijving, foto_pad: pad
    });
    if(error){ foutEl.textContent = 'Versturen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }

    nieuwOpen = false;
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
