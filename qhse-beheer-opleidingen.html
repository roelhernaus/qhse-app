<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QHSE — Beheer Opleidingen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e3df; --text:#1c1d1b; --text-soft:#5a5c57;
    --accent:#2f6f5e; --accent-dim:rgba(47,111,94,0.10); --amber:#b57a10; --amber-dim:#f6e3bd;
    --red:#c0392b; --red-dim:#fbeae8; --green:#1c9468; --green-dim:#d3f1e3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
  .wrap{ max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .whoami{ font-size:12.5px; color:var(--text-soft); }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:#fff; padding:9px 14px; font-size:13px; font-weight:600; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  input, select, textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fafaf9; }
  label{ display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:10px; }
  .card.klikbaar{ cursor:pointer; }
  .card.klikbaar:hover{ border-color:var(--accent); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:#eee; }
  .meta{ font-size:12px; color:var(--text-soft); }
  .fout{ background:var(--red-dim); color:var(--red); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .melding{ background:var(--green-dim); color:var(--green); font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  #login-scherm{ max-width:400px; margin:80px auto; }
  .verborgen{ display:none; }
  .vraagblok{ border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; }
</style>
</head>
<body>

<div id="laad-scherm" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="font-size:13px; color:var(--text-soft, #5a5c57);">Laden…</div>
</div>

<div id="login-scherm" class="wrap verborgen">
  <div class="eyebrow">QHSE-systeem</div>
  <h1 style="margin-bottom:18px">Inloggen</h1>
  <div class="card">
    <label>E-mailadres</label>
    <input type="email" id="loginEmail">
    <label>Wachtwoord</label>
    <input type="password" id="loginWachtwoord">
    <button class="primary" style="width:100%; margin-top:16px" onclick="login()">Inloggen</button>
    <div class="fout verborgen" id="loginFout"></div>
  </div>
</div>

<div id="geen-toegang" class="wrap verborgen">
  <div class="card">
    <b>Geen toegang</b>
    <p class="meta" style="margin-top:8px">Dit beheerscherm is alleen voor Admin of KAM.</p>
    <button class="ghost" style="margin-top:10px" onclick="uitloggen()">Uitloggen</button>
  </div>
</div>

<div id="app-scherm" class="wrap verborgen">
  <div class="topbar">
    <div>
      <div class="eyebrow">QHSE-systeem — Beheer</div>
      <h1>Opleidingen</h1>
    </div>
    <div style="text-align:right">
      <div class="whoami" id="wieBenIk">—</div>
      <button class="ghost" style="margin-top:6px" onclick="uitloggen()">Uitloggen</button>
    </div>
  </div>
  <div id="inhoud"></div>
</div>

<script>
  const SUPABASE_URL = "https://ijxyikkwufmmvpfksarx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j2TMYgukTXBMoBW1mv_w2w_3OUxsjBo";
  let supabaseClient = null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error(e); }

  let huidigProfiel = null;
  let scherm = 'lijst';
  let actiefId = null;
  let nieuweVragen = [];

  async function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const wachtwoord = document.getElementById('loginWachtwoord').value;
    const foutEl = document.getElementById('loginFout');
    foutEl.classList.add('verborgen');
    if(!supabaseClient){ foutEl.textContent = 'Supabase niet geladen.'; foutEl.classList.remove('verborgen'); return; }
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: wachtwoord });
      if(error){ foutEl.textContent = 'Inloggen mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
      await initApp();
    }catch(e){
      foutEl.textContent = 'Onverwachte fout: ' + (e && e.message ? e.message : e);
      foutEl.classList.remove('verborgen');
    }
  }
  async function uitloggen(){
    await supabaseClient.auth.signOut();
    document.getElementById('app-scherm').classList.add('verborgen');
    document.getElementById('geen-toegang').classList.add('verborgen');
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
  async function initApp(){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    const { data: profiel, error } = await supabaseClient
      .from('profielen').select('id, voornaam, achternaam, rol, organisatie_id').eq('id', user.id).single();
    if(error){ alert('Kon profiel niet laden: ' + error.message); return; }
    huidigProfiel = profiel;
    document.getElementById('login-scherm').classList.add('verborgen');
    if(!['admin','kam'].includes(profiel.rol)){
      document.getElementById('geen-toegang').classList.remove('verborgen');
      return;
    }
    document.getElementById('wieBenIk').textContent = profiel.voornaam + ' ' + profiel.achternaam + ' · ' + profiel.rol;
    document.getElementById('app-scherm').classList.remove('verborgen');
    scherm = 'lijst';
    await render();
  }

  async function render(){
    const inhoud = document.getElementById('inhoud');
    if(scherm === 'lijst') inhoud.innerHTML = await renderLijst();
    else if(scherm === 'opleiding') inhoud.innerHTML = await renderOpleiding();
    else if(scherm === 'nieuweVersie') inhoud.innerHTML = renderNieuweVersie();
    else if(scherm === 'soorten') inhoud.innerHTML = await renderSoorten();
  }

  async function renderSoorten(){
    const { data: soorten, error } = await supabaseClient.from('opleiding_soorten').select('*').order('naam');
    if(error) return '<div class="fout">Kon soorten niet laden: ' + error.message + '</div>';
    const rows = (soorten||[]).map(s => `
      <div class="card row">
        <div>${s.naam} ${s.is_alert ? '<span class="tag" style="background:var(--red-dim); color:var(--red); margin-left:6px">⚠️ Alert</span>' : ''}</div>
        <button class="ghost" onclick="verwijderSoort('${s.id}')">Verwijderen</button>
      </div>`).join('') || '<div class="meta">Nog geen soorten.</div>';
    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(soorten||[]).length} soorten</span>
        <button class="primary" onclick="nieuweSoort()">+ Nieuwe soort</button>
      </div>
      <div class="meta" style="margin-bottom:12px">Het vinkje "Alert" zorgt dat opleidingen van dat type altijd rood/opvallend getoond worden en verplicht voor iedereen zijn (koppeling kan dan niet beperkt worden tot een groep).</div>
      ${rows}
    `;
  }

  async function nieuweSoort(){
    const naam = prompt('Naam van de nieuwe soort:');
    if(!naam) return;
    const is_alert = confirm('Is dit een "Alert"-soort? (altijd rood, altijd verplicht voor iedereen)\\n\\nOK = ja, dit is een alert\\nAnnuleren = nee, gewone soort');
    const { error } = await supabaseClient.from('opleiding_soorten').insert({ organisatie_id: huidigProfiel.organisatie_id, naam, is_alert });
    if(error){ alert('Aanmaken mislukt: ' + error.message); return; }
    await render();
  }

  async function verwijderSoort(id){
    if(!confirm('Deze soort verwijderen?')) return;
    const { error } = await supabaseClient.from('opleiding_soorten').delete().eq('id', id);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    await render();
  }

  async function renderLijst(){
    const { data: opleidingen, error } = await supabaseClient.from('opleidingen').select('*, groepen(naam), opleiding_soorten(naam, is_alert)').order('naam');
    if(error) return '<div class="fout">Kon opleidingen niet laden: ' + error.message + '</div>';
    const rows = (opleidingen||[]).map(o => `
      <div class="card klikbaar" onclick="openOpleiding('${o.id}')">
        <div class="row">
          <div>
            <b>${o.naam}</b> <span class="meta">${o.code || ''}</span>
            ${o.opleiding_soorten ? `<span class="tag" style="margin-left:6px; ${o.opleiding_soorten.is_alert ? 'background:var(--red-dim); color:var(--red);' : ''}">${o.opleiding_soorten.is_alert ? '⚠️ ' : ''}${o.opleiding_soorten.naam}</span>` : ''}
          </div>
          <span class="meta">${o.koppeling_type === 'iedereen' ? 'Iedereen' : (o.groepen ? o.groepen.naam : 'Groep')}</span>
        </div>
        <div class="meta" style="margin-top:6px">Interval: ${o.interval_maanden} maanden ${o.pdf_pad ? '· 📄 materiaal aanwezig' : '· <span style="color:var(--red)">geen materiaal</span>'}</div>
      </div>`).join('') || '<div class="meta">Nog geen opleidingen.</div>';
    return `
      <div class="row" style="margin-bottom:16px">
        <span class="meta">${(opleidingen||[]).length} opleidingen</span>
        <div style="display:flex; gap:8px">
          <button class="ghost" onclick="scherm='soorten'; render();">Soorten beheren</button>
          <button class="primary" onclick="nieuweOpleiding()">+ Nieuwe opleiding</button>
        </div>
      </div>
      ${rows}
    `;
  }

  async function nieuweOpleiding(){
    const naam = prompt('Naam van de nieuwe opleiding:');
    if(!naam) return;
    const { data, error } = await supabaseClient
      .from('opleidingen').insert({ organisatie_id: huidigProfiel.organisatie_id, naam, koppeling_type: 'iedereen' })
      .select().single();
    if(error){ alert('Aanmaken mislukt: ' + error.message); return; }
    actiefId = data.id;
    scherm = 'opleiding';
    await render();
  }

  async function openOpleiding(id){
    actiefId = id;
    scherm = 'opleiding';
    await render();
  }

  async function renderOpleiding(){
    const { data: o, error } = await supabaseClient.from('opleidingen').select('*').eq('id', actiefId).single();
    if(error) return '<div class="fout">Kon opleiding niet laden: ' + error.message + '</div>';
    const { data: groepen } = await supabaseClient.from('groepen').select('*').order('naam');
    const { data: soorten } = await supabaseClient.from('opleiding_soorten').select('*').order('naam');
    const { data: versies } = await supabaseClient
      .from('opleiding_versies').select('*').eq('opleiding_id', actiefId).order('versienummer', { ascending:false });
    const versieIds = (versies||[]).map(v=>v.id);
    let pogingen = [];
    if(versieIds.length){
      const { data } = await supabaseClient
        .from('opleiding_pogingen').select('*, profielen(voornaam, achternaam)')
        .in('versie_id', versieIds).order('afgerond_op', { ascending:false });
      pogingen = data || [];
    }

    const versieRows = (versies||[]).map(v => `
      <div class="card">
        <div class="row">
          <span>Versie ${v.versienummer} ${v.actief ? '<span class="tag" style="background:var(--green-dim); color:var(--green); margin-left:6px">Actief</span>' : ''}</span>
          <span class="meta">${new Date(v.aangemaakt_op).toLocaleDateString('nl-NL')}</span>
        </div>
        <div class="meta" style="margin-top:6px">${v.wijzigingslog}</div>
      </div>`).join('') || '<div class="meta">Nog geen versies.</div>';

    const pogingRows = pogingen.slice(0,10).map(p => `
      <div class="card">
        <div class="row">
          <span>${p.profielen ? p.profielen.voornaam + ' ' + p.profielen.achternaam : '—'}</span>
          <span class="tag" style="${p.geslaagd ? 'background:var(--green-dim); color:var(--green);' : 'background:var(--red-dim); color:var(--red);'}">${p.geslaagd ? 'Geslaagd' : 'Gezakt'} — ${p.score}%</span>
        </div>
        <div class="meta" style="margin-top:4px">${new Date(p.afgerond_op).toLocaleString('nl-NL')}</div>
      </div>`).join('') || '<div class="meta">Nog geen pogingen.</div>';

    const huidigeSoort = (soorten||[]).find(s => s.id === o.soort_id);
    const isAlert = huidigeSoort ? huidigeSoort.is_alert : false;

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='lijst'; render();">← Terug naar overzicht</button>
      <div class="card">
        <label style="margin-top:0">Naam</label>
        <input type="text" id="bewNaam" value="${o.naam}">
        <label>Code</label>
        <input type="text" id="bewCode" value="${o.code || ''}">
        <label>Soort</label>
        <select id="bewSoort" onchange="toggleAlertKoppeling()">
          <option value="">— geen soort —</option>
          ${(soorten||[]).map(s => `<option value="${s.id}" data-alert="${s.is_alert}" ${o.soort_id===s.id?'selected':''}>${s.naam}${s.is_alert?' (Alert)':''}</option>`).join('')}
        </select>
        <label>Interval (maanden)</label>
        <input type="number" id="bewInterval" value="${o.interval_maanden}">
        <label>Minimale kijktijd voor het lezen van het materiaal (seconden)</label>
        <input type="number" id="bewKijktijd" min="0" value="${o.minimale_kijktijd_seconden ?? 10}">
        <div class="meta" style="margin-top:4px">Standaard 10 seconden. Zet dit hoger voor opleidingen met een wettelijk verplichte minimale instructietijd (bijv. werken met di-isocyanaten).</div>
        <label>Toegewezen aan</label>
        <select id="bewKoppelType" ${isAlert?'disabled':''}>
          <option value="iedereen" ${o.koppeling_type==='iedereen' || isAlert?'selected':''}>Iedereen</option>
          <option value="groep" ${o.koppeling_type==='groep' && !isAlert?'selected':''}>Specifieke groep</option>
        </select>
        <select id="bewGroep" style="margin-top:8px" ${isAlert?'disabled':''}>
          <option value="">— kies een groep —</option>
          ${(groepen||[]).map(g => `<option value="${g.id}" ${o.koppeling_groep_id===g.id?'selected':''}>${g.naam}</option>`).join('')}
        </select>
        <div class="meta" id="alertUitleg" style="margin-top:4px; ${isAlert?'':'display:none'}">Een Alert is altijd voor iedereen — koppeling aan een specifieke groep is uitgeschakeld.</div>

        <label>Opleidingsmateriaal (PDF, verplicht)</label>
        <div class="row">
          <span class="meta" id="materiaalAanwezig">${o.pdf_pad ? '📄 Materiaal gekoppeld' : '⚠️ Nog geen materiaal'}</span>
          <label class="ghost" style="display:inline-block; padding:8px 13px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; margin:0;">
            ${o.pdf_pad ? 'Vervangen' : 'PDF toevoegen'}
            <input type="file" accept="application/pdf" style="display:none" onchange="uploadOpleidingMateriaal(this)">
          </label>
        </div>
        <div class="meta" id="materiaalStatus" style="margin-top:6px"></div>

        <div class="row" style="margin-top:16px">
          <button class="ghost" onclick="verwijderOpleiding()">Verwijderen</button>
          <button class="primary" onclick="opslaanOpleiding()">Opslaan</button>
        </div>
        <div class="fout verborgen" id="bewFout"></div>
        <div class="melding verborgen" id="bewMelding"></div>
      </div>

      <div class="eyebrow" style="margin-top:22px">Versies</div>
      <button class="primary" style="margin-bottom:10px" onclick="nieuweVersie()">+ Nieuwe versie uitgeven</button>
      ${versieRows}

      <div class="eyebrow" style="margin-top:22px">Recente pogingen</div>
      ${pogingRows}
    `;
  }

  function toggleAlertKoppeling(){
    const select = document.getElementById('bewSoort');
    const optie = select.options[select.selectedIndex];
    const isAlert = optie && optie.dataset.alert === 'true';
    document.getElementById('bewKoppelType').disabled = isAlert;
    document.getElementById('bewGroep').disabled = isAlert;
    if(isAlert) document.getElementById('bewKoppelType').value = 'iedereen';
    document.getElementById('alertUitleg').style.display = isAlert ? 'block' : 'none';
  }

  async function uploadOpleidingMateriaal(inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    const statusEl = document.getElementById('materiaalStatus');
    statusEl.textContent = 'Uploaden…';
    const pad = `${huidigProfiel.organisatie_id}/${actiefId}-${Date.now()}.pdf`;
    const { error: uploadFout } = await supabaseClient.storage.from('opleiding-materiaal').upload(pad, file);
    if(uploadFout){ statusEl.textContent = 'Upload mislukt: ' + uploadFout.message; return; }
    const { error: updateFout } = await supabaseClient.from('opleidingen').update({ pdf_pad: pad }).eq('id', actiefId);
    if(updateFout){ statusEl.textContent = 'Koppelen mislukt: ' + updateFout.message; return; }
    statusEl.textContent = '✓ Materiaal geüpload.';
    document.getElementById('materiaalAanwezig').textContent = '📄 Materiaal gekoppeld';
    inputEl.parentElement.firstChild.textContent = 'Vervangen';
  }

  async function opslaanOpleiding(){
    const naam = document.getElementById('bewNaam').value.trim();
    const code = document.getElementById('bewCode').value.trim() || null;
    const soort_id = document.getElementById('bewSoort').value || null;
    const interval_maanden = parseInt(document.getElementById('bewInterval').value) || 12;
    const minimale_kijktijd_seconden = parseInt(document.getElementById('bewKijktijd').value) || 0;
    const koppeling_type = document.getElementById('bewKoppelType').value;
    const koppeling_groep_id = koppeling_type === 'groep' ? (document.getElementById('bewGroep').value || null) : null;
    const foutEl = document.getElementById('bewFout');
    const meldingEl = document.getElementById('bewMelding');
    foutEl.classList.add('verborgen'); meldingEl.classList.add('verborgen');
    const { error } = await supabaseClient.from('opleidingen')
      .update({ naam, code, soort_id, interval_maanden, minimale_kijktijd_seconden, koppeling_type, koppeling_groep_id }).eq('id', actiefId);
    if(error){ foutEl.textContent = 'Opslaan mislukt: ' + error.message; foutEl.classList.remove('verborgen'); return; }
    meldingEl.textContent = '✓ Opgeslagen.'; meldingEl.classList.remove('verborgen');
    await render();
  }

  async function verwijderOpleiding(){
    if(!confirm('Deze opleiding, inclusief alle versies en pogingen, definitief verwijderen?')) return;
    const { error } = await supabaseClient.from('opleidingen').delete().eq('id', actiefId);
    if(error){ alert('Verwijderen mislukt: ' + error.message); return; }
    actiefId = null; scherm = 'lijst'; await render();
  }

  async function nieuweVersie(){
    const { data: o } = await supabaseClient.from('opleidingen').select('pdf_pad').eq('id', actiefId).single();
    if(!o.pdf_pad){
      alert('Voeg eerst opleidingsmateriaal (PDF) toe voordat je een versie kunt uitgeven.');
      return;
    }
    const { data: actieveVersie } = await supabaseClient.from('opleiding_versies').select('id').eq('opleiding_id', actiefId).eq('actief', true).maybeSingle();
    if(actieveVersie){
      const { data: bestaandeVragen } = await supabaseClient.from('opleiding_vragen').select('*').eq('versie_id', actieveVersie.id).order('volgorde');
      if(bestaandeVragen && bestaandeVragen.length){
        nieuweVragen = bestaandeVragen.map(v => ({
          tekst: v.tekst, type: v.type, juist: v.juiste_antwoord,
          a: v.optie_a || '', b: v.optie_b || '', c: v.optie_c || '', d: v.optie_d || ''
        }));
        scherm = 'nieuweVersie';
        render();
        return;
      }
    }
    nieuweVragen = [
      { tekst:'', type:'ja/nee', juist:'ja', a:'', b:'', c:'', d:'' },
      { tekst:'', type:'ja/nee', juist:'ja', a:'', b:'', c:'', d:'' },
      { tekst:'', type:'ja/nee', juist:'ja', a:'', b:'', c:'', d:'' },
    ];
    scherm = 'nieuweVersie';
    render();
  }
  function voegVraagToe(){
    if(nieuweVragen.length >= 15){ alert('Maximaal 15 vragen per versie.'); return; }
    nieuweVragen.push({ tekst:'', type:'ja/nee', juist:'ja', a:'', b:'', c:'', d:'' });
    render();
  }
  function verwijderVraag(i){
    if(nieuweVragen.length <= 3){ alert('Minimaal 3 vragen verplicht.'); return; }
    nieuweVragen.splice(i,1);
    render();
  }
  function wisselVraagType(i, nieuwType){
    nieuweVragen[i].type = nieuwType;
    nieuweVragen[i].juist = nieuwType === 'ja/nee' ? 'ja' : 'A';
    render();
  }
  function bewerkVraag(i, veld, waarde){
    nieuweVragen[i][veld] = waarde;
  }

  function renderNieuweVersie(){
    const vraagBlokken = nieuweVragen.map((v,i) => `
      <div class="vraagblok">
        <div class="row"><b>Vraag ${i+1}</b><button class="ghost" onclick="verwijderVraag(${i})">Verwijderen</button></div>
        <label>Vraagtekst</label>
        <textarea rows="2" oninput="bewerkVraag(${i},'tekst',this.value)">${v.tekst}</textarea>
        <label>Type</label>
        <select onchange="wisselVraagType(${i},this.value)">
          <option value="ja/nee" ${v.type==='ja/nee'?'selected':''}>Ja/Nee</option>
          <option value="meerkeuze" ${v.type==='meerkeuze'?'selected':''}>Meerkeuze (A/B/C/D)</option>
        </select>
        ${v.type==='ja/nee' ? `
          <label>Juiste antwoord</label>
          <select onchange="bewerkVraag(${i},'juist',this.value)">
            <option value="ja" ${v.juist==='ja'?'selected':''}>Ja</option>
            <option value="nee" ${v.juist==='nee'?'selected':''}>Nee</option>
          </select>
        ` : `
          <label>Optie A</label><input type="text" value="${v.a}" oninput="bewerkVraag(${i},'a',this.value)">
          <label>Optie B</label><input type="text" value="${v.b}" oninput="bewerkVraag(${i},'b',this.value)">
          <label>Optie C</label><input type="text" value="${v.c}" oninput="bewerkVraag(${i},'c',this.value)">
          <label>Optie D</label><input type="text" value="${v.d}" oninput="bewerkVraag(${i},'d',this.value)">
          <label>Juiste optie</label>
          <select onchange="bewerkVraag(${i},'juist',this.value)">
            ${['A','B','C','D'].map(l => `<option value="${l}" ${v.juist===l?'selected':''}>${l}</option>`).join('')}
          </select>
        `}
      </div>
    `).join('');

    return `
      <button class="ghost" style="margin-bottom:14px" onclick="scherm='opleiding'; render();">← Annuleren</button>
      <div class="card">
        <label style="margin-top:0">Wijzigingslog (verplicht — wat is er veranderd?)</label>
        <textarea rows="3" id="nvWijzigingslog" placeholder="Bijv. 'Vraag 2 aangescherpt na incident X'"></textarea>
        <div class="eyebrow" style="margin-top:16px">Vragen (${nieuweVragen.length}/15, minimaal 3)</div>
        ${vraagBlokken}
        <button class="ghost" style="margin-top:10px" onclick="voegVraagToe()" ${nieuweVragen.length>=15?'disabled':''}>+ Vraag toevoegen</button>
        <div class="row" style="margin-top:18px">
          <span></span>
          <button class="primary" onclick="publiceerVersie()">Nieuwe versie publiceren</button>
        </div>
        <div class="fout verborgen" id="nvFout"></div>
      </div>
    `;
  }

  async function publiceerVersie(){
    const wijzigingslog = document.getElementById('nvWijzigingslog').value.trim();
    const foutEl = document.getElementById('nvFout');
    foutEl.classList.add('verborgen');

    if(!wijzigingslog){ foutEl.textContent = 'Wijzigingslog is verplicht.'; foutEl.classList.remove('verborgen'); return; }
    if(nieuweVragen.length < 3){ foutEl.textContent = 'Minimaal 3 vragen verplicht.'; foutEl.classList.remove('verborgen'); return; }
    for(const v of nieuweVragen){
      if(!v.tekst.trim()){ foutEl.textContent = 'Elke vraag moet een vraagtekst hebben.'; foutEl.classList.remove('verborgen'); return; }
      if(v.type==='meerkeuze' && (!v.a.trim() || !v.b.trim() || !v.c.trim() || !v.d.trim())){
        foutEl.textContent = 'Bij meerkeuze moeten alle vier de opties ingevuld zijn.'; foutEl.classList.remove('verborgen'); return;
      }
    }

    await supabaseClient.from('opleiding_versies').update({ actief: false }).eq('opleiding_id', actiefId).eq('actief', true);

    const { data: bestaande } = await supabaseClient.from('opleiding_versies').select('versienummer').eq('opleiding_id', actiefId).order('versienummer', { ascending:false }).limit(1);
    const volgendVersienummer = bestaande && bestaande.length ? bestaande[0].versienummer + 1 : 1;

    const { data: versie, error: versieFout } = await supabaseClient
      .from('opleiding_versies').insert({ opleiding_id: actiefId, versienummer: volgendVersienummer, wijzigingslog, actief: true })
      .select().single();
    if(versieFout){ foutEl.textContent = 'Publiceren mislukt: ' + versieFout.message; foutEl.classList.remove('verborgen'); return; }

    const vraagRijen = nieuweVragen.map((v,i) => ({
      versie_id: versie.id, tekst: v.tekst, type: v.type, juiste_antwoord: v.juist,
      optie_a: v.type==='meerkeuze' ? v.a : null, optie_b: v.type==='meerkeuze' ? v.b : null,
      optie_c: v.type==='meerkeuze' ? v.c : null, optie_d: v.type==='meerkeuze' ? v.d : null,
      volgorde: i+1
    }));
    const { error: vragenFout } = await supabaseClient.from('opleiding_vragen').insert(vraagRijen);
    if(vragenFout){ foutEl.textContent = 'Vragen opslaan mislukt: ' + vragenFout.message; foutEl.classList.remove('verborgen'); return; }

    scherm = 'opleiding';
    await render();
  }

  if(supabaseClient){
    supabaseClient.auth.getSession().then(({ data:{ session } }) => {
      document.getElementById('laad-scherm').style.display = 'none';
      if(session) initApp();
      else document.getElementById('login-scherm').classList.remove('verborgen');
    });
  } else {
    document.getElementById('laad-scherm').style.display = 'none';
    document.getElementById('login-scherm').classList.remove('verborgen');
  }
</script>
</body>
</html>
